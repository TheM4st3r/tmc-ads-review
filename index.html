  {id:43, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video MID: Blood Flow (Expanded)", title_pt:"ACQ Vídeo MID: Fluxo Sanguíneo (Expandido)", angle_en:"Complete blood flow → pump → results connection", angle_pt:"Conexão completa fluxo sanguíneo → pump → resultados", hookCopy_en:"Hook A: \"I lost my pump at 51. Thought it was over. Turns out I was missing one thing — not more reps.\" | Hook B: \"That flat, empty feeling after a workout isn't effort — it's not what you think.\" | Hook C: \"Your pump didn't disappear because you're older. It disappeared because your blood vessels stopped cooperating.\"", hookCopy_pt:"Hook A: \"Perdi meu pump aos 51. Pensei que tinha acabado. Acontece que eu estava perdendo uma coisa — não mais reps.\" | Hook B: \"Aquela sensação chapada e vazia depois do treino não é esforço — não é o que você pensa.\" | Hook C: \"Seu pump não desapareceu porque você está mais velho. Desapareceu porque seus vasos sanguíneos pararam de cooperar.\"", hookVisual_en:"B-roll of arms pumped vs flat, speaker walks into frame", hookVisual_pt:"B-roll de braços pumped vs chapados, speaker entra no quadro", format_en:"UGC Talking Head + gym B-roll | 2:20 (~448 words)", format_pt:"UGC Talking Head + B-roll de academia | 2:20 (~448 palavras)", speaker_en:"Male 50-58, experienced, gym setting", speaker_pt:"Homem 50-58, experiente, ambiente de academia", execution_en:"Story: lost pump gradually, tried everything. Research: NO declines → blood vessels lose elasticity. 'The pump IS the delivery system.' L-citrulline → NO → vasodilation. TMC. 'Week 2, tightness during curls. Week 4, pump back like 35.' CTA.", execution_pt:"História: perdeu o pump gradualmente, tentou tudo. Pesquisa: NO declina → vasos sanguíneos perdem elasticidade. 'O pump É o sistema de entrega.' L-citrulina → NO → vasodilatação. TMC. 'Semana 2, tensão durante curls. Semana 4, pump voltou como aos 35.' CTA."},
  {id:44, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video MID: Mineral That Frees T (Expanded)", title_pt:"ACQ Vídeo MID: O Mineral Que Libera T (Expandido)", angle_en:"SHBG trap — why total T doesn't matter as much as free T", angle_pt:"Armadilha do SHBG — por que T total não importa tanto quanto T livre", hookCopy_en:"Hook A: \"Your testosterone might not be low. It might be TRAPPED.\" | Hook B: \"Your doctor checked total testosterone and said 'you're fine.' He didn't check the number that actually matters.\" | Hook C: \"The single most important number for men over 50 — and your doctor probably never tested it.\"", hookCopy_pt:"Hook A: \"Sua testosterona pode não estar baixa. Pode estar APRISIONADA.\" | Hook B: \"Seu médico checou testosterona total e disse 'você está bem.' Ele não checou o número que realmente importa.\" | Hook C: \"O número mais importante pra homens acima de 50 — e seu médico provavelmente nunca testou.\"", hookVisual_en:"Speaker drawing on whiteboard: 'TOTAL T = 600' vs 'FREE T = 12'", hookVisual_pt:"Speaker desenhando no quadro branco: 'T TOTAL = 600' vs 'T LIVRE = 12'", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 50-60, analytical/engineer type", speaker_pt:"Homem 50-60, tipo analítico/engenheiro", execution_en:"Educational: total T vs free T. 'Doctor says 500, you're normal. But SHBG binding 98%.' SHBG increases with age. Boron 10mg/day reduces SHBG. Tongkat + ashwa complement. 'TMC has all three. One cup targets the REAL number.' CTA.", execution_pt:"Educacional: T total vs T livre. 'Médico diz 500, você está normal. Mas SHBG ligando 98%.' SHBG aumenta com idade. Boro 10mg/dia reduz SHBG. Tongkat + ashwa complementam. 'TMC tem os três. Uma xícara mira no número REAL.' CTA."},
  {id:45, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video MID: Age 67 Still Getting Pumps", title_pt:"ACQ Vídeo MID: 67 Anos Ainda Tendo Pumps", angle_en:"Visual proof that pump + muscle doesn't have to fade with age", angle_pt:"Prova visual de que pump + músculo não precisa desaparecer com a idade", hookCopy_en:"Hook A: \"I'm 62. I still get pumps that men half my age envy. Want to know my secret?\" | Hook B: \"Most men accept losing their pump after 50. I didn't. Here's what I did differently.\" | Hook C: \"At 62, my doctor said my testosterone levels look like a 35-year-old's. He asked what I was taking.\"", hookCopy_pt:"Hook A: \"Tenho 62. Ainda tenho pumps que homens com metade da minha idade invejam. Quer saber meu segredo?\" | Hook B: \"A maioria dos homens aceita perder o pump depois dos 50. Eu não. Aqui está o que fiz diferente.\" | Hook C: \"Aos 62, meu médico disse que meus níveis de testosterona parecem de um cara de 35. Ele perguntou o que eu estava tomando.\"", hookVisual_en:"Speaker flexes, clearly muscular for age, grins at camera", hookVisual_pt:"Speaker flexiona, claramente musculoso pra idade, sorri pra câmera", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 55-65, visibly fit, impressive for age", speaker_pt:"Homem 55-65, visivelmente em forma, impressionante pra idade", execution_en:"Visual proof opening. 'Not genetic. Not TRT. Not professional.' Started losing pump in 50s. Research: hormonal support. TMC daily. 'By 3 months, my doctor was asking ME what I was taking.' CTA.", execution_pt:"Abertura com prova visual. 'Não é genética. Não é TRT. Não sou profissional.' Começou a perder pump nos 50. Pesquisa: suporte hormonal. TMC diário. 'Em 3 meses, meu médico estava perguntando A MIM o que eu estava tomando.' CTA."},
  {id:46, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video LONG: Age-Defying Proof (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Prova Desafiando Idade (Mini-VSL)", angle_en:"Complete story of defying age-related muscle/pump loss", angle_pt:"História completa de desafiar perda de músculo/pump relacionada à idade", hookCopy_en:"Hook A: \"I'm 63 years old. What I'm about to show you should be impossible — according to my doctor.\" | Hook B: \"Everyone told me the pump, the muscle, the energy — it all fades after 50. They were wrong.\" | Hook C: \"The truth about muscle and aging that the fitness industry doesn't want men over 50 to know.\"", hookCopy_pt:"Hook A: \"Tenho 63 anos. O que vou te mostrar deveria ser impossível — segundo meu médico.\" | Hook B: \"Todos me disseram que o pump, o músculo, a energia — tudo desaparece depois dos 50. Estavam errados.\" | Hook C: \"A verdade sobre músculo e envelhecimento que a indústria de fitness não quer que homens acima de 50 saibam.\"", hookVisual_en:"Speaker in gym, racks heavy weight, turns to camera: 'I'm 63. I need to tell you something about what's possible.'", hookVisual_pt:"Speaker na academia, racks peso pesado, vira pra câmera: 'Tenho 63. Preciso te contar algo sobre o que é possível.'", format_en:"UGC Talking Head + gym B-roll | 4:30 (~864 words)", format_pt:"UGC Talking Head + B-roll de academia | 4:30 (~864 palavras)", speaker_en:"Male 58-65, impressive physique, authoritative", speaker_pt:"Homem 58-65, físico impressionante, com autoridade", execution_en:"Mini-VSL. Visual proof. Story from serious lifter to decline at 52. Doctor: 'It's age.' Research: T → blood flow → pump → recovery cascade. Ashwa + tongkat + boron + shilajit + L-citrulline. TMC: one cup. Progressive results. Doctor's reaction. CTA: 365-day money-back guarantee, '$2/day.'", execution_pt:"Mini-VSL. Prova visual. História de lifter sério ao declínio aos 52. Médico: 'É idade.' Pesquisa: cascata T → fluxo sanguíneo → pump → recuperação. Ashwa + tongkat + boro + shilajit + L-citrulina. TMC: uma xícara. Resultados progressivos. Reação do médico. CTA: 365 dias money-back, '$2/dia.'"},
  {id:47, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"RTG Video: TMC vs Individual Supplements", title_pt:"RTG Vídeo: TMC vs Suplementos Individuais", angle_en:"Stop buying 6 supplements — TMC replaces them all", angle_pt:"Pare de comprar 6 suplementos — TMC substitui todos eles", hookCopy_en:"Hook A: \"I was spending $180/month on 6 different supplements. Now I spend $2/day on one cup of coffee.\" | Hook B: \"Ashwagandha. Tongkat ali. Boron. Lion's Mane. Shilajit. I was taking them all separately. Here's why I stopped.\" | Hook C: \"Don't buy another testosterone supplement until you hear this.\"", hookCopy_pt:"Hook A: \"Eu estava gastando $180/mês em 6 suplementos diferentes. Agora gasto $2/dia numa xícara de café.\" | Hook B: \"Ashwagandha. Tongkat ali. Boro. Lion's Mane. Shilajit. Eu estava tomando todos separados. Aqui está por que parei.\" | Hook C: \"Não compre outro suplemento de testosterona até ouvir isso.\"", hookVisual_en:"Speaker with 6 supplement bottles lined up, pushes them aside, holds up TMC", hookVisual_pt:"Speaker com 6 potes de suplemento alinhados, empurra pro lado, levanta TMC", format_en:"UGC Talking Head | RTG | 90s (~288 words)", format_pt:"UGC Talking Head | RTG | 90s (~288 palavras)", speaker_en:"Male 45-55, practical/logical, kitchen counter", speaker_pt:"Homem 45-55, prático/lógico, balcão da cozinha", execution_en:"Shows supplement collection. Names each + monthly cost. 'TMC has ALL of these in one cup.' Ingredient comparison (TMC dose vs standalone). 'Same ingredients, clinical doses, less than Starbucks.' CTA: 365-day money-back guarantee.", execution_pt:"Mostra coleção de suplementos. Nomeia cada um + custo mensal. 'TMC tem TODOS esses numa xícara.' Comparação de ingredientes (dose TMC vs avulso). 'Mesmos ingredientes, doses clínicas, menos que Starbucks.' CTA: 365 dias money-back."},
  {id:48, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"RTG Image: Bold Static — 'One cup. 12 ingredients.'", title_pt:"RTG Image: Static em Negrito — 'Uma xícara. 12 ingredientes.'", angle_en:"Product-centered value proposition", angle_pt:"Proposta de valor centrada no produto", hookCopy_en:"\"One cup. 12 ingredients. Zero guesswork.\"", hookCopy_pt:"\"Uma xícara. 12 ingredientes. Zero adivinhação.\"", hookVisual_en:"TMC cup with ingredient names radiating outward. Clean, modern design. Subhead: 'Ashwagandha + Tongkat Ali + Lion's Mane + 9 more.'", hookVisual_pt:"Xícara TMC com nomes de ingredientes irradiando pra fora. Design limpo, moderno. Subhead: 'Ashwagandha + Tongkat Ali + Lion's Mane + mais 9.'", format_en:"Static Image — Bold Static (Retargeting)", format_pt:"Imagem Estática — Static em Negrito (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Product-centered. Ingredient names around central cup. Minimal, premium. Trust badges. CTA: 'Replace your supplement shelf → Try risk-free.'", execution_pt:"Centrado no produto. Nomes de ingredientes ao redor da xícara central. Minimal, premium. Selos de confiança. CTA: 'Substitua sua prateleira de suplementos → Experimente risk-free.'"},
  {id:49, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"winner", title_en:"Winner Var 9: Navy Athletic Tank", title_pt:"Winner Var 9: Regata Esportiva Navy", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso shot, no face. Navy athletic/sport tank top (form-fitting, soaked through across chest and under arms). Hand pulling or gathering fabric, wedding ring visible. Clock 2:15 AM. Warm lamp. Messy bed. Brunette hair, disheveled. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Regata esportiva navy encharcada no peito e axilas. Mão puxando o tecido, aliança visível. Relógio 2:15 AM. Luz quente. Cama desfeita. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does sportswear imply higher intensity of physical exertion vs everyday t-shirt, amplifying the subtext?", execution_pt:"Copy VERBATIM. Teste: Roupa esportiva implica maior intensidade de esforço vs camiseta comum?"},
  {id:50, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"winner", title_en:"Winner Var 10: Drinking Water", title_pt:"Winner Var 10: Bebendo Água", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso shot, no face. Gray heather t-shirt soaked through. Both hands visible: one holds a glass of water at chest height (just finished drinking — slightly tilted, condensated). Wedding ring on one hand. Clock 2:15 AM. Warm lamp. Messy bed. Hair disheveled. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Camiseta cinza encharcada. Ambas as mãos visíveis: uma segura copo d'água (levemente inclinado, condensado). Aliança em uma mão. Relógio 2:15 AM. Luz quente. Cama desfeita. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does post-exertion behavior (drinking water) outperform shirt-pull gesture as primary sweat cue? Action vs. display.", execution_pt:"Copy VERBATIM. Teste: Comportamento pós-esforço (beber água) supera o gesto de puxar a camisa? Ação vs exibição."},
  {id:51, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Native Image: What Cortisol Does to Your Brain (Format A)", title_pt:"ACQ Native Image: O Que o Cortisol Faz ao Seu Cérebro (Format A)", angle_en:"Brain fog in men over 40 isn't mental — it's a cortisol-BDNF-hippocampus cascade with a specific fix", angle_pt:"Brain fog em homens acima dos 40 não é mental — é uma cascata cortisol-BDNF-hipocampo com uma solução específica", hookCopy_en:"\"Paul built his career on thinking fast. At 49, he started losing words mid-sentence in front of his team. His doctor had three words for him: It's just stress.\"\"Forgetting words mid-sentence after 40? Cortisol is doing this to your brain.\" | Hook B: \"Scientists are calling ashwagandha the brain fog fix. Here's what they're not telling you.\" | Hook C: \"If you're Googling 'brain fog supplements,' stop. You're already one step ahead.\"", hookCopy_pt:"\"Paul construiu sua carreira pensando rápido. Aos 49, começou a perder palavras no meio de frases na frente da equipe. Seu médico tinha três palavras: É só estresse.\"\"Esquecendo palavras no meio da frase depois dos 40? Cortisol está fazendo isso com seu cérebro.\" | Hook B: \"Cientistas estão chamando ashwagandha de a cura do brain fog. Aqui está o que eles não estão te contando.\" | Hook C: \"Se você está procurando no Google 'suplementos pra brain fog,' pare. Você já está um passo à frente.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Laptop screen with half-written email — cursor blinking mid-sentence, text cuts off: 'I wanted to follow up on the...' and stops. Photographed in the moment of forgetting. Single element. [Category: Emotional Devastation / Random Congruence]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Tela de laptop com e-mail pela metade — cursor piscando no meio da frase, texto para: 'Queria dar um retorno sobre o...' e nada. Fotografado no momento do esquecimento. Elemento único. [Category: Emotional Devastation / Random Congruence]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person, Urban/Analytical — Paul, 49, VP engineering", speaker_pt:"Primeira pessoa masculina, Urbano/Analítico — Paul, 49, VP de Engenharia", execution_en:"HEADLINE: 'I'm a VP of engineering. At 49, I started losing words mid-sentence in meetings. My doctor said I was just stressed.' | NARRATIVE ~1800w: Paul mid-presentation, loses word 'infrastructure.' ESCALATION: re-reads emails 3x; forgets vendor names; 12-year-old's logic becomes hard to follow. FAILED SOLUTIONS: sleep hygiene → cutting caffeine → neurologist → psychiatrist. MECHANISM: chronic cortisol suppresses BDNF → synaptic plasticity declines → word retrieval fails → hippocampus literally shrinks under chronic cortisol. Ashwagandha → cortisol ↓ → BDNF recovers. Lion's Mane → NGF → neuroplasticity. DISCOVERY: TMC. TRANSFORMATION. BRIDGE. CTA.", execution_pt:"HEADLINE: 'Sou VP de engenharia. Aos 49, comecei a perder palavras no meio de frases nas reuniões. Meu médico disse que era só estresse.' | NARRATIVA ~1800w. MECHANISM: cortisol crônico suprime BDNF → plasticidade sináptica declina → hipocampo encolhe literalmente. Ashwagandha → cortisol ↓ → BDNF se recupera. Lion's Mane → NGF. DISCOVERY: TMC. CTA."},
  {id:52, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Native Image: The 47 Things (Format A)", title_pt:"ACQ Native Image: As 47 Coisas (Format A)", angle_en:"Brain fog isn't a feeling — it's behavioral: the closet, the email, the project you can't start", angle_pt:"Brain fog não é uma sensação — é comportamental: o armário, o e-mail, o projeto que você não consegue começar", hookCopy_en:"\"Richard wasn't lazy. He wasn't depressed. He knew exactly what needed to be done. He just couldn't make himself start any of it.\"\"You forgot where you parked. You reread the same email 3 times. You walked into a room and forgot why.\" | Hook B: \"That closet you keep putting off. That email you can't finish. That conversation you can't follow. It's not laziness.\" | Hook C: \"Brain fog isn't a feeling. It's the 47 things you should have done today that your brain just won't let you start.\"", hookCopy_pt:"\"Richard não era preguiçoso. Não estava deprimido. Sabia exatamente o que precisava ser feito. Simplesmente não conseguia se forçar a começar nada.\"\"Você esqueceu onde estacionou. Você releu o mesmo email 3 vezes. Você entrou num cômodo e esqueceu por quê.\" | Hook B: \"Aquele armário que você fica adiando. Aquele email que você não consegue terminar. Aquela conversa que você não consegue acompanhar. Não é preguiça.\" | Hook C: \"Brain fog não é uma sensação. São as 47 coisas que você deveria ter feito hoje que seu cérebro simplesmente não te deixa começar.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Open notebook with handwritten to-do list — last item stopping mid-word: 'Call back' and then nothing. Like the pen just stopped. Single element. Warm desk lamp light. [Category: Emotional Devastation]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Caderno aberto com lista de tarefas escrita à mão — último item parando no meio da palavra: 'Ligar de' e nada. Como se a caneta tivesse simplesmente parado. Elemento único. Luz de mesa quente. [Category: Emotional Devastation]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Richard, 51, overwhelmed professional", speaker_pt:"Primeira pessoa masculina — Richard, 51, profissional sobrecarregado", execution_en:"HEADLINE: 'I have the list. I have the time. I sit down to start, and nothing happens. I'm not depressed. I don't know what I am.' | NARRATIVE ~1800w: Richard at home office desk 9 AM Saturday, list in front of him. Three hours later — nothing done. ESCALATION: inability-to-start spreads across domains; Googled 'executive dysfunction' at 2 AM. FAILED SOLUTIONS: therapy → caffeine cycles → Adderall (made anxiety worse). MECHANISM: chronic cortisol impairs prefrontal cortex → executive function fails: initiation, task-switching, inhibition of distraction. 'Can't start' is cortisol-driven neurological event. Ashwagandha → cortisol ↓ → PFC function recovers. Lion's Mane → NGF → dopamine signaling. DISCOVERY: TMC. TRANSFORMATION (Saturday through the list, start to finish). BRIDGE. CTA.", execution_pt:"HEADLINE: 'Tenho a lista. Tenho o tempo. Sento para começar, e nada acontece. Não estou deprimido. Não sei o que sou.' | NARRATIVA ~1800w. MECHANISM: cortisol crônico prejudica o córtex pré-frontal → função executiva falha: iniciação, alternância de tarefas. 'Não consegue começar' é evento neurológico induzido por cortisol. Ashwagandha → cortisol ↓ → PFC se recupera. Lion's Mane → NGF → dopamina. DISCOVERY: TMC. CTA."},
  {id:53, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video SHORT: Ashwagandha-Brain Fog Pipeline", title_pt:"ACQ Vídeo SHORT: Pipeline Ashwagandha-Brain Fog", angle_en:"Trending ingredient for brain fog is in TMC", angle_pt:"Ingrediente em alta pra brain fog está no TMC", hookCopy_en:"Hook A: \"Forgetting words mid-sentence after 40? Cortisol is doing this to your brain.\" | Hook B: \"You're probably already taking ashwagandha. But you're probably taking it wrong.\" | Hook C: \"The ingredient that fixes brain fog... also fixes your energy, recovery, and sleep.\"", hookCopy_pt:"Hook A: \"Esquecendo palavras no meio da frase depois dos 40? Cortisol está fazendo isso com seu cérebro.\" | Hook B: \"Você provavelmente já está tomando ashwagandha. Mas provavelmente está tomando errado.\" | Hook C: \"O ingrediente que conserta brain fog... também conserta sua energia, recuperação e sono.\"", hookVisual_en:"Speaker holding phone showing Google Trends, looks at camera with surprise", hookVisual_pt:"Speaker segurando celular mostrando Google Trends, olha pra câmera com surpresa", format_en:"UGC Talking Head (VH-001) | 75s (~240 words)", format_pt:"UGC Talking Head (VH-001) | 75s (~240 palavras)", speaker_en:"Male 48-55, sharp/professional, home office", speaker_pt:"Homem 48-55, afiado/profissional, home office", execution_en:"Shows phone: 'Brain fog is #1 trending health search. Every related search leads to ashwagandha.' Mechanism: ashwa → cortisol ↓ → brain fog ↓. TMC: KSM-66 in liquid form. CTA.", execution_pt:"Mostra celular: 'Brain fog é a busca de saúde #1 em alta. Toda busca relacionada leva à ashwagandha.' Mecanismo: ashwa → cortisol ↓ → brain fog ↓. TMC: KSM-66 em forma líquida. CTA."},
  {id:54, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video SHORT: Behavior Enumeration", title_pt:"ACQ Vídeo SHORT: Enumeração de Comportamentos", angle_en:"Brain fog visible through specific daily behaviors", angle_pt:"Brain fog visível através de comportamentos diários específicos", hookCopy_en:"Hook A: \"You forgot where you parked. Reread the same email 3 times. Walked into a room and forgot why. Sound familiar?\" | Hook B: \"It's not laziness. It's not aging. Your brain is running on empty — and there's a reason.\" | Hook C: \"That thing you've been putting off for a month? Your brain isn't lazy. It's being poisoned by cortisol.\"", hookCopy_pt:"Hook A: \"Você esqueceu onde estacionou. Releu o mesmo email 3 vezes. Entrou num cômodo e esqueceu por quê. Soa familiar?\" | Hook B: \"Não é preguiça. Não é envelhecimento. Seu cérebro está rodando no zero — e tem uma razão.\" | Hook C: \"Aquela coisa que você vem adiando há um mês? Seu cérebro não é preguiçoso. Ele está sendo envenenado pelo cortisol.\"", hookVisual_en:"Speaker opens mouth to speak, pauses, looks confused: 'What was I going to say?'", hookVisual_pt:"Speaker abre a boca pra falar, pausa, parece confuso: 'O que eu ia dizer?'", format_en:"UGC Talking Head (VH-001) | 80s (~256 words)", format_pt:"UGC Talking Head (VH-001) | 80s (~256 palavras)", speaker_en:"Male 50-58, relatable everyman, kitchen/home", speaker_pt:"Homem 50-58, everyman relatável, cozinha/casa", execution_en:"Acts it out: 'Where did I park? What was I saying? Why did I come in here?' Then: 'That's brain fog. Not a character flaw.' Mechanism: cortisol → prefrontal cortex. Ashwa + Lion's Mane. 'TMC has both. In your morning coffee.' CTA.", execution_pt:"Encena: 'Onde estacionei? O que eu estava dizendo? Por que entrei aqui?' Depois: 'Isso é brain fog. Não é falha de caráter.' Mecanismo: cortisol → córtex pré-frontal. Ashwa + Lion's Mane. 'TMC tem os dois. No seu café da manhã.' CTA."},
  {id:55, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video MID: Ashwagandha Pipeline (Expanded)", title_pt:"ACQ Vídeo MID: Pipeline Ashwagandha (Expandido)", angle_en:"Full trending topic exploration — ashwagandha + brain fog science", angle_pt:"Exploração completa de tópico em alta — ciência ashwagandha + brain fog", hookCopy_en:"Hook A: \"I went down a rabbit hole on brain fog. Every road led to the same ingredient — and I already had it in my kitchen.\" | Hook B: \"Ashwagandha is trending +300% for brain fog. Here's what the studies show — and what supplement companies don't want you to know.\" | Hook C: \"Can ashwagandha actually fix brain fog? I spent 40 hours reading the research.\"", hookCopy_pt:"Hook A: \"Caí num buraco de coelho sobre brain fog. Toda estrada levou ao mesmo ingrediente — e eu já tinha ele na minha cozinha.\" | Hook B: \"Ashwagandha está em alta +300% pra brain fog. Aqui está o que os estudos mostram — e o que as empresas de suplementos não querem que você saiba.\" | Hook C: \"Ashwagandha pode realmente consertar brain fog? Passei 40 horas lendo a pesquisa.\"", hookVisual_en:"Speaker at computer, showing Google Trends chart, turns to camera", hookVisual_pt:"Speaker no computador, mostrando gráfico Google Trends, vira pra câmera", format_en:"UGC Talking Head + screen inserts | 2:20 (~448 words)", format_pt:"UGC Talking Head + inserts de tela | 2:20 (~448 palavras)", speaker_en:"Male 48-55, curious/researcher type", speaker_pt:"Homem 48-55, tipo curioso/pesquisador", execution_en:"Discovery story. Trend data. Mechanism deep dive. 'Ashwagandha alone isn't enough — cortisol is part 1, brain repair is part 2.' Lion's Mane: BDNF + neurogenesis. TMC: both at clinical doses. Personal experience. CTA: 365-day money-back guarantee.", execution_pt:"História de descoberta. Dados de tendência. Mergulho no mecanismo. 'Ashwagandha sozinha não é suficiente — cortisol é parte 1, reparo cerebral é parte 2.' Lion's Mane: BDNF + neurogênese. TMC: ambos em doses clínicas. Experiência pessoal. CTA: 365 dias money-back."},
  {id:56, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video MID: Behavior Enumeration (Expanded)", title_pt:"ACQ Vídeo MID: Enumeração de Comportamentos (Expandido)", angle_en:"Brain fog as behavior pattern — daily cost of unmanaged cortisol", angle_pt:"Brain fog como padrão de comportamento — custo diário do cortisol não-gerenciado", hookCopy_en:"Hook A: \"That closet. That email. That thing you've been putting off for a month because your brain just won't let you start.\" | Hook B: \"You're not stupid. You're not lazy. You're not losing your mind. Your cortisol is destroying your ability to focus.\" | Hook C: \"Brain fog isn't a feeling. It's a list of things you didn't do today because your brain couldn't start.\"", hookCopy_pt:"Hook A: \"Aquele armário. Aquele email. Aquela coisa que você vem adiando há um mês porque seu cérebro simplesmente não te deixa começar.\" | Hook B: \"Você não é burro. Você não é preguiçoso. Você não está perdendo a cabeça. Seu cortisol está destruindo sua capacidade de focar.\" | Hook C: \"Brain fog não é uma sensação. É uma lista de coisas que você não fez hoje porque seu cérebro não conseguiu começar.\"", hookVisual_en:"Speaker surrounded by sticky notes, open laptop, phone buzzing — overwhelmed", hookVisual_pt:"Speaker cercado de post-its, laptop aberto, celular vibrando — sobrecarregado", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 52-60, professional/executive, home office", speaker_pt:"Homem 52-60, profissional/executivo, home office", execution_en:"Daily story: sat down to write email, 20 min later reorganized desk, checked weather. More behaviors. 'I thought I was losing it.' Reframe: 'It's cortisol.' Mechanism. Ashwa + Lion's Mane. TMC. 'Week 2: 45 minutes focus. Week 4: finished months-old const STORAGE_KEY = 'b14-briefing-review-bilingual';
let state = loadState();
let currentDay = 1;
let currentFilter = 'all';

function loadState() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; } catch(e) { return {}; } }
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateStats(); renderDayTabs(); }

const DAYS_META = [
  { day: 1, label: "Segunda", date: "05/05", cluster: "C2 Energy Crash" },
  { day: 2, label: "Terça", date: "06/05", cluster: "C2 Always Sore" },
  { day: 3, label: "Quarta", date: "07/05", cluster: "C2 Zero Drive" },
  { day: 4, label: "Quinta", date: "08/05", cluster: "C2 No Pump" },
  { day: 5, label: "Sexta", date: "09/05", cluster: "C3 Brain Fog" },
];

function renderDayTabs() {
  const container = document.getElementById('day-tabs');
  container.innerHTML = '';
  DAYS_META.forEach(d => {
    const dayAds = ADS.filter(a => a.day === d.day);
    let approved = 0, rejected = 0, commented = 0;
    dayAds.forEach(ad => { const s = state[ad.id] || {}; if (s.status === 'approved') approved++; if (s.status === 'rejected') rejected++; if (s.comment && s.comment.trim() !== '') commented++; });
    const tab = document.createElement('div');
    tab.className = 'day-tab' + (currentDay === d.day ? ' active' : '');
    tab.innerHTML = `<div class="day-label">${d.label}</div><div class="day-date">B14.${d.day} · ${d.date}</div><div class="day-cluster">${escapeHtml(d.cluster)}</div><div class="day-progress">${approved > 0 ? `<span class="progress-chip chip-approved">&#10003; ${approved}</span>` : ''}${rejected > 0 ? `<span class="progress-chip chip-rejected">&#10007; ${rejected}</span>` : ''}${commented > 0 ? `<span class="progress-chip chip-commented">&#128172; ${commented}</span>` : ''}${approved === 0 && rejected === 0 && commented === 0 ? `<span class="progress-chip" style="opacity:0.5">12 ads</span>` : ''}</div>`;
    tab.addEventListener('click', () => { currentDay = d.day; renderDayTabs(); renderAds(); window.scrollTo({ top: document.querySelector('.container').offsetTop - 80, behavior: 'smooth' }); });
    container.appendChild(tab);
  });
}

function matchesFilter(ad) {
  const s = state[ad.id] || {};
  switch (currentFilter) {
    case 'all': return true;
    case 'pending': return !s.status;
    case 'approved': return s.status === 'approved';
    case 'rejected': return s.status === 'rejected';
    case 'commented': return s.comment && s.comment.trim() !== '';
    case 'winner': return ad.type === 'winner';
  }
  return true;
}

function renderAds() {
  const container = document.getElementById('ads-container');
  container.innerHTML = '';
  const dayAds = ADS.filter(a => a.day === currentDay);
  const meta = DAYS_META.find(d => d.day === currentDay);
  const header = document.createElement('div');
  header.className = 'day-header';
  header.innerHTML = `<h2>${meta.label} — B14.${meta.day}</h2><span class="cluster-tag">${escapeHtml(dayAds[0].cluster_pt)} | ${escapeHtml(dayAds[0].cluster_en)}</span><span class="date">${escapeHtml(dayAds[0].date)}</span>`;
  container.appendChild(header);
  const filtered = dayAds.filter(ad => matchesFilter(ad));
  if (filtered.length === 0) { container.innerHTML += `<div class="empty-state"><p style="font-size:32px;margin-bottom:12px">&#8709;</p><p>Nenhum ad com este filtro pro dia selecionado.</p></div>`; return; }
  filtered.forEach(ad => container.appendChild(renderCard(ad)));
}

function renderCard(ad) {
  const s = state[ad.id] || {};
  const card = document.createElement('div');
  card.className = 'ad-card';
  card.id = `ad-${ad.id}`;
  if (s.status === 'approved') card.classList.add('approved');
  if (s.status === 'rejected') card.classList.add('rejected');
  if (s.comment && s.comment.trim() !== '') card.classList.add('has-comment');
  const typeBadge = ad.type === 'winner' ? '<span class="badge winner">Winner Var</span>' : '<span class="badge fill">Fill</span>';
  card.innerHTML = `
    <div class="ad-header">
      <span class="ad-id">AD #${ad.id}</span>
      <div class="ad-title-pair">
        <span class="ad-title pt">${escapeHtml(ad.title_pt)}</span>
        <span class="ad-title en">${escapeHtml(ad.title_en)}</span>
      </div>
      <div class="ad-badges">${typeBadge}</div>
    </div>
    <div class="lang-headers">
      <div></div>
      <div class="lang-pt">PT-BR (revisão)</div>
      <div class="lang-en">EN (produção)</div>
    </div>
    <div class="field-row">
      <span class="field-label">Ângulo</span>
      <div class="field-cell pt">${escapeHtml(ad.angle_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.angle_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Copy Hook</span>
      <div class="field-cell pt hook">${escapeHtml(ad.hookCopy_pt)}</div>
      <div class="field-cell en hook">${escapeHtml(ad.hookCopy_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Visual Hook</span>
      <div class="field-cell pt">${escapeHtml(ad.hookVisual_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.hookVisual_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Formato</span>
      <div class="field-cell pt">${escapeHtml(ad.format_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.format_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Speaker</span>
      <div class="field-cell pt">${escapeHtml(ad.speaker_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.speaker_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Execução</span>
      <div class="field-cell pt">${escapeHtml(ad.execution_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.execution_en)}</div>
    </div>
    <div class="action-bar">
      <button class="action-btn approve ${s.status === 'approved' ? 'active' : ''}" data-id="${ad.id}" data-action="approve">&#10003; Aprovar</button>
      <button class="action-btn reject ${s.status === 'rejected' ? 'active' : ''}" data-id="${ad.id}" data-action="reject">&#10007; Rejeitar</button>
      <button class="action-btn comment ${s.comment && s.comment.trim() !== '' ? 'active' : ''}" data-id="${ad.id}" data-action="toggle-comment">&#128172; Comentário${s.comment && s.comment.trim() !== '' ? ' &#10003;' : ''}</button>
      ${s.status ? `<span class="status-indicator ${s.status}">${s.status === 'approved' ? '&#10003; Aprovado' : '&#10007; Rejeitado'}</span>` : ''}
      <button class="action-btn reset" data-id="${ad.id}" data-action="reset">Limpar</button>
    </div>
    <div class="comment-box ${s.comment ? 'visible' : ''}" id="comment-box-${ad.id}">
      <textarea placeholder="O que precisa ser corrigido? Seja específico (hook copy, visual, mecanismo, etc.)" data-id="${ad.id}">${escapeHtml(s.comment || '')}</textarea>
      <div class="comment-hint">Clique fora pra salvar automaticamente.</div>
    </div>`;
  card.querySelectorAll('.action-btn').forEach(btn => btn.addEventListener('click', handleAction));
  const ta = card.querySelector('textarea');
  ta.addEventListener('blur', e => { const id = parseInt(e.target.dataset.id); if (!state[id]) state[id] = {}; const v = e.target.value.trim(); if (v) state[id].comment = v; else delete state[id].comment; saveState(); updateCardVisual(id); });
  return card;
}

function handleAction(e) {
  const id = parseInt(e.currentTarget.dataset.id);
  const action = e.currentTarget.dataset.action;
  if (!state[id]) state[id] = {};
  switch (action) {
    case 'approve': state[id].status = state[id].status === 'approved' ? null : 'approved'; if (!state[id].status) delete state[id].status; break;
    case 'reject': state[id].status = state[id].status === 'rejected' ? null : 'rejected'; if (!state[id].status) delete state[id].status; break;
    case 'toggle-comment': const box = document.getElementById(`comment-box-${id}`); box.classList.toggle('visible'); if (box.classList.contains('visible')) setTimeout(() => box.querySelector('textarea').focus(), 50); return;
    case 'reset': delete state[id]; break;
  }
  saveState(); updateCardVisual(id);
}

function updateCardVisual(id) {
  const card = document.getElementById(`ad-${id}`); if (!card) return;
  const s = state[id] || {};
  card.classList.remove('approved','rejected','has-comment');
  if (s.status === 'approved') card.classList.add('approved');
  if (s.status === 'rejected') card.classList.add('rejected');
  if (s.comment && s.comment.trim() !== '') card.classList.add('has-comment');
  const ab = card.querySelector('[data-action="approve"]'); const rb = card.querySelector('[data-action="reject"]'); const cb = card.querySelector('[data-action="toggle-comment"]');
  ab.classList.toggle('active', s.status === 'approved'); rb.classList.toggle('active', s.status === 'rejected');
  const hc = !!(s.comment && s.comment.trim()); cb.classList.toggle('active', hc); cb.innerHTML = `&#128172; Comentário${hc ? ' &#10003;' : ''}`;
  let si = card.querySelector('.status-indicator');
  if (s.status && !si) { const rst = card.querySelector('[data-action="reset"]'); const sp = document.createElement('span'); sp.className = `status-indicator ${s.status}`; sp.textContent = s.status === 'approved' ? '✓ Aprovado' : '✗ Rejeitado'; rst.before(sp); }
  else if (!s.status && si) si.remove();
  else if (si) { si.className = `status-indicator ${s.status}`; si.textContent = s.status === 'approved' ? '✓ Aprovado' : '✗ Rejeitado'; }
  if (!matchesFilter(ADS.find(a => a.id === id))) setTimeout(() => renderAds(), 150);
}

function updateStats() {
  let approved=0, rejected=0, commented=0, pending=0;
  ADS.forEach(ad => { const s = state[ad.id] || {}; if (s.status === 'approved') approved++; else if (s.status === 'rejected') rejected++; else pending++; if (s.comment && s.comment.trim() !== '') commented++; });
  document.getElementById('count-approved').textContent = approved;
  document.getElementById('count-rejected').textContent = rejected;
  document.getElementById('count-commented').textContent = commented;
  document.getElementById('count-pending').textContent = pending;
  document.getElementById('bottom-summary').textContent = `${approved+rejected} de 60 revisados · ${commented} com comentário`;
  document.getElementById('progress-approved').style.width = (approved/60*100)+'%';
  document.getElementById('progress-rejected').style.width = (rejected/60*100)+'%';
}

document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.dataset.filter; renderAds(); }); });

function generateMarkdown() {
  let approved=[], rejected=[], commented=[], pending=[];
  ADS.forEach(ad => { const s = state[ad.id] || {}; const entry = {ad, state: s}; if (s.status === 'approved') approved.push(entry); else if (s.status === 'rejected') rejected.push(entry); else pending.push(entry); if (s.comment && s.comment.trim() !== '') commented.push(entry); });
  const today = new Date().toISOString().split('T')[0];
  let md = `# Review Feedback — Batch B14 / Week 2026-W19\n**Gerado em:** ${today}\n**Status:** ${approved.length} aprovados · ${rejected.length} rejeitados · ${commented.length} com comentário · ${pending.length} pendentes\n\n---\n\n`;
  if (rejected.length > 0) { md += `## REJEITADOS (${rejected.length})\n\n`; rejected.forEach(({ad, state: s}) => { md += `### AD #${ad.id} — ${ad.title_en}\n**Dia:** ${ad.dayLabel_pt} (B14.${ad.day}) · **Tipo:** ${ad.type}\n**Hook:** ${ad.hookCopy_en}\n`; if (s.comment) md += `**Comentário:** ${s.comment}\n`; md += `\n`; }); md += `---\n\n`; }
  if (commented.filter(e => e.state.status !== 'rejected').length > 0) { md += `## COM COMENTÁRIO (aprovados + pendentes com feedback)\n\n`; commented.filter(e => e.state.status !== 'rejected').forEach(({ad, state: s}) => { md += `### AD #${ad.id} — ${ad.title_en}\n**Dia:** ${ad.dayLabel_pt} · **Status:** ${s.status || 'pendente'}\n**Comentário:** ${s.comment}\n\n`; }); md += `---\n\n`; }
  if (approved.length > 0) { md += `## APROVADOS (${approved.length})\n\n`; approved.forEach(({ad}) => { md += `- AD #${ad.id} — ${ad.title_en} (${ad.dayLabel_pt})\n`; }); md += `\n---\n\n`; }
  if (pending.length > 0) { md += `## PENDENTES (${pending.length})\n\n`; pending.forEach(({ad}) => { md += `- AD #${ad.id} — ${ad.title_en} (${ad.dayLabel_pt})\n`; }); }
  return md;
}

function exportMarkdown() { const md = generateMarkdown(); const blob = new Blob([md], {type:'text/markdown'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `b14-review-feedback-${new Date().toISOString().split('T')[0]}.md`; a.click(); URL.revokeObjectURL(url); }
async function copyFeedback() { try { await navigator.clipboard.writeText(generateMarkdown()); alert('Feedback copiado!'); } catch(e) { alert('Erro ao copiar. Tente exportar .md.'); } }
function resetAll() { if (!confirm('Isso vai apagar TODAS as aprovações, rejeições e comentários. Confirma?')) return; state = {}; localStorage.removeItem(STORAGE_KEY); renderDayTabs(); renderAds(); updateStats(); }

renderDayTabs(); renderAds(); updateStats();
</script>
