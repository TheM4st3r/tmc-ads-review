a energia' → visual de banco de carro limpo → CTA: garantia de 365 dias money-back, 40% off + frete grátis."},
  {id:6, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video SHORT: 3pm Crash = T Problem", title_pt:"ACQ Vídeo SHORT: Crash das 3pm = Problema de T", angle_en:"Afternoon crash reframed as testosterone signal", angle_pt:"Crash da tarde reenquadrado como sinal de testosterona", hookCopy_en:"Hook A: \"Your 3pm crash isn't a caffeine problem. It's a testosterone problem.\" | Hook B: \"You've been blaming caffeine for your afternoon crash. But caffeine was never the problem.\" | Hook C: \"Every man over 40 knows the 3pm wall. Nobody told you it's a hormone problem.\"", hookCopy_pt:"Hook A: \"Seu crash das 3pm não é problema de cafeína. É problema de testosterona.\" | Hook B: \"Você vem culpando a cafeína pelo seu crash da tarde. Mas a cafeína nunca foi o problema.\" | Hook C: \"Todo homem acima de 40 conhece a parede das 3pm. Ninguém te disse que é problema hormonal.\"", hookVisual_en:"Man at desk, clock at 3pm, pushes away coffee cup with frustration", hookVisual_pt:"Homem na mesa, relógio nas 3pm, empurra a xícara de café com frustração", format_en:"UGC Talking Head (VH-001) | 75s (~240 words)", format_pt:"UGC Talking Head (VH-001) | 75s (~240 palavras)", speaker_en:"Male 45-55, office/professional type, direct-to-camera", speaker_pt:"Homem 45-55, tipo escritório/profissional, direto pra câmera", execution_en:"Open on speaker at desk. Quick mechanism: cortisol peaks afternoon → suppresses T production → energy drops. 'Coffee just masks it.' TMC: ashwagandha reduces cortisol, tongkat ali supports T. Problem → mechanism → solution → CTA.", execution_pt:"Abre com o speaker na mesa. Mecanismo rápido: cortisol picos à tarde → suprime produção de T → energia cai. 'Café só mascara.' TMC: ashwagandha reduz cortisol, tongkat ali suporta T. Problema → mecanismo → solução → CTA."},
  {id:7, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video MID: Borrowing vs Making (Full Story)", title_pt:"ACQ Vídeo MID: Pegando Emprestada vs Fazendo (História Completa)", angle_en:"Full 'borrowing vs making' framework — character-driven narrative", angle_pt:"Framework completo 'pegando emprestada vs fazendo' — narrativa dirigida por personagem", hookCopy_en:"Hook A: \"This is what happens when a '3 energy drinks a day' guy finally fixes the real problem.\" | Hook B: \"He was 42, ran an HVAC crew, and couldn't get through a morning without 3 Monsters.\" | Hook C: \"Energy drinks, pre-workout, caffeine pills — every one of them is borrowing.\"", hookCopy_pt:"Hook A: \"Isto é o que acontece quando um cara de '3 energéticos por dia' finalmente conserta o problema real.\" | Hook B: \"Ele tinha 42 anos, comandava uma equipe de HVAC, e não conseguia passar uma manhã sem 3 Monsters.\" | Hook C: \"Energéticos, pré-treino, comprimidos de cafeína — cada um deles é emprestar.\"", hookVisual_en:"Hand opening truck door → floor littered with energy drink cans → boots stepping over them", hookVisual_pt:"Mão abrindo a porta da caminhonete → chão coberto de latas de energético → botas passando por cima delas", format_en:"VO-over-B-roll montage (TEST) | 2:20 (~448 words)", format_pt:"Montagem VO-sobre-B-roll (TESTE) | 2:20 (~448 palavras)", speaker_en:"Male VO 35-45, storytelling narrator", speaker_pt:"VO masculino 35-45, narrador de história", execution_en:"Full narrative arc: Character intro → Problem deepens (crashes, wife notices) → Discovery (TMC) → Week-by-week transformation → Visual payoff (clean seat) → Mechanism (ashwa + tongkat + shilajit) → CTA: 365-day money-back guarantee, 40% off + free shipping.", execution_pt:"Arco narrativo completo: Intro do personagem → Problema se aprofunda (crashes, esposa nota) → Descoberta (TMC) → Transformação semana-a-semana → Payoff visual (banco limpo) → Mecanismo (ashwa + tongkat + shilajit) → CTA: 365 dias money-back guarantee, 40% off + free shipping."},
  {id:8, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video MID: 3pm Crash (Personal Story)", title_pt:"ACQ Vídeo MID: Crash das 3pm (História Pessoal)", angle_en:"Afternoon crash as diagnostic — your body is telling you something", angle_pt:"Crash da tarde como diagnóstico — seu corpo está te dizendo algo", hookCopy_en:"Hook A: \"I used to drink 4 cups of coffee before 3pm. My wife thought I was addicted. Turns out my testosterone was tanking.\" | Hook B: \"Your 3pm crash isn't a caffeine problem. And your doctor probably won't tell you what it really is.\" | Hook C: \"The truth about why men over 45 hit a wall every afternoon.\"", hookCopy_pt:"Hook A: \"Eu tomava 4 xícaras de café antes das 3pm. Minha esposa achava que eu era viciado. Acontece que minha testosterona estava despencando.\" | Hook B: \"Seu crash das 3pm não é problema de cafeína. E seu médico provavelmente não vai te dizer o que realmente é.\" | Hook C: \"A verdade sobre por que homens acima de 45 batem numa parede toda tarde.\"", hookVisual_en:"Speaker holding coffee mug, gestures frustration, kitchen counter background", hookVisual_pt:"Speaker segurando caneca de café, gesticula frustração, balcão da cozinha ao fundo", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 50-58, relatable everyman, casual home setting", speaker_pt:"Homem 50-58, everyman relatável, ambiente casual de casa", execution_en:"Personal story: used to be high-energy, 40s hit, needed more caffeine. Doctor said 'normal.' Learned T-decline → cortisol → crash cycle. TMC: ashwagandha + tongkat. Week 2: first day without afternoon coffee. Week 4: energy steady all day. CTA: 365-day money-back guarantee.", execution_pt:"História pessoal: era cheio de energia, chegou aos 40, precisou de mais cafeína. Médico disse 'normal.' Aprendeu declínio de T → cortisol → ciclo do crash. TMC: ashwagandha + tongkat. Semana 2: primeiro dia sem café da tarde. Semana 4: energia estável o dia todo. CTA: garantia de 365 dias (money-back)."},
  {id:9, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video MID: Cross-Cluster Cortisol Bridge", title_pt:"ACQ Vídeo MID: Ponte de Cortisol Cross-Cluster", angle_en:"One hormone (cortisol) behind energy crash + soreness + brain fog — all connected", angle_pt:"Um hormônio (cortisol) por trás de crash de energia + dor muscular + brain fog — tudo conectado", hookCopy_en:"Hook A: \"Your brain fog and your energy crash have the same root cause. And it's not aging.\" | Hook B: \"What if I told you one hormone is behind your fatigue, your recovery problems, AND your brain fog?\" | Hook C: \"Doctors treat your energy, muscles, and brain as separate problems. They're not.\"", hookCopy_pt:"Hook A: \"Seu brain fog e seu crash de energia têm a mesma causa raiz. E não é envelhecimento.\" | Hook B: \"E se eu te dissesse que um hormônio está por trás da sua fadiga, seus problemas de recuperação, E seu brain fog?\" | Hook C: \"Médicos tratam sua energia, músculos e cérebro como problemas separados. Não são.\"", hookVisual_en:"Speaker counting on fingers: 'your energy... your recovery... your focus — same root cause'", hookVisual_pt:"Speaker contando nos dedos: 'sua energia... sua recuperação... seu foco — mesma causa raiz'", format_en:"UGC Talking Head (VH-001) | 2:45 (~528 words)", format_pt:"UGC Talking Head (VH-001) | 2:45 (~528 palavras)", speaker_en:"Male 48-55, fit-for-age, gym/outdoors setting", speaker_pt:"Homem 48-55, em forma pra idade, ambiente de academia/ar livre", execution_en:"Names 3 symptoms (energy crash, slow recovery, brain fog) — 'I had all 3.' Reveals they're all cortisol. Explains mechanism. Ashwagandha + tongkat + Lion's Mane. 'One cup of TMC addresses all 3.' Progressive results. CTA: 365-day money-back guarantee.", execution_pt:"Nomeia 3 sintomas (crash de energia, recuperação lenta, brain fog) — 'Eu tinha   {id:10, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video LONG: Cortisol Bridge (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Ponte de Cortisol (Mini-VSL)", angle_en:"Deep-dive cortisol mechanism — connects energy, recovery, cognition, T-decline", angle_pt:"Mergulho profundo no mecanismo do cortisol — conecta energia, recuperação, cognição, declínio de T", hookCopy_en:"Hook A: \"5 symptoms. 1 cause. And your doctor calls it 'normal aging.'\" | Hook B: \"The real reason you crash at 3pm, can't recover from workouts, and forgot why you walked into the room — it's all the same thing.\" | Hook C: \"If you're over 45 and dealing with low energy, brain fog, AND slow recovery — this one discovery changed everything.\"", hookCopy_pt:"Hook A: \"5 sintomas. 1 causa. E seu médico chama de 'envelhecimento normal.'\" | Hook B: \"A razão real pela qual você cai às 3pm, não consegue se recuperar dos treinos, e esqueceu por que entrou no cômodo — é tudo a mesma coisa.\" | Hook C: \"Se você tem mais de 45 e lida com baixa energia, brain fog, E recuperação lenta — essa única descoberta mudou tudo.\"", hookVisual_en:"Speaker holding up hand: '5 symptoms. 1 cause. And your doctor calls it normal aging.'", hookVisual_pt:"Speaker levantando a mão: '5 sintomas. 1 causa. E seu médico chama de envelhecimento normal.'", format_en:"UGC Talking Head + B-roll | 4:00 (~768 words)", format_pt:"UGC Talking Head + B-roll | 4:00 (~768 palavras)", speaker_en:"Male 50-58, knowledgeable but not clinical", speaker_pt:"Homem 50-58, com conhecimento mas não clínico", execution_en:"Extended narrative. 5 symptoms. 'Doctor said it's age. I didn't accept that.' Research: cortisol cascade. Mechanism detail. Enter ashwagandha (KSM-66) + tongkat + shilajit + Lion's Mane. TMC. Week-by-week transformation. Social proof. Detailed CTA: 365-day money-back guarantee, 'less than daily Starbucks.'", execution_pt:"Narrativa estendida. 5 sintomas. 'Médico disse que é idade. Eu não aceitei isso.' Pesquisa: cascata do cortisol. Detalhe do mecanismo. Entra ashwagandha (KSM-66) + tongkat + shilajit + Lion's Mane. TMC. Transformação semana-a-semana. Prova social. CTA detalhado: 365 dias money-back guarantee, 'menos que seu Starbucks diário.'"},
  {id:11, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"RTG Video: 'TMC is just fancy coffee' Objection", title_pt:"RTG Vídeo: Objeção 'TMC é só café chique'", angle_en:"Address #1 skeptic objection: 'it's just coffee with vitamins'", angle_pt:"Aborda objeção cética #1: 'é só café com vitaminas'", hookCopy_en:"Hook A: \"I thought TMC was just overpriced coffee. I was wrong. Here's what's actually happening in your body.\" | Hook B: \"Think TMC is just coffee? Then explain why my testosterone went up 200 points in 90 days.\" | Hook C: \"My buddy called TMC 'expensive dirt water.' 3 months later, he ordered his own.\"", hookCopy_pt:"Hook A: \"Eu achei que TMC era só café caro demais. Eu estava errado. Aqui está o que realmente está acontecendo no seu corpo.\" | Hook B: \"Acha que TMC é só café? Então explica por que minha testosterona subiu 200 pontos em 365 dias money-back.\" | Hook C: \"Meu amigo chamou TMC de 'água suja cara.' 3 meses depois, ele pediu o dele.\"", hookVisual_en:"Speaker holding TMC bag in one hand, regular coffee in other, shrugging", hookVisual_pt:"Speaker segurando saco de TMC numa mão, café comum na outra, dando de ombros", format_en:"UGC Talking Head | RTG | 90s (~288 words)", format_pt:"UGC Talking Head | RTG | 90s (~288 palavras)", speaker_en:"Male 45-55, skeptic-turned-believer archetype", speaker_pt:"Homem 45-55, arquétipo cético-virou-crente", execution_en:"Admits skepticism. Explains: regular coffee = caffeine. TMC = ashwagandha + tongkat + Lion's Mane in clinical doses. Mechanism per ingredient. 'I wasn't expecting to feel different. But by week 3...' Personal result. CTA: 365-day money-back guarantee.", execution_pt:"Admite ceticismo. Explica: café comum = cafeína. TMC = ashwagandha + tongkat + Lion's Mane em doses clínicas. Mecanismo por ingrediente. 'Eu não esperava sentir diferente. Mas na semana 3...' Resultado pessoal. CTA: 365 dias money-back guarantee."},
  {id:12, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"RTG Image: Bold Static — 'More Than Just Coffee'", title_pt:"RTG Image: Static em Negrito — 'Mais que Só Café'", angle_en:"Retargeting static — product as hero", angle_pt:"Static de retargeting — produto como herói", hookCopy_en:"\"Your morning coffee should do more than wake you up.\"", hookCopy_pt:"\"Seu café da manhã deveria fazer mais do que te acordar.\"", hookVisual_en:"TMC bag/cup hero shot, clean minimal background, bold sans-serif type. Subhead: '12 clinically-studied ingredients. One cup. Every morning.'", hookVisual_pt:"Hero shot do saco/xícara TMC, fundo limpo minimalista, tipografia sans-serif em negrito. Subhead: '12 ingredientes clinicamente estudados. Uma xícara. Toda manhã.'", format_en:"Static Image — Bold Static (Retargeting)", format_pt:"Imagem Estática — Static em Negrito (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Bold typography-driven. No faces. Product as hero. Warm tones. Single key benefit: 'More than just caffeine.' CTA: 'Try risk-free for 90 days →'", execution_pt:"Dirigido por tipografia em negrito. Sem rostos. Produto como herói. Tons quentes. Único benefício-chave: 'Mais do que só cafeína.' CTA: 'Experimente risk-free por 365 dias money-back →'"},
  {id:13, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"winner", title_en:"Winner Var 3: Soaked Hair Close-Up", title_pt:"Winner Var 3: Close-Up do Cabelo Encharcado", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Camera angle raised — frame from shoulders to just below jaw, no full face. Dark brunette hair soaked and matted, strands clinging to neck and collarbone. Hair is primary sweat evidence. Same gray t-shirt at bottom. One hand near neck, wedding ring visible. Clock 2:15 AM. Warm lamp. Raw iPhone aesthetic.", hookVisual_pt:"Ângulo levantado — enquadramento dos ombros até abaixo do queixo, sem rosto completo. Cabelo castanho encharcado e grudado no pescoço e clavícula. Cabelo é a evidência principal de suor. Camiseta cinza visível na parte inferior. Aliança visível. Relógio 2:15 AM.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does hair-as-sweat-evidence (implies total-body exertion) feel more intense than shirt-as-sweat-evidence?", execution_pt:"Copy VERBATIM. Teste: Cabelo como evidência de suor (implica esforço corporal total) parece mais intenso que a camisa?"},
  {id:14, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"winner", title_en:"Winner Var 4: Blonde Hair", title_pt:"Winner Var 4: Cabelo Loiro", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition exactly — torso shot, no face. Gray heather t-shirt soaked through, hand pulling shirt outward, wedding ring visible. Same bedroom, clock 2:15 AM, messy bed. Only change: blonde hair — disheveled, slightly damp at roots and ends, falling past shoulder. 4:5 vertical.", hookVisual_pt:"Mesma composição exata — torso sem rosto. Camiseta cinza encharcada, mão puxando, aliança visível. Mesmo quarto, relógio 2:15 AM, cama desfeita. Única mudança: cabelo loiro — despenteado, levemente úmido. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does blonde hair expand demographic resonance vs brunette baseline?", execution_pt:"Copy VERBATIM. Teste: Cabelo loiro expande o alcance demográfico vs castanho?"},
  {id:15, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Native Image: The Missing Half (Format A)", title_pt:"ACQ Native Image: A Metade Que Falta (Format A)", angle_en:"Men spend thousands on protein but ignore the hormonal environment protein synthesis actually requires", angle_pt:"Homens gastam milhares em proteína mas ignoram o ambiente hormonal que a síntese proteica requer", hookCopy_en:"\"Tom had been lifting since he was 24. At 44, everything was the same — except nothing worked anymore.\"\"If you're only using whey protein after workouts, you're missing half the recovery equation.\" | Hook B: \"Your protein shake is doing half the job. Here's what covers the other half.\" | Hook C: \"The fastest way to recover after 40? It's not more protein. It's not more rest.\"", hookCopy_pt:"\"Tom levantava peso desde os 24 anos. Aos 44, tudo era igual — exceto que nada funcionava mais.\"\"Se você só usa whey protein depois dos treinos, você está perdendo metade da equação de recuperação.\" | Hook B: \"Seu shake de proteína está fazendo metade do trabalho. Aqui está o que cobre a outra metade.\" | Hook C: \"A forma mais rápida de se recuperar depois dos 40? Não é mais proteína. Não é mais descanso.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Flexed forearm — completely flat. No vascularity, no definition, skin smooth. The absence of what should be there IS the shock. Gym bathroom / fluorescent light. [Category: Body Shame]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Antebraço flexionado — completamente plano. Sem veias, sem definição, pele lisa. A ausência do que deveria estar lá É o choque. [Category: Body Shame]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Tom, 44, serious lifter 20 years", speaker_pt:"Primeira pessoa masculina — Tom, 44, levantador sério por 20 anos", execution_en:"HEADLINE: 'I spent $3,000 on supplements last year. My body still looked the same. Then I read why.' | NARRATIVE ~1800w: Tom on scale, same number third week. ESCALATION: DOMS lasting 4 days, gains reversing. FAILED SOLUTIONS: more protein → massage gun → ice baths → sports doctor. MECHANISM: recovery requires cortisol clearance; T decline slows clearance → inflammation stays → muscles can't repair. Whey gives building blocks; without hormonal environment, construction crew never shows up. Ashwagandha clears cortisol. DISCOVERY: TMC. TRANSFORMATION. CTA.", execution_pt:"HEADLINE: 'Gastei $3.000 em suplementos no ano passado. Meu corpo ainda estava igual. Aí eu descobri o porquê.' | NARRATIVA ~1800w. MECHANISM: recuperação exige clearance de cortisol; declínio de T desacelera clearance → inflamação persiste. Ashwagandha limpa cortisol. DISCOVERY: TMC. CTA."},
  {id:16, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Native Image: The Sunday Morning Test (Format A)", title_pt:"ACQ Native Image: O Teste da Manhã de Domingo (Format A)", angle_en:"How a man moves the morning after a workout tells you more about his hormones than any bloodwork", angle_pt:"Como um homem se move na manhã depois do treino diz mais sobre seus hormônios do que qualquer exame", hookCopy_en:"\"He groaned getting off the couch on a Sunday and my 14-year-old looked at me and said, 'Is Dad okay?'\"\"Working out in your 40s hits different. Not because you're weaker — because your hormones changed.\" | Hook B: \"Testosterone is lower. Recovery is slower. But nobody's connecting the dots for men over 40.\" | Hook C: \"Your 25-year-old body recovered overnight. After 45, you need THIS to recover at all.\"", hookCopy_pt:"\"Ele gemeu saindo do sofá num domingo e meu filho de 14 anos me olhou e disse: 'Pai tá bem?'\"\"Treinar nos 40 bate diferente. Não porque você está mais fraco — porque seus hormônios mudaram.\" | Hook B: \"Testosterona está mais baixa. Recuperação está mais lenta. Mas ninguém está conectando os pontos pra homens acima de 40.\" | Hook C: \"Seu corpo de 25 anos se recuperava da noite pro dia. Depois dos 45, você precisa DISSO pra se recuperar de qualquer jeito.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Pillow with small handwritten note on it: 'Heat pad is on the nightstand.' Wife left this before he woke up. Single element, intimate domestic detail, warm bedroom lighting. [Category: Emotional Devastation]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Travesseiro com bilhete escrito à mão: 'Bolsa de calor na mesinha.' Esposa deixou antes dele acordar. Elemento único, detalhe doméstico íntimo. [Category: Emotional Devastation]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Wife/partner POV — Sarah, 44 — story 100% about HIM (LEI #10)", speaker_pt:"POV esposa — Sarah, 44 — história 100% sobre ELE (LEI #10)", execution_en:"HEADLINE: 'He used to beat me to the gym on Saturday mornings. Now he lies in bed until 11 on Sundays.' | NARRATIVE ~1800w (wife POV, story 100% about Steve): Steve, 47, weekend warrior. ESCALATION through Sarah's observation: groans louder, workouts shorter, couch becomes recovery room. MECHANISM via Sarah's research: T drops 1%/yr → cortisol clearance slows → DOMS chronic. DISCOVERY: TMC. TRANSFORMATION told through Steve's behavior changes. BRIDGE to wives watching this happen. CTA.", execution_pt:"HEADLINE: 'Ele costumava chegar antes de mim na academia no sábado. Agora fica na cama até as 11 do domingo.' | NARRATIVA ~1800w (POV esposa, história 100% sobre Steve): MECHANISM: T cai 1%/ano → clearance de cortisol desacelera → DOMS crônica. DISCOVERY: TMC. CTA."},
  {id:17, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video SHORT: Missing Half Recovery", title_pt:"ACQ Vídeo SHORT: Faltando Metade da Recuperação", angle_en:"Protein alone isn't enough — recovery needs hormonal support", angle_pt:"Proteína sozinha não é suficiente — recuperação precisa de suporte hormonal", hookCopy_en:"Hook A: \"If you're only using whey after workouts, you're missing half the recovery equation.\" | Hook B: \"I spent $200/month on protein and still couldn't recover. Turns out protein was only half the answer.\" | Hook C: \"What NEVER to take after a workout if you're over 40 — and what to take instead.\"", hookCopy_pt:"Hook A: \"Se você só usa whey depois dos treinos, está perdendo metade da equação de recuperação.\" | Hook B: \"Gastei $200/mês em proteína e ainda não conseguia me recuperar. Acontece que proteína era só metade da resposta.\" | Hook C: \"O que NUNCA tomar depois do treino se você tem mais de 40 — e o que tomar no lugar.\"", hookVisual_en:"Speaker holding protein shaker in one hand, shaking head", hookVisual_pt:"Speaker segurando coqueteleira de proteína numa mão, balançando a cabeça", format_en:"UGC Talking Head (VH-001) | 75s (~240 words)", format_pt:"UGC Talking Head (VH-001) | 75s (~240 palavras)", speaker_en:"Male 44-52, gym regular, post-workout setting", speaker_pt:"Homem 44-52, frequentador de academia, ambiente pós-treino", execution_en:"Speaker in gym clothes. 'Protein only handles muscle protein synthesis.' Recovery also needs cortisol reduction + T support. 'That's the half you're missing.' TMC: ashwa + tongkat. 'Recovery cut in half.' CTA: 365-day money-back guarantee.", execution_pt:"Speaker em roupa de academia. 'Proteína só cuida da síntese proteica muscular.' Recuperação também precisa de redução de cortisol + suporte de T. 'Essa é a metade que você está perdendo.' TMC: ashwa + tongkat. 'Recuperação cortada pela metade.' CTA: 365 dias money-back."},
  {id:18, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video SHORT: Recovery = Hormones", title_pt:"ACQ Vídeo SHORT: Recuperação = Hormônios", angle_en:"Your soreness after 40 is a hormone problem, not effort", angle_pt:"Sua dor depois dos 40 é problema hormonal, não esforço", hookCopy_en:"Hook A: \"Working out in your 40s hits different. And it has nothing to do with effort.\" | Hook B: \"You're not sore because you worked out too hard. You're sore because your hormones can't keep up.\" | Hook C: \"Testosterone is lower. Recovery is slower. Here's what nobody's telling men our age.\"", hookCopy_pt:"Hook A: \"Treinar nos 40 bate diferente. E não tem nada a ver com esforço.\" | Hook B: \"Você não está dolorido porque treinou pesado demais. Está dolorido porque seus hormônios não conseguem acompanhar.\" | Hook C: \"Testosterona está mais baixa. Recuperação está mais lenta. Aqui está o que ninguém está contando pra homens da nossa idade.\"", hookVisual_en:"Speaker rubbing shoulder/back, wincing, addresses camera", hookVisual_pt:"Speaker esfregando ombro/costas, fazendo cara de dor, fala pra câmera", format_en:"UGC Talking Head (VH-001) | 70s (~224 words)", format_pt:"UGC Talking Head (VH-001) | 70s (~224 palavras)", speaker_en:"Male 50-58, relatable dad, casual home setting", speaker_pt:"Homem 50-58, pai relatável, ambiente casual de casa", execution_en:"Shares frustration: 'Used to recover overnight. Now Tuesday still hurts Thursday.' Mechanism: T drops → inflammation ↑ → recovery extends. TMC: ashwa, tongkat. '2 weeks in, I noticed. 6 weeks in, my wife noticed.' CTA.", execution_pt:"Compartilha frustração: 'Costumava me recuperar da noite pro dia. Agora terça ainda dói quinta.' Mecanismo: T cai → inflamação ↑ → recuperação se estende. TMC: ashwa, tongkat. '2 semanas dentro, eu notei. 6 semanas dentro, minha esposa notou.' CTA."},
  {id:19, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video MID: Missing Half Recovery (Expanded)", title_pt:"ACQ Vídeo MID: Faltando Metade da Recuperação (Expandido)", angle_en:"Deep dive on the protein-only trap", angle_pt:"Mergulho profundo na armadilha do só-proteína", hookCopy_en:"Hook A: \"I was spending $200 a month on supplements and STILL couldn't recover from my workouts.\" | Hook B: \"If you're only using whey protein after a workout, you might be missing half the recovery equation.\" | Hook C: \"The secret to recovering like you're 25 again isn't more protein. It's not more rest either.\"", hookCopy_pt:"Hook A: \"Eu estava gastando $200 por mês em suplementos e AINDA não conseguia me recuperar dos meus treinos.\" | Hook B: \"Se você só usa whey protein depois do treino, talvez esteja perdendo metade da equação de recuperação.\" | Hook C: \"O segredo pra se recuperar como se tivesse 25 de novo não é mais proteína. Também não é mais descanso.\"", hookVisual_en:"Speaker at kitchen counter with protein powder, TMC, and empty supplement bottles", hookVisual_pt:"Speaker no balcão da cozinha com pó de proteína, TMC e potes de suplemento vazios", format_en:"UGC Talking Head + gym B-roll | 2:15 (~432 words)", format_pt:"UGC Talking Head + B-roll de academia | 2:15 (~432 palavras)", speaker_en:"Male 44-52, experienced lifter", speaker_pt:"Homem 44-52, lifter experiente", execution_en:"Story: serious lifter, always took protein. After 40, recovery 3-4 days instead of 1. Added BCAAs, glutamine, creatine — still sore. Discovery: hormonal environment. TMC: ashwa + tongkat + shilajit. Week-by-week. CTA: 365-day money-back guarantee.", execution_pt:"História: lifter sério, sempre tomou proteína. Depois dos 40, recuperação 3-4 dias em vez de 1. Adicionou BCAAs, glutamina, creatina — ainda dolorido. Descoberta: ambiente hormonal. TMC: ashwa + tongkat + shilajit. Semana-a-semana. CTA: 365 dias money-back."},
  {id:20, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video MID: Recovery = Hormones (Expanded)", title_pt:"ACQ Vídeo MID: Recuperação = Hormônios (Expandido)", angle_en:"Extended personal story — from always sore to recovered", angle_pt:"História pessoal estendida — de sempre dolorido a recuperado", hookCopy_en:"Hook A: \"My body used to bounce back. Now a Monday workout ruins my whole week.\" | Hook B: \"Stop training like you're 25. Not because you can't handle it — because your hormones can't.\" | Hook C: \"Are you making these 3 recovery mistakes after 40?\"", hookCopy_pt:"Hook A: \"Meu corpo costumava se recuperar. Agora um treino de segunda destrói minha semana inteira.\" | Hook B: \"Pare de treinar como se tivesse 25. Não porque você não dá conta — porque seus hormônios não dão.\" | Hook C: \"Você está cometendo esses 3 erros de recuperação depois dos 40?\"", hookVisual_en:"Speaker stretching stiffly, visible discomfort, speaks to camera", hookVisual_pt:"Speaker se alongando duro, desconforto visível, fala pra câmera", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 52-60, weekend warrior, backyard/garage gym", speaker_pt:"Homem 52-60, weekend warrior, academia de quintal/garagem", execution_en:"Story: 'I'm 54. Been lifting since 20s.' Progressive decline. Doctor said 'slow down.' Research: T drops, cortisol rises. TMC. Week 3: trained Monday, not sore Wednesday. Week 6: back to 4 days. CTA: 365-day money-back guarantee.", execution_pt:"História: 'Tenho 54. Levanto desde os 20.' Declínio progressivo. Médico disse 'desacelera.' Pesquisa: T cai, cortisol sobe. TMC. Semana 3: treinou segunda, não dolorido quarta. Semana 6: voltou pra 4 dias. CTA: 365 dias money-back."},
  {id:21, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video MID: Your Body Changed After 40", title_pt:"ACQ Vídeo MID: Seu Corpo Mudou Depois dos 40", angle_en:"Age-acknowledgment reframe — not weaker, hormonally different", angle_pt:"Reenquadre de reconhecimento de idade — não mais fraco, hormonalmente diferente", hookCopy_en:"Hook A: \"Most men over 40 want better hormones, more muscle, and long-term health — but they're still guessing instead of measuring.\" | Hook B: \"Your body has changed after 40. But not the way you think.\" | Hook C: \"If you're over 40 and your body doesn't respond to workouts the way it used to, there's a reason nobody's explaining.\"", hookCopy_pt:"Hook A: \"A maioria dos homens acima de 40 quer hormônios melhores, mais músculo, e saúde de longo prazo — mas ainda estão chutando em vez de medir.\" | Hook B: \"Seu corpo mudou depois dos 40. Mas não do jeito que você pensa.\" | Hook C: \"Se você tem mais de 40 e seu corpo não responde aos treinos como antes, tem uma razão que ninguém está explicando.\"", hookVisual_en:"Speaker pointing at camera: 'I need to tell you something about your body after 40.'", hookVisual_pt:"Speaker apontando pra câmera: 'Preciso te contar uma coisa sobre seu corpo depois dos 40.'", format_en:"UGC Talking Head (VH-001) | 2:40 (~512 words)", format_pt:"UGC Talking Head (VH-001) | 2:40 (~512 palavras)", speaker_en:"Male 46-54, fit-for-age, outdoor setting", speaker_pt:"Homem 46-54, em forma pra idade, ambiente ao ar livre", execution_en:"'Your body after 40 isn't broken. It's operating on different rules.' T decline, cortisol accumulation, SHBG trapping free T. TMC: ashwa, tongkat, boron, shilajit. 'Stop guessing. Start supporting.' Progressive results. CTA.", execution_pt:"'Seu corpo depois dos 40 não está quebrado. Está operando em regras diferentes.' Declínio de T, acúmulo de cortisol, SHBG aprisionando T livre. TMC: ashwa, tongkat, boro, shilajit. 'Pare de chutar. Comece a dar suporte.' Resultados progressivos. CTA."},
  {id:22, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video LONG: Your Body Changed (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Seu Corpo Mudou (Mini-VSL)", angle_en:"Comprehensive: why your body changed, what's happening, and what to do", angle_pt:"Abrangente: por que seu corpo mudou, o que está acontecendo, e o que fazer", hookCopy_en:"Hook A: \"I need 4 minutes. What I'm about to tell you could change the next decade of your fitness.\" | Hook B: \"Everything you've been told about fitness after 40 is wrong. Not slightly off — fundamentally wrong.\" | Hook C: \"The 3 things that change in your body after 40 — and the one thing that fixes all 3.\"", hookCopy_pt:"Hook A: \"Preciso de 4 minutos. O que vou te contar pode mudar a próxima década do seu fitness.\" | Hook B: \"Tudo que te disseram sobre fitness depois dos 40 está errado. Não um pouco errado — fundamentalmente errado.\" | Hook C: \"As 3 coisas que mudam no seu corpo depois dos 40 — e a única coisa que conserta as 3.\"", hookVisual_en:"Speaker in home office, turns to camera: 'I need 4 minutes. What I'm about to tell you could change the next decade of your life.'", hookVisual_pt:"Speaker no home office, vira pra câmera: 'Preciso de 4 minutos. O que vou te contar pode mudar a próxima década da sua vida.'", format_en:"UGC Talking Head + B-roll | 4:30 (~864 words)", format_pt:"UGC Talking Head + B-roll | 4:30 (~864 palavras)", speaker_en:"Male 50-60, authoritative but warm", speaker_pt:"Homem 50-60, com autoridade mas caloroso", execution_en:"Mini-VSL. Section 1: The 3 Changes (T decline, cortisol accumulation, SHBG increase). Section 2: Why Everything Else Fails. Section 3: The Answer (adaptogens + minerals). Section 4: TMC. Section 5: CTA — 365-day money-back guarantee, 'less than daily Starbucks.'", execution_pt:"Mini-VSL. Seção 1: As 3 Mudanças (declínio de T, acúmulo de cortisol, aumento de SHBG). Seção 2: Por que Todo o Resto Falha. Seção 3: A Resposta (adaptógenos + minerais). Seção 4: TMC. Seção 5: CTA — 365 dias money-back guarantee, 'menos que Starbucks diário.'"},
  {id:23, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"RTG Video: Ashwagandha + Recovery Deep Dive", title_pt:"RTG Vídeo: Mergulho Profundo Ashwagandha + Recuperação", angle_en:"Why ashwagandha is the #1 recovery ingredient most men are missing", angle_pt:"Por que ashwagandha é o ingrediente de recuperação #1 que a maioria dos homens está perdendo", hookCopy_en:"Hook A: \"You've heard of ashwagandha. But you probably don't know what it does for muscle recovery.\" | Hook B: \"Ashwagandha searches are up 300% this month. Here's why men over 40 should care.\" | Hook C: \"The ingredient behind TMC's recovery formula just went viral.\"", hookCopy_pt:"Hook A: \"Você já ouviu falar de ashwagandha. Mas provavelmente não sabe o que ela faz pra recuperação muscular.\" | Hook B: \"Buscas por ashwagandha estão 300% pra cima esse mês. Aqui está por que homens acima de 40 deveriam se importar.\" | Hook C: \"O ingrediente por trás da fórmula de recuperação do TMC acabou de viralizar.\"", hookVisual_en:"Speaker holding ashwagandha root/powder, or showing supplement label", hookVisual_pt:"Speaker segurando raiz/pó de ashwagandha, ou mostrando rótulo de suplemento", format_en:"Educational UGC | RTG | 90s (~288 words)", format_pt:"UGC Educacional | RTG | 90s (~288 palavras)", speaker_en:"Male 45-55, knowledgeable fitness enthusiast", speaker_pt:"Homem 45-55, entusiasta de fitness com conhecimento", execution_en:"Educational tone for warm audience. Ashwagandha mechanism: cortisol ↓ 30%, inflammation ↓, T support. TMC's specific dose. CTA: '365-day money-back guarantee removes the risk.'", execution_pt:"Tom educacional pra audiência morna. Mecanismo da ashwagandha: cortisol ↓ 30%, inflamação ↓, suporte a T. Dose específica do TMC. CTA: 'Garantia de 365 dias money-back remove o risco.'"},
  {id:24, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"RTG Image: Social Proof — 'I recover like I'm 30 again'", title_pt:"RTG Image: Prova Social — 'Eu me recupero como se tivesse 30 de novo'", angle_en:"Testimonial-style social proof", angle_pt:"Prova social estilo testemunho", hookCopy_en:"\"I recover like I'm 30 again.\"", hookCopy_pt:"\"Eu me recupero como se tivesse 30 de novo.\"", hookVisual_en:"Testimonial card layout with quote, star rating, TMC product image. Subhead: 'TMC customer, age 52. Week 6 results.'", hookVisual_pt:"Layout de cartão de testemunho com citação, classificação por estrelas, imagem do produto TMC. Subhead: 'Cliente TMC, 52 anos. Resultados da semana 6.'", format_en:"Static Image — Social Proof (Retargeting)", format_pt:"Imagem Estática — Prova Social (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Clean testimonial card. Bold quote. Star rating. TMC bag. Warm tones. Trust signals. CTA: 'Join 10,000+ men who switched → Try risk-free.'", execution_pt:"Cartão de testemunho limpo. Citação em negrito. Classificação por estrelas. Saco TMC. Tons quentes. Sinais de confiança. CTA: 'Junte-se a 10.000+ homens que trocaram → Experimente risk-free.'"},
  {id:25, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"winner", title_en:"Winner Var 5: Black T-Shirt", title_pt:"Winner Var 5: Camiseta Preta", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso shot, no face. Black cotton t-shirt, soaked. Sweat visible as slightly darker wet patches (subtle on black — less high-contrast). Hand pulling shirt outward, wedding ring visible. Clock 2:15 AM. Warm lamp. Messy bed. Brunette hair. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Camiseta preta encharcada. Suor visível como manchas mais escuras (sutil no preto). Mão puxando, aliança visível. Relógio 2:15 AM. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does lower sweat visibility on black create more curiosity vs obvious sweat on gray? Mystery vs. shock.", execution_pt:"Copy VERBATIM. Teste: Menor visibilidade do suor no preto cria mais curiosidade vs suor óbvio no cinza? Mistério vs choque."},
  {id:26, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"winner", title_en:"Winner Var 6: Oversized Men's T-Shirt", title_pt:"Winner Var 6: Camiseta Masculina Oversized", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso, no face. Woman wearing an oversized men's t-shirt — clearly not hers (neckline droops off one shoulder, sleeves hang past elbow). Soaked through. Hand gathers oversized fabric and pulls outward, wedding ring visible. Clock 2:15 AM. Warm lamp. Messy bed. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Mulher com camiseta masculina oversized — claramente não é dela (gola tombando, mangas longas). Encharcada. Mão junta o tecido e puxa, aliança visível. Relógio 2:15 AM. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does 'wearing his shirt' (post-intimacy ownership cue) create stronger emotional signal than wearing her own shirt?", execution_pt:"Copy VERBATIM. Teste: 'Vestindo a camisa dele' (sinal de posse pós-intimidade) gera sinal emocional mais forte?"},
  {id:27, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Native Image: The One Variable (Format A)", title_pt:"ACQ Native Image: A Variável Única (Format A)", angle_en:"The data-obsessed man quantifies everything except the upstream variable that controls everything else", angle_pt:"O homem obcecado por dados quantifica tudo menos a variável upstream que controla tudo o mais", hookCopy_en:"\"Jim had a spreadsheet for everything. He was doing everything right. And for two years, nothing changed.\"\"You track your macros, your steps, and your sleep. But you've never measured the one thing that controls all of them.\" | Hook B: \"Most men over 40 want better results. But they're still guessing instead of measuring.\" | Hook C: \"If you're over 40 and not seeing results despite doing everything right — you're probably optimizing the wrong variable.\"", hookCopy_pt:"\"Jim tinha uma planilha pra tudo. Estava fazendo tudo certo. E por dois anos, nada mudou.\"\"Você rastreia seus macros, seus passos, e seu sono. Mas você nunca mediu a única coisa que controla todos eles.\" | Hook B: \"A maioria dos homens acima de 40 quer melhores resultados. Mas ainda estão chutando em vez de medir.\" | Hook C: \"Se você tem mais de 40 e não está vendo resultados apesar de fazer tudo certo — você provavelmente está otimizando a variável errada.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Whoop or Garmin health tracker on wrist, screen showing 'Recovery: 14%' in red. Single wrist, close-up, slightly off-angle. [Category: Medical Shock / Random Congruence]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Rastreador de saúde Whoop ou Garmin no pulso, tela mostrando 'Recovery: 14%' em vermelho. Pulso único, close-up. [Category: Medical Shock / Random Congruence]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person, Urban/Analytical — Jim, 43, software engineer", speaker_pt:"Primeira pessoa masculina, Urbano/Analítico — Jim, 43, engenheiro de software", execution_en:"HEADLINE: 'I tracked everything. HRV, macros, sleep stages, VO2 max. My testosterone was 311 and I never thought to measure it.' | NARRATIVE ~1800w: Jim staring at Whoop, HRV at 22. ESCALATION: plateau despite perfect compliance. FAILED SOLUTIONS: creatine → NMN → ashwagandha (wrong dose). MECHANISM: testosterone is the upstream variable controlling all Jim's tracked metrics. Total T: 311. Fix T → all metrics move. Ashwagandha + tongkat ali + boron. DISCOVERY: TMC. TRANSFORMATION in metric language. BRIDGE. CTA.", execution_pt:"HEADLINE: 'Rastreei tudo. HRV, macros, estágios do sono, VO2 máx. Minha testosterona estava em 311 e nunca pensei em medir.' | NARRATIVA ~1800w. MECHANISM: testosterona é a variável upstream que controla todas as métricas. Total T: 311. Consertar T → todas as métricas melhoram. DISCOVERY: TMC. CTA."},
  {id:28, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Native Image: The Program That Stopped Working (Format A)", title_pt:"ACQ Native Image: O Programa Que Parou de Funcionar (Format A)", angle_en:"Gym programs designed for 25-year-olds are actively working against men over 45", angle_pt:"Programas de academia projetados para homens de 25 anos trabalham ativamente contra homens acima dos 45", hookCopy_en:"\"Mark had been lifting the same weights for two years. Not because he wasn't working hard. Because his body had quietly stopped responding.\"\"Which of these gym mistakes are you guilty of? Training like you're 25. Skipping recovery. Ignoring your hormones.\" | Hook B: \"5 reasons your workouts stopped working after 40 — and #4 is the one nobody talks about.\" | Hook C: \"You're doing 4 things right and 1 thing catastrophically wrong at the gym.\"", hookCopy_pt:"\"Mark levantava os mesmos pesos há dois anos. Não porque não estava se esforçando. Porque seu corpo tinha silenciosamente parado de responder.\"\"De quais desses erros de academia você é culpado? Treinar como se tivesse 25. Pular recuperação. Ignorar seus hormônios.\" | Hook B: \"5 razões pelas quais seus treinos pararam de funcionar depois dos 40 — e a #4 é a que ninguém fala.\" | Hook C: \"Você está fazendo 4 coisas certo e 1 coisa catastroficamente errada na academia.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Workout log notebook open — sets, reps, weights in columns, same weight number repeating across 8 consecutive weeks with no increases. Man's stalled progress in his own handwriting. [Category: Body Shame / Emotional Devastation]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Caderno de treino aberto — séries, repetições, cargas em colunas, mesmo número repetindo por 8 semanas consecutivas sem aumentos. Progresso travado na própria caligrafia. [Category: Body Shame / Emotional Devastation]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Mark, 46, gym regular 20+ years", speaker_pt:"Primeira pessoa masculina — Mark, 46, frequentador de academia por 20+ anos", execution_en:"HEADLINE: 'I've been going to the gym for 22 years. At 46, it stopped working. I finally found out why.' | NARRATIVE ~1800w: Mark in gym bathroom, same number for months. ESCALATION: gains reversed, can't recover, ego bruised. FAILED SOLUTIONS: multiple programs → more protein → TRT consultation (decided against). MECHANISM: standard programs assume T of 600-700+ (25-year-old's environment). Mark's T is 340. Without T to drive synthesis and recovery, progressive overload has no raw material. DISCOVERY: TMC. TRANSFORMATION. BRIDGE. CTA.", execution_pt:"HEADLINE: 'Frequento academia há 22 anos. Aos 46, parou de funcionar. Finalmente descobri o porquê.' | NARRATIVA ~1800w. MECHANISM: programas padrão assumem T de 600-700+. T de Mark é 340. Sem T, a sobrecarga progressiva não tem matéria-prima. DISCOVERY: TMC. CTA."},
  {id:29, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video SHORT: Guessing vs Measuring", title_pt:"ACQ Vídeo SHORT: Chutando vs Medindo", angle_en:"You optimize everything except the one thing that matters most", angle_pt:"Você otimiza tudo exceto a única coisa que mais importa", hookCopy_en:"Hook A: \"You track your macros, your steps, and your sleep. But you've never once optimized the thing that controls all your results.\" | Hook B: \"Most men over 40 are still guessing. And wondering why the gym stopped working.\" | Hook C: \"If you're doing everything right at the gym and STILL not seeing results after 40 — watch this.\"", hookCopy_pt:"Hook A: \"Você rastreia seus macros, seus passos e seu sono. Mas você nunca otimizou a coisa que controla todos os seus resultados.\" | Hook B: \"A maioria dos homens acima de 40 ainda está chutando. E se perguntando por que a academia parou de funcionar.\" | Hook C: \"Se você está fazendo tudo certo na academia e AINDA não está vendo resultados depois dos 40 — assiste isso.\"", hookVisual_en:"Speaker holding phone with fitness app, shakes head", hookVisual_pt:"Speaker segurando celular com app de fitness, balança a cabeça", format_en:"UGC Talking Head (VH-001) | 70s (~224 words)", format_pt:"UGC Talking Head (VH-001) | 70s (~224 palavras)", speaker_en:"Male 44-50, tech/professional, home gym", speaker_pt:"Homem 44-50, tech/profissional, academia em casa", execution_en:"Names what they track (macros, sleep, steps, heart rate). 'But the one variable that controls energy, recovery, muscle growth, AND motivation — testosterone — you're completely ignoring.' TMC: ashwa + tongkat. CTA.", execution_pt:"Nomeia o que rastreiam (macros, sono, passos, frequência cardíaca). 'Mas a única variável que controla energia, recuperação, crescimento muscular E motivação — testosterona — você está completamente ignorando.' TMC: ashwa + tongkat. CTA."},
  {id:30, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video SHORT: Mistakes Enumeration", title_pt:"ACQ Vídeo SHORT: Enumeração de Erros", angle_en:"Gym mistakes men over 40 make — hormonal blind spot", angle_pt:"Erros de academia de homens acima de 40 — ponto cego hormonal", hookCopy_en:"Hook A: \"Which of these mistakes are you guilty of? Training like you're 25. Skipping recovery. Not eating enough protein. Ignoring your hormones.\" | Hook B: \"Your drive to work out didn't disappear because you got lazy. It disappeared because of THIS.\" | Hook C: \"3 things killing your gym motivation after 40 — and none of them are what you think.\"", hookCopy_pt:"Hook A: \"De quais desses erros você é culpado? Treinar como se tivesse 25. Pular recuperação. Não comer proteína suficiente. Ignorar seus hormônios.\" | Hook B: \"Sua vontade de treinar não desapareceu porque você ficou preguiçoso. Desapareceu por causa DISTO.\" | Hook C: \"3 coisas matando sua motivação de academia depois dos 40 — e nenhuma delas é o que você pensa.\"", hookVisual_en:"Speaker counting on fingers, gym background", hookVisual_pt:"Speaker contando nos dedos, academia ao fundo", format_en:"UGC Talking Head (VH-001) | 75s (~240 words)", format_pt:"UGC Talking Head (VH-001) | 75s (~240 palavras)", speaker_en:"Male 40-48, gym setting, casual", speaker_pt:"Homem 40-48, ambiente de academia, casual", execution_en:"Lists common mistakes. Then: 'But the biggest nobody talks about? Ignoring your hormones.' Mechanism: T drops → drive drops → skip more → T drops further. 'It's a cycle. TMC breaks it.' CTA.", execution_pt:"Lista erros comuns. Depois: 'Mas o maior que ninguém fala? Ignorar seus hormônios.' Mecanismo: T cai → vontade cai → pula mais → T cai mais. 'É um ciclo. TMC quebra ele.' CTA."},
  {id:31, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video MID: Guessing vs Measuring (Expanded)", title_pt:"ACQ Vídeo MID: Chutando vs Medindo (Expandido)", angle_en:"The quantified-self man's blind spot — full mechanism", angle_pt:"O ponto cego do homem quantified-self — mecanismo completo", hookCopy_en:"Hook A: \"I spent 2 years tracking everything — macros, sleep, HRV, training volume. My results still declined. Here's what I was missing.\" | Hook B: \"You're optimizing the wrong variable. And it's costing you 2-3 years of progress.\" | Hook C: \"What if the reason you plateaued has nothing to do with your training, diet, or recovery protocol?\"", hookCopy_pt:"Hook A: \"Passei 2 anos rastreando tudo — macros, sono, HRV, volume de treino. Meus resultados ainda caíram. Aqui está o que eu estava perdendo.\" | Hook B: \"Você está otimizando a variável errada. E está te custando 2-3 anos de progresso.\" | Hook C: \"E se a razão pela qual você estagnou não tem nada a ver com seu treino, dieta ou protocolo de recuperação?\"", hookVisual_en:"Speaker scrolling through health app dashboards, zooms on gap", hookVisual_pt:"Speaker rolando dashboards de app de saúde, dá zoom na lacuna", format_en:"UGC Talking Head + screen inserts | 2:20 (~448 words)", format_pt:"UGC Talking Head + inserts de tela | 2:20 (~448 palavras)", speaker_en:"Male 44-50, tech-forward, organized", speaker_pt:"Homem 44-50, tech-forward, organizado", execution_en:"Story: tracking setup, perfect adherence, still plateaued. Discovered free T vs total T, SHBG, cortisol. TMC: ashwa + tongkat + boron. 'Within 6 weeks, lifts went up, recovery improved, drive came back.' CTA: 365-day money-back guarantee.", execution_pt:"História: setup de tracking, aderência perfeita, ainda estagnou. Descobriu T livre vs T total, SHBG, cortisol. TMC: ashwa + tongkat + boro. 'Em 6 semanas, lifts subiram, recuperação melhorou, vontade voltou.' CTA: 365 dias money-back."},
  {id:32, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video MID: Mistakes Enumeration (Expanded)", title_pt:"ACQ Vídeo MID: Enumeração de Erros (Expandido)", angle_en:"4 visible mistakes + 1 invisible mistake killing gym results", angle_pt:"4 erros visíveis + 1 erro invisível matando resultados de academia", hookCopy_en:"Hook A: \"I'm going to list 5 things killing your gym results after 40. You already know 4. It's the 5th that changed everything.\" | Hook B: \"Every man over 40 at the gym is making the same invisible mistake. Nothing to do with training.\" | Hook C: \"Are you making these 5 mistakes that are silently killing your gains after 40?\"", hookCopy_pt:"Hook A: \"Vou listar 5 coisas matando seus resultados de academia depois dos 40. Você já sabe 4. Foi a 5a que mudou tudo.\" | Hook B: \"Todo homem acima de 40 na academia está cometendo o mesmo erro invisível. Nada a ver com treino.\" | Hook C: \"Você está cometendo esses 5 erros que estão silenciosamente matando seus ganhos depois dos 40?\"", hookVisual_en:"Speaker with whiteboard/notepad listing 'MISTAKES'", hookVisual_pt:"Speaker com quadro branco/bloco listando 'ERROS'", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 42-50, experienced lifter, garage gym", speaker_pt:"Homem 42-50, lifter experiente, academia de garagem", execution_en:"5 mistakes: (1) Too heavy (2) Skipping warmup (3) Not enough protein (4) Poor sleep (5) IGNORING HORMONAL FOUNDATION. Deep dive on #5: T decline → drive ↓ → quality ↓ → train less → T drops further. TMC breaks cycle. CTA.", execution_pt:"5 erros: (1) Pesado demais (2) Pular aquecimento (3) Pouca proteína (4) Sono ruim (5) IGNORAR FUNDAÇÃO HORMONAL. Mergulho no #5: declínio de T → vontade ↓ → qualidade ↓ → treina menos → T cai mais. TMC quebra ciclo. CTA."},
  {id:33, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video MID: Not Laziness — Hormones", title_pt:"ACQ Vídeo MID: Não é Preguiça — Hormônios", angle_en:"Your lost gym drive isn't a character flaw — it's biology", angle_pt:"Sua vontade perdida de treinar não é falha de caráter — é biologia", hookCopy_en:"Hook A: \"It's not laziness. It's not discipline. Your body is literally fighting against you getting to the gym.\" | Hook B: \"You used to love the gym. Now you can barely drag yourself there. Nothing to do with willpower.\" | Hook C: \"The real reason men lose their drive after 40 — and why 'just push through it' makes it worse.\"", hookCopy_pt:"Hook A: \"Não é preguiça. Não é disciplina. Seu corpo está literalmente lutando contra você chegar na academia.\" | Hook B: \"Você costumava amar a academia. Agora mal consegue se arrastar até lá. Nada a ver com força de vontade.\" | Hook C: \"A razão real pela qual homens perdem a vontade depois dos 40 — e por que 'só aguentar' piora isso.\"", hookVisual_en:"Speaker on couch, gym bag untouched by door, speaks to camera", hookVisual_pt:"Speaker no sofá, mochila de academia intocada perto da porta, fala pra câmera", format_en:"UGC Talking Head (VH-001) | 2:40 (~512 words)", format_pt:"UGC Talking Head (VH-001) | 2:40 (~512 palavras)", speaker_en:"Male 48-55, honest/vulnerable, home setting", speaker_pt:"Homem 48-55, honesto/vulnerável, ambiente de casa", execution_en:"Vulnerable opening: 'I used to work out 5 days. Then 4. Then 3.' Reframe: T dropped to clinically low normal. Mechanism: low T → low dopamine → drive ↓ → forcing = cortisol ↑ → T drops more. TMC: ashwa + tongkat. 'Week 3, I caught myself WANTING to go.' CTA.", execution_pt:"Abertura vulnerável: 'Eu costumava treinar 5 dias. Depois 4. Depois 3.' Reenquadre: T caiu pra clinicamente baixo-normal. Mecanismo: T baixa → dopamina baixa → vontade ↓ → forçar = cortisol ↑ → T cai mais. TMC: ashwa + tongkat. 'Semana 3, me peguei QUERENDO ir.' CTA."},
  {id:34, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video LONG: Not Laziness (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Não é Preguiça (Mini-VSL)", angle_en:"Complete science behind lost motivation — why willpower fails", angle_pt:"Ciência completa por trás da motivação perdida — por que força de vontade falha", hookCopy_en:"Hook A: \"Nobody in the fitness industry will tell you this: your lost motivation isn't a discipline problem. It's a hormone problem.\" | Hook B: \"I've been working out for 30 years. At 52, I almost quit. Here's why — and why I didn't.\" | Hook C: \"If you're over 45 and fighting yourself to get to the gym — stop. What you're doing is making it worse.\"", hookCopy_pt:"Hook A: \"Ninguém na indústria de fitness vai te contar isso: sua motivação perdida não é um problema de disciplina. É um problema de hormônio.\" | Hook B: \"Treino há 30 anos. Aos 52, quase desisti. Aqui está por que — e por que não desisti.\" | Hook C: \"Se você tem mais de 45 e está lutando contra você mesmo pra chegar na academia — pare. O que você está fazendo está piorando.\"", hookVisual_en:"Speaker in empty gym, early morning: 'I need to tell you something nobody in the fitness industry will say.'", hookVisual_pt:"Speaker em academia vazia, manhã cedo: 'Preciso te contar algo que ninguém na indústria de fitness vai falar.'", format_en:"UGC Talking Head + B-roll | 4:30 (~864 words)", format_pt:"UGC Talking Head + B-roll | 4:30 (~864 palavras)", speaker_en:"Male 50-60, ex-athlete or lifelong fitness", speaker_pt:"Homem 50-60, ex-atleta ou fitness pra vida toda", execution_en:"Mini-VSL. Decades of lifting. The decline. Tried everything. The science: T → dopamine → motivation circuits change. 'Every time you force yourself, cortisol spikes. Cortisol is #1 T killer.' TMC: ashwa + tongkat + boron + shilajit + Lion's Mane. 'Replaced morning coffee. That's it.' CTA: 365-day money-back guarantee.", execution_pt:"Mini-VSL. Décadas levantando. O declínio. Tentou tudo. A ciência: T → dopamina → circuitos de motivação mudam. 'Toda vez que você se força, cortisol sobe. Cortisol é o assassino #1 de T.' TMC: ashwa + tongkat + boro + shilajit + Lion's Mane. 'Substituí o café da manhã. Só isso.' CTA: 365 dias money-back."},
  {id:35, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"RTG Video: Guarantee / Risk Reversal", title_pt:"RTG Vídeo: Garantia / Reversão de Risco", angle_en:"Remove the last barrier — you risk nothing", angle_pt:"Remova a última barreira — você não arrisca nada", hookCopy_en:"Hook A: \"You've been thinking about trying TMC. Here's what's stopping you — and why it shouldn't.\" | Hook B: \"90 days. That's how long you have to decide if TMC works. If it doesn't, you pay nothing.\" | Hook C: \"The only risk of trying TMC is staying exactly where you are.\"", hookCopy_pt:"Hook A: \"Você vem pensando em experimentar TMC. Aqui está o que está te parando — e por que não deveria.\" | Hook B: \"365 dias money-back. Esse é o tempo que você tem pra decidir se TMC funciona. Se não funcionar, você não paga nada.\" | Hook C: \"O único risco de experimentar TMC é ficar exatamente onde você está.\"", hookVisual_en:"Speaker with both palms up: 'Let me remove the last excuse.'", hookVisual_pt:"Speaker com ambas as palmas pra cima: 'Deixe-me remover a última desculpa.'", format_en:"UGC Talking Head | RTG | 75s (~240 words)", format_pt:"UGC Talking Head | RTG | 75s (~240 palavras)", speaker_en:"Male 48-55, empathetic, direct", speaker_pt:"Homem 48-55, empático, direto", execution_en:"Direct address to warm audience. 365-day money-back guarantee explained. 'No questions.' Brief ingredient reminder. 'You've spent more on supplements that didn't work.' CTA: try now, risk-free.", execution_pt:"Endereço direto à audiência morna. Garantia de 365 dias money-back explicada. 'Sem perguntas.' Lembrete breve de ingredientes. 'Você já gastou mais com suplementos que não funcionaram.' CTA: experimente agora, risk-free."},
  {id:36, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"RTG Image: Timeline Static", title_pt:"RTG Image: Static de Linha do Tempo", angle_en:"Progressive results visualization", angle_pt:"Visualização de resultados progressivos", hookCopy_en:"\"Week 1 → Subtle. Week 3 → Noticeable. Week 6 → Undeniable.\"", hookCopy_pt:"\"Semana 1 → Sutil. Semana 3 → Notável. Semana 6 → Inegável.\"", hookVisual_en:"Timeline progression graphic with milestone markers, TMC cup at start. Subhead: 'What happens when you replace your morning coffee with TMC.'", hookVisual_pt:"Gráfico de progressão de linha do tempo com marcadores de marco, xícara TMC no início. Subhead: 'O que acontece quando você substitui seu café da manhã por TMC.'", format_en:"Static Image — Timeline (Retargeting)", format_pt:"Imagem Estática — Linha do Tempo (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Clean timeline infographic. 3 milestones. TMC product anchoring start. Warm gradient. CTA: 'Start your timeline → 90 days risk-free.'", execution_pt:"Infográfico de linha do tempo limpo. 3 marcos. Produto TMC ancorando o início. Gradiente quente. CTA: 'Comece sua linha do tempo → 365 dias money-back guarantee.'"},
  {id:37, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"winner", title_en:"Winner Var 7: Red/Auburn Hair", title_pt:"Winner Var 7: Cabelo Ruivo/Acobreado", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition exactly — torso shot, no face. Gray heather t-shirt soaked through, hand pulling shirt outward, wedding ring visible. Same bedroom, clock 2:15 AM, messy bed. Only change: red/auburn hair — disheveled, slightly damp, waves or slight curl, falling past shoulder. 4:5 vertical.", hookVisual_pt:"Mesma composição exata — torso sem rosto. Camiseta cinza encharcada, aliança visível. Única mudança: cabelo ruivo/acobreado — despenteado, levemente úmido, ondulado. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does hair color (red vs brunette vs blonde) affect performance? Three-way color test with V1/V4/V7.", execution_pt:"Copy VERBATIM. Teste: Cor do cabelo (ruivo vs castanho vs loiro) afeta performance? Teste triplo com V1/V4/V7."},
  {id:38, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"winner", title_en:"Winner Var 8: Messy Bun — Sweaty Flyaways", title_pt:"Winner Var 8: Coque Bagunçado — Fios Suados", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Camera angle raised — frame from mid-chest to just below chin/jaw. Hair thrown up in hasty messy bun — improvised, asymmetric, loose strands falling. Sweaty flyaways sticking to temples and back of neck. Same gray t-shirt, soaked. Wedding ring visible. Clock 2:15 AM in background. Raw iPhone aesthetic. 4:5 vertical.", hookVisual_pt:"Ângulo levantado — enquadramento do meio do peito até o queixo. Cabelo jogado em coque bagunçado — improvisado, assimétrico. Fios suados grudados nas têmporas e pescoço. Camiseta cinza encharcada. Aliança visível. Relógio 2:15 AM. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does 'threw hair up to cool down' gesture signal higher intensity of exertion than hair-down?", execution_pt:"Copy VERBATIM. Teste: 'Prendeu o cabelo pra refrescar' sinaliza maior intensidade do que cabelo solto?"},
  {id:39, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Native Image: The Flat Arm (Format A)", title_pt:"ACQ Native Image: O Braço Murcho (Format A)", angle_en:"The lost pump isn't vanity — it's a blood flow signal your cardiovascular system sends every workout", angle_pt:"O pump perdido não é vaidade — é um sinal de fluxo sanguíneo que seu sistema cardiovascular envia a cada treino", hookCopy_en:"\"Gary used to get pumps that made guys in the gym stop and stare. At 52, he flexed and saw nothing.\"\"No pump. Flat muscles. Weak workouts. It's not your effort — it's your blood flow.\" | Hook B: \"That flat, empty feeling after a workout isn't effort — it's not what you think.\" | Hook C: \"Did you know 1 in 3 men over 50 has restricted blood flow — and it shows in the gym first?\"", hookCopy_pt:"\"Gary costumava ter pumps que faziam os caras na academia pararem para olhar. Aos 52, ele flexionava e não via nada.\"\"Sem pump. Músculos chapados. Treinos fracos. Não é seu esforço — é seu fluxo sanguíneo.\" | Hook B: \"Aquela sensação chapada e vazia depois do treino não é esforço — não é o que você pensa.\" | Hook C: \"Você sabia que 1 em 3 homens acima de 50 tem fluxo sanguíneo restrito — e aparece primeiro na academia?\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Flexed forearm — completely flat. No veins, no definition, skin smooth. The absence of the expected pump IS the shock. Gym bathroom / fluorescent light. Single body part, close-up. [Category: Body Shame]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Antebraço flexionado — completamente murcho. Sem veias, sem definição. A ausência do pump esperado É o choque. [Category: Body Shame]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Gary, 52, serious lifter 25 years", speaker_pt:"Primeira pessoa masculina — Gary, 52, levantador sério por 25 anos", execution_en:"HEADLINE: 'I used to get veins from my wrist to my shoulder. At 52, I flex and nothing happens. I finally found out why.' | NARRATIVE ~1800w: Gary in gym bathroom mid-workout, flexing — flat. ESCALATION: pump smaller every year; workouts feel hollow; motivation declining. FAILED SOLUTIONS: pre-workout → L-citrulline alone → arginine. MECHANISM: NO pathway requires eNOS activity driven by T; as T declines, even L-citrulline is compromised. TMC: L-citrulline (NO) + tongkat ali (T → eNOS). DISCOVERY. TRANSFORMATION. BRIDGE. CTA.", execution_pt:"HEADLINE: 'Tinha veias do pulso ao ombro. Aos 52, flexiono e nada acontece. Finalmente descobri o porquê.' | NARRATIVA ~1800w. MECHANISM: via NO requer atividade eNOS impulsionada por T; declínio de T compromete até o L-citrulline. TMC: L-citrulline + tongkat ali. DISCOVERY: TMC. CTA."},
  {id:40, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Native Image: The 98% Problem (Format A)", title_pt:"ACQ Native Image: O Problema dos 98% (Format A)", angle_en:"Most men with 'normal' testosterone still feel terrible — because 98% of their T is biologically unavailable", angle_pt:"A maioria dos homens com testosterona 'normal' ainda se sente péssima — porque 98% do T deles é biologicamente indisponível", hookCopy_en:"\"Bob's doctor told him his testosterone was in the normal range. Bob still felt like garbage. They were both right — for completely different reasons.\"\"98% of your testosterone is trapped. One mineral frees it.\" | Hook B: \"Your body makes plenty of testosterone. The problem? Most of it never reaches your muscles.\" | Hook C: \"Did you know there's a protein in your blood that's hoarding your testosterone — and a 10mg mineral that stops it?\"", hookCopy_pt:"\"O médico disse que a testosterona de Bob estava na faixa normal. Bob ainda se sentia uma merda. Os dois estavam certos — por razões completamente diferentes.\"\"98% da sua testosterona está aprisionada. Um mineral libera ela.\" | Hook B: \"Seu corpo produz bastante testosterona. O problema? A maioria nunca chega aos seus músculos.\" | Hook C: \"Você sabia que tem uma proteína no seu sangue acumulando sua testosterona — e um mineral de 10mg que para isso?\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Printed lab panel — two highlighted lines: 'Total Testosterone: 512 ng/dL (Normal ✓)' and below it 'Free Testosterone: 4.1 pg/mL (LOW ↓)'. The contrast between Normal and LOW in the same printout IS the shock. [Category: Medical Shock]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Resultado de exame impresso — duas linhas destacadas: 'Testosterona Total: 512 ng/dL (Normal ✓)' e abaixo 'Testosterona Livre: 4.1 pg/mL (BAIXA ↓)'. O contraste entre Normal e BAIXO no mesmo laudo É o choque. [Category: Medical Shock]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Bob, 54, frustrated after being told T is 'fine'", speaker_pt:"Primeira pessoa masculina — Bob, 54, frustrado após ser dito que T está 'normal'", execution_en:"HEADLINE: 'My doctor said my testosterone was normal. Then I learned about the protein that was stealing 98% of it.' | NARRATIVE ~1800w: Bob in doctor's office, Total T 512, 'that's normal Bob.' ESCALATION: every symptom of low T despite 'normal' results. FAILED SOLUTIONS: TRT wouldn't prescribe → supplements → one naturopath who mentioned SHBG briefly. MECHANISM: SHBG binds 98% of T → Free T 4.1 pg/mL (critical low) → Boron 10mg reduces SHBG → free T rises → body can actually use it. DISCOVERY: TMC (boron + tongkat ali + ashwagandha). TRANSFORMATION (labs that finally change). BRIDGE to men told they're 'normal' but feel otherwise. CTA.", execution_pt:"HEADLINE: 'Meu médico disse que minha testosterona estava normal. Depois aprendi sobre a proteína que roubava 98% dela.' | NARRATIVA ~1800w. MECHANISM: SHBG liga 98% do T → T Livre 4.1 pg/mL → Boro 10mg reduz SHBG → T Livre sobe. DISCOVERY: TMC. CTA."},
  {id:41, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video SHORT: Blood Flow / No Pump", title_pt:"ACQ Vídeo SHORT: Fluxo Sanguíneo / Sem Pump", angle_en:"Your lost pump is a blood flow problem with a specific fix", angle_pt:"Seu pump perdido é um problema de fluxo sanguíneo com uma correção específica", hookCopy_en:"Hook A: \"Remember when you used to leave the gym pumped? Here's why that stopped.\" | Hook B: \"No pump. Flat muscles. You're training harder than ever. The problem isn't effort — it's blood flow.\" | Hook C: \"The fastest way to get your pump back after 50? Nothing to do with training.\"", hookCopy_pt:"Hook A: \"Lembra quando você costumava sair da academia pumped? Aqui está por que isso parou.\" | Hook B: \"Sem pump. Músculos chapados. Você está treinando mais forte que nunca. O problema não é esforço — é fluxo sanguíneo.\" | Hook C: \"A forma mais rápida de recuperar seu pump depois dos 50? Nada a ver com treino.\"", hookVisual_en:"Speaker flexing arm, looking disappointed, then addresses camera", hookVisual_pt:"Speaker flexionando braço, parecendo desapontado, depois fala pra câmera", format_en:"UGC Talking Head (VH-001) | 70s (~224 words)", format_pt:"UGC Talking Head (VH-001) | 70s (~224 palavras)", speaker_en:"Male 50-58, lifter, post-workout gym", speaker_pt:"Homem 50-58, lifter, academia pós-treino", execution_en:"'I used to leave here looking swole. Now same as when I walked in.' Mechanism: NO production declines → blood vessels don't dilate → no pump. TMC: L-citrulline + support. 'Week 3, pump came back.' CTA.", execution_pt:"'Eu costumava sair daqui parecendo enorme. Agora igual a quando entrei.' Mecanismo: produção de NO declina → vasos sanguíneos não dilatam → sem pump. TMC: L-citrulina + suporte. 'Semana 3, pump voltou.' CTA."},
  {id:42, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video SHORT: Mineral That Frees T", title_pt:"ACQ Vídeo SHORT: O Mineral Que Libera T", angle_en:"Trapped testosterone = hidden reason you're not building muscle", angle_pt:"Testosterona aprisionada = razão escondida pela qual você não está construindo músculo", hookCopy_en:"Hook A: \"98% of your testosterone is trapped. That's why your workouts aren't working.\" | Hook B: \"Your body makes plenty of testosterone. But there's a protein blocking almost all of it from reaching your muscles.\" | Hook C: \"What if the reason you're not building muscle has nothing to do with your workout?\"", hookCopy_pt:"Hook A: \"98% da sua testosterona está aprisionada. Por isso seus treinos não estão funcionando.\" | Hook B: \"Seu corpo produz bastante testosterona. Mas tem uma proteína bloqueando quase toda ela de chegar aos seus músculos.\" | Hook C: \"E se a razão pela qual você não está construindo músculo não tem nada a ver com seu treino?\"", hookVisual_en:"Speaker holding up small pill/mineral capsule between fingers", hookVisual_pt:"Speaker segurando pequena cápsula/mineral entre os dedos", format_en:"UGC Talking Head (VH-001) | 75s (~240 words)", format_pt:"UGC Talking Head (VH-001) | 75s (~240 palavras)", speaker_en:"Male 48-55, intelligent/curious type", speaker_pt:"Homem 48-55, tipo inteligente/curioso", execution_en:"'You might not have low T. You might have TRAPPED T.' SHBG mechanism. 'One mineral — boron — reduces SHBG.' TMC: boron at clinical doses + tongkat + ashwa. 'It's about FREEING what you already have.' CTA.", execution_pt:"'Você pode não ter T baixa. Você pode ter T APRISIONADA.' Mecanismo SHBG. 'Um mineral — boro — reduz SHBG.' TMC: boro em doses clínicas + tongkat + ashwa. 'É sobre LIBERAR o que você já tem.' CTA."},
