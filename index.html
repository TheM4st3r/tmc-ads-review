  {id:40, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Native Image: The 98% Problem (Format A)", title_pt:"ACQ Native Image: O Problema dos 98% (Format A)", angle_en:"Wife silently observes husband measuring his arm in secret — story 100% about him (LEI #10), narrated through her eyes", angle_pt:"Esposa observa em silêncio marido medindo o braço em segredo — história 100% sobre ele (LEI #10), narrada pelos olhos dela", hookCopy_en:"\"Lisa walked into their bedroom and froze. Mike was flexing in the closet mirror, measuring his bicep with a tape. The number was the same as the year before. She closed the door quietly and didn't tell him she'd seen.\"", hookCopy_pt:"\"Lisa entrou no quarto deles e congelou. Mike estava flexionando no espelho do closet, medindo o bíceps com uma fita métrica. O número era o mesmo do ano anterior. Ela fechou a porta em silêncio e não disse que tinha visto.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Tape measure wrapped around Mike's flexed left bicep, reading '13.5 in.' Tape held tight (measuring flexed). Behind him, in the closet mirror reflection, Lisa is visible at the doorframe, watching silently — Mike doesn't see her. Single intimate moment. [Category: Marital Intimacy / Hidden Decline]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Fita métrica em volta do bíceps esquerdo flexionado de Mike, marcando '13.5 in'. Fita apertada (medindo flexionado). Atrás dele, no reflexo do espelho do closet, Lisa é visível no batente da porta, observando em silêncio — Mike não a vê. Momento único íntimo. [Category: Intimidade Conjugal / Decadência Escondida]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Wife POV (Lisa narrator) — story 100% about him (Mike, 54), married 26 years. LEI #10 compliant.", speaker_pt:"POV esposa (Lisa narradora) — história 100% sobre ele (Mike, 54), casados há 26 anos. LEI #10 cumprida.", execution_en:"HEADLINE: 'I caught my husband measuring his arm in our bedroom. He didn't see me. I didn't say anything for a week.' | NARRATIVE ~1800w (intimate/embarrassing per Derick, LEI #10): NARRATOR Lisa, 100% about Mike. ESCALATION: Lisa observes Mike hiding his body — stops taking shirt off at home, secret notebook with measurements, buys tape measure. She knows him. He has to find it himself. FAILED SOLUTIONS through Mike (Lisa watches): TRT consultation declined → SHBG mention without explanation. MECHANISM (Lisa researches in secret): SHBG trapping. T present but inactive. DISCOVERY (she leaves a folder about TMC 'casually' on counter). TRANSFORMATION: Mike taking his shirt off at home again. CTA (LEI #4).", execution_pt:"HEADLINE: 'Peguei meu marido medindo o braço no nosso quarto. Ele não me viu. Eu não disse nada por uma semana.' | NARRATIVA ~1800w (íntimo/constrangedor conforme Derick, LEI #10): NARRADORA Lisa, 100% sobre Mike. ESCALATION: Lisa observa Mike escondendo o corpo — para de tirar camisa em casa, caderno secreto com medidas, compra fita métrica. Ela conhece ele. Ele tem que descobrir sozinho. FAILED SOLUTIONS via Mike (Lisa observa): consulta TRT declinada → menção a SHBG sem explicação. MECHANISM (Lisa pesquisa em segredo): aprisionamento SHBG. T presente mas inativo. DISCOVERY (ela deixa pasta sobre TMC 'casualmente' na bancada). TRANSFORMATION: Mike tirando camisa em casa de novo. CTA (LEI #4).",v:2},
  {id:41, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video SHORT: Blood Flow / No Pump", title_pt:"ACQ Vídeo SHORT: Fluxo Sanguíneo / Sem Pump", angle_en:"Personified vein apologizes for failing to give pumps — blood flow visualized as exhausted Pixar character", angle_pt:"Veia personificada se desculpa por falhar em dar pumps — fluxo sanguíneo visualizado como personagem Pixar exausta", hookCopy_en:"\"Hi, I'm your vein. And I haven't been able to give you a real pump in 3 years.\"", hookCopy_pt:"\"Oi, eu sou sua veia. E eu não consegui te dar um pump de verdade nos últimos 3 anos.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Animated vein character — skinny, frustrated, smaller than she should be. Tries to inflate her tube but only coughs out a weak puff of air. Looks at the muscle next to her sadly: \"Sorry, buddy.\" Muscle character (defeated) gives a thumbs-down.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Personagem veia animada — magrinha, frustrada, menor do que deveria ser. Tenta inflar o tubo dela mas só tosse um vento fraco. Olha pro músculo ao lado dela tristemente: \"Foi mal, parceiro.\" Personagem músculo (derrotado) dá um polegar pra baixo.", format_en:"AI Animated Pixar-Style 3D | Validated internally", format_pt:"Animação 3D AI Pixar-Style | Validado internamente", speaker_en:"Vein personified (Pixar 3D character) — exhausted, apologetic vascular character", speaker_pt:"Veia personificada (personagem Pixar 3D) — personagem vascular exausta, pedindo desculpas", execution_en:"DURATION 70s. Structure: \"Hi, I'm your [X]\" validated. Vein explains NO pathway: she needs nitric oxide to vasodilate, NO needs L-citrulline + endothelial function. T-decline killed her engine. TMC = L-citrulline + tongkat ali (T support). Speaker IMPREVISÍVEL + congruente (no pump = blood flow). Point-of-pain instantâneo. CTA with 'they'll'.", execution_pt:"DURAÇÃO 70s. Estrutura: \"Oi, eu sou sua [X]\" validada. Veia explica via NO: ela precisa de óxido nítrico pra vasodilatar, NO precisa de L-citrulina + função endotelial. T-decline matou o motor dela. TMC = L-citrulina + tongkat ali (suporte T). Speaker IMPREVISÍVEL + congruente. Point-of-pain instantâneo. CTA com 'they'll'.",v:2},
  {id:42, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video SHORT: Mineral That Frees T", title_pt:"ACQ Vídeo SHORT: O Mineral Que Libera T", angle_en:"Approved Hook A executed in Pixar — SHBG as literal jailer, 98% of T trapped behind bars", angle_pt:"Hook A aprovado executado em Pixar — SHBG como carcereiro literal, 98% de T preso atrás de barras", hookCopy_en:"\"98% of your testosterone is trapped. And that's why your workouts aren't working.\"", hookCopy_pt:"\"98% da sua testosterona está presa. E é por isso que seus treinos não estão funcionando.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Testosterone (Pixar character) trapped behind iron bars in a SHBG-shaped molecular prison. SHBG personified as fat smug guard with keys jangling. Camera dolly out reveals 98 other T's also trapped, only 2 free outside the cage. T shakes the bars, frustrated: \"98% of me is locked in here.\"", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Testosterona (personagem Pixar) presa atrás de barras de ferro numa prisão molecular em formato SHBG. SHBG personificado como guarda gordo prepotente com chaves balançando. Câmera dolly out revela outros 98 Ts também presos, só 2 livres lá fora. T balança as barras, frustrada: \"98% de mim está preso aqui.\"", format_en:"AI Animated Pixar-Style 3D | Validated internally — Hook A approved by Derick", format_pt:"Animação 3D AI Pixar-Style | Validado internamente — Hook A aprovado pelo Derick", speaker_en:"Testosterone trapped (Pixar 3D, continuity from AD#21, #22, #33) + SHBG jailer character", speaker_pt:"Testosterona presa (Pixar 3D, continuity dos AD#21, #22, #33) + personagem carcereiro SHBG", execution_en:"DURATION 75s. Hook approved by Derick + Pixar elite execution. SHBG as literal prison villain = maximum congruence. Boron arrives as hero with the key, releases the trapped T. Speaker IMPREVISÍVEL + congruente. Point-of-pain SPECIFIC (98% trapped). CTA with 'they'll'.", execution_pt:"DURAÇÃO 75s. Hook aprovado pelo Derick + execução Pixar elite. SHBG como vilão de prisão literal = congruência máxima. Boron chega como herói com a chave, liberta as Ts presas. Speaker IMPREVISÍVEL + congruente. Point-of-pain ESPECÍFICO (98% preso). CTA com 'they'll'.",v:2},
  {id:43, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video MID: Blood Flow (Expanded)", title_pt:"ACQ Vídeo MID: Fluxo Sanguíneo (Expandido)", angle_en:"Buddy-cop dynamic — Vein and Muscle (Pixar 3D) blame each other for missing pumps", angle_pt:"Dinâmica buddy-cop — Veia e Músculo (Pixar 3D) culpam um ao outro pela falta de pumps", hookCopy_en:"\"Hi, I'm your vein. This is your muscle. And we haven't been working together since you turned 50.\"", hookCopy_pt:"\"Oi, eu sou sua veia. Esse é seu músculo. E a gente não trabalha junto desde que você fez 50.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Vein character (skinny, anxious) tries to pump blood. Muscle character (defeated, slumped) waits anxiously. Muscle: \"Bro, where's my pump?\" Vein: \"I'M TRYING, MAN.\" Comedic frustrated dialogue, both fail, both blame each other.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Personagem Veia (magrinha, ansiosa) tenta bombear sangue. Personagem Músculo (derrotado, encurvado) espera ansioso. Músculo: \"Bro, cadê meu pump?\" Veia: \"TÔ TENTANDO, CARA.\" Diálogo cômico frustrado, os dois falham, os dois se culpam.", format_en:"AI Animated Pixar-Style 3D — buddy-cop dynamic (2:20)", format_pt:"Animação 3D AI Pixar-Style — dinâmica buddy-cop (2:20)", speaker_en:"Vein + Muscle (Pixar 3D characters, continuity from AD#18, #41)", speaker_pt:"Veia + Músculo (personagens Pixar 3D, continuity dos AD#18, #41)", execution_en:"DURATION 2:20. Buddy-cop dynamic Pixar = pure entertainment. Multiple loops (que dupla maluca? por que não trabalham?). Mechanism explained via dialogue: vein needs L-citrulline (NO), muscle needs T support, both need cortisol gone. TMC = team manager that fixes them both. Cumulative entertainment storytelling. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:20. Dinâmica buddy-cop Pixar = entretenimento puro. Múltiplos loops (que dupla maluca? por que não trabalham?). Mecanismo explicado via diálogo: veia precisa de L-citrulina (NO), músculo precisa de suporte T, ambos precisam que cortisol vá embora. TMC = gerente do time que conserta os dois. Entretenimento storytelling cumulativo. CTA com 'they'll'.",v:2},
  {id:44, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video MID: Mineral That Frees T (Expanded)", title_pt:"ACQ Vídeo MID: O Mineral Que Libera T (Expandido)", angle_en:"Boron arrives as caped Pixar hero to break T out of SHBG prison — rescue narrative as mechanism reveal", angle_pt:"Boron chega como herói Pixar com capa pra quebrar T da prisão SHBG — narrativa de resgate como revelação de mecanismo", hookCopy_en:"\"Most of your testosterone is locked in a cage. There's one mineral that can break the lock — and you're probably not getting enough of it.\"", hookCopy_pt:"\"A maior parte da sua testosterona está trancada numa jaula. Existe um mineral que pode quebrar a fechadura — e você provavelmente não está tomando o suficiente.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): SHBG molecular prison cell. T (defeated, multiple copies) trapped behind bars. Boron (caped Pixar hero with B insignia) walks in dramatic slow-motion, plants himself in front of cell: \"I'm here to break you out.\" Lock cracks. Cinematic Pixar action.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Cela de prisão molecular SHBG. T (derrotada, múltiplas cópias) presa atrás de barras. Boron (herói Pixar com capa e insígnia B) entra em câmera lenta dramática, se planta na frente da cela: \"Tô aqui pra te tirar.\" Fechadura racha. Ação cinematográfica Pixar.", format_en:"AI Animated Pixar-Style 3D — rescue narrative (2:30)", format_pt:"Animação 3D AI Pixar-Style — narrativa de resgate (2:30)", speaker_en:"Boron (caped Pixar hero) + Testosterone (rescued character) + SHBG (defeated jailer) — continuity from AD#42", speaker_pt:"Boron (herói Pixar com capa) + Testosterona (personagem resgatada) + SHBG (carcereiro derrotado) — continuity do AD#42", execution_en:"DURATION 2:30. Storytelling de resgate Pixar = curiosidade total. Mechanism (SHBG/Boron) embedded in visual narrative. T explains: 'I was trapped for years. Then Boron showed up.' TMC contains 10mg Boron + tongkat ali + ashwagandha — the full liberation team. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:30. Storytelling de resgate Pixar = curiosidade total. Mecanismo (SHBG/Boron) embutido em narrativa visual. T explica: 'Fiquei presa por anos. Aí Boron apareceu.' TMC contém 10mg de Boron + tongkat ali + ashwagandha — a equipe completa de libertação. CTA com 'they'll'.",v:2},
  {id:45, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video MID: Age 67 Still Getting Pumps", title_pt:"ACQ Vídeo MID: 67 Anos Ainda Tendo Pumps", angle_en:"Visual proof that pump + muscle doesn't have to fade with age", angle_pt:"Prova visual de que pump + músculo não precisa desaparecer com a idade", hookCopy_en:"Hook A: \"I'm 62. I still get pumps that men half my age envy. Want to know my secret?\" | Hook B: \"Most men accept losing their pump after 50. I didn't. Here's what I did differently.\" | Hook C: \"At 62, my doctor said my testosterone levels look like a 35-year-old's. He asked what I was taking.\"", hookCopy_pt:"Hook A: \"Tenho 62. Ainda tenho pumps que homens com metade da minha idade invejam. Quer saber meu segredo?\" | Hook B: \"A maioria dos homens aceita perder o pump depois dos 50. Eu não. Aqui está o que fiz diferente.\" | Hook C: \"Aos 62, meu médico disse que meus níveis de testosterona parecem de um cara de 35. Ele perguntou o que eu estava tomando.\"", hookVisual_en:"Speaker flexes, clearly muscular for age, grins at camera", hookVisual_pt:"Speaker flexiona, claramente musculoso pra idade, sorri pra câmera", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 55-65, visibly fit, impressive for age", speaker_pt:"Homem 55-65, visivelmente em forma, impressionante pra idade", execution_en:"Visual proof opening. 'Not genetic. Not TRT. Not professional.' Started losing pump in 50s. Research: hormonal support. TMC daily. 'By 3 months, my doctor was asking ME what I was taking.' CTA.", execution_pt:"Abertura com prova visual. 'Não é genética. Não é TRT. Não sou profissional.' Começou a perder pump nos 50. Pesquisa: suporte hormonal. TMC diário. 'Em 3 meses, meu médico estava perguntando A MIM o que eu estava tomando.' CTA."},
  {id:46, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Video LONG: Age-Defying Proof (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Prova Desafiando Idade (Mini-VSL)", angle_en:"Mini-VSL Pixar épico — full ensemble cast in body city, mechanism virou narrativa de guerra (3:30)", angle_pt:"Mini-VSL Pixar épico — elenco completo na cidade do corpo, mecanismo virou narrativa de guerra (3:30)", hookCopy_en:"\"There's a city inside you that runs your gym game. It's been under siege since you turned 40. Let me tell you who's fighting for you.\"", hookCopy_pt:"\"Tem uma cidade dentro de você que comanda sua academia. Ela está sob cerco desde que você fez 40. Deixa eu te contar quem tá lutando por você.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Aerial sweep of an epic stylized city inside the body. Empty gymnasium. Cracked roads. T as deposed mayor. Cortisol governing from black tower. SHBG castle. Vein pumping weakly. Resistance forms — Boron + L-Citrulline + Ashwagandha + Lion's Mane arrive as caped heroes through gates.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Plano aéreo de uma cidade épica estilizada dentro do corpo. Ginásio vazio. Estradas rachadas. T como prefeito deposto. Cortisol governando da torre negra. Castelo SHBG. Veia bombeando fraco. Resistência se forma — Boron + L-Citrulina + Ashwagandha + Lion's Mane chegam como heróis com capa pelas portas.", format_en:"AI Animated Pixar-Style 3D — Mini-VSL épico full ensemble (3:30)", format_pt:"Animação 3D AI Pixar-Style — Mini-VSL épico elenco completo (3:30)", speaker_en:"Cast Pixar 3D — T (fallen hero), Cortisol (villain), SHBG (jailer), Vein (executor), Boron (liberator), L-Citrulline (messenger), Ashwagandha (general advisor), Lion's Mane (mind keeper)", speaker_pt:"Cast Pixar 3D — T (herói caído), Cortisol (vilão), SHBG (carcereiro), Veia (executora), Boron (libertador), L-Citrulina (mensageira), Ashwagandha (conselheira geral), Lion's Mane (guardiã da mente)", execution_en:"DURATION 3:30. Mini-VSL Pixar épico — entretenimento puro. Cumpre voice-criteria 'ad nativamente curioso' ao extremo. Mechanism (T-decline + SHBG + cortisol + NO pathway) becomes ensemble war narrative. Ingredients arrive one by one as heroes. End: T crowned again, gym restored, city rebuilt. TMC = the alliance that brings them all. CTA with 'they'll'.", execution_pt:"DURAÇÃO 3:30. Mini-VSL Pixar épico — entretenimento puro. Cumpre voice-criteria 'ad nativamente curioso' ao extremo. Mecanismo (T-decline + SHBG + cortisol + via NO) vira narrativa de guerra com elenco completo. Ingredientes chegam um por um como heróis. Fim: T coroada de novo, academia restaurada, cidade reconstruída. TMC = a aliança que une todos. CTA com 'they'll'.",v:2},
  {id:47, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"RTG Video: TMC vs Individual Supplements", title_pt:"RTG Vídeo: TMC vs Suplementos Individuais", angle_en:"Stop buying 6 supplements — TMC replaces them all", angle_pt:"Pare de comprar 6 suplementos — TMC substitui todos eles", hookCopy_en:"Hook A: \"I was spending $180/month on 6 different supplements. Now I spend $2/day on one cup of coffee.\" | Hook B: \"Ashwagandha. Tongkat ali. Boron. Lion's Mane. Shilajit. I was taking them all separately. Here's why I stopped.\" | Hook C: \"Don't buy another testosterone supplement until you hear this.\"", hookCopy_pt:"Hook A: \"Eu estava gastando $180/mês em 6 suplementos diferentes. Agora gasto $2/dia numa xícara de café.\" | Hook B: \"Ashwagandha. Tongkat ali. Boro. Lion's Mane. Shilajit. Eu estava tomando todos separados. Aqui está por que parei.\" | Hook C: \"Não compre outro suplemento de testosterona até ouvir isso.\"", hookVisual_en:"Speaker with 6 supplement bottles lined up, pushes them aside, holds up TMC", hookVisual_pt:"Speaker com 6 potes de suplemento alinhados, empurra pro lado, levanta TMC", format_en:"UGC Talking Head | RTG | 90s (~288 words)", format_pt:"UGC Talking Head | RTG | 90s (~288 palavras)", speaker_en:"Male 45-55, practical/logical, kitchen counter", speaker_pt:"Homem 45-55, prático/lógico, balcão da cozinha", execution_en:"Shows supplement collection. Names each + monthly cost. 'TMC has ALL of these in one cup.' Ingredient comparison (TMC dose vs standalone). 'Same ingredients, clinical doses, less than Starbucks.' CTA: 365-day money-back guarantee.", execution_pt:"Mostra coleção de suplementos. Nomeia cada um + custo mensal. 'TMC tem TODOS esses numa xícara.' Comparação de ingredientes (dose TMC vs avulso). 'Mesmos ingredientes, doses clínicas, menos que Starbucks.' CTA: 365 dias money-back."},
  {id:48, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"RTG Image: Bold Static — 'One cup. 12 ingredients.'", title_pt:"RTG Image: Static em Negrito — 'Uma xícara. 12 ingredientes.'", angle_en:"Product-centered value proposition", angle_pt:"Proposta de valor centrada no produto", hookCopy_en:"\"One cup. 12 ingredients. Zero guesswork.\"", hookCopy_pt:"\"Uma xícara. 12 ingredientes. Zero adivinhação.\"", hookVisual_en:"TMC cup with ingredient names radiating outward. Clean, modern design. Subhead: 'Ashwagandha + Tongkat Ali + Lion's Mane + 9 more.'", hookVisual_pt:"Xícara TMC com nomes de ingredientes irradiando pra fora. Design limpo, moderno. Subhead: 'Ashwagandha + Tongkat Ali + Lion's Mane + mais 9.'", format_en:"Static Image — Bold Static (Retargeting)", format_pt:"Imagem Estática — Static em Negrito (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Product-centered. Ingredient names around central cup. Minimal, premium. Trust badges. CTA: 'Replace your supplement shelf → Try risk-free.'", execution_pt:"Centrado no produto. Nomes de ingredientes ao redor da xícara central. Minimal, premium. Selos de confiança. CTA: 'Substitua sua prateleira de suplementos → Experimente risk-free.'"},
  {id:49, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"winner", title_en:"Winner Var 9: Navy Athletic Tank", title_pt:"Winner Var 9: Regata Esportiva Navy", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso shot, no face. Navy athletic/sport tank top (form-fitting, soaked through across chest and under arms). Hand pulling or gathering fabric, wedding ring visible. Clock 2:15 AM. Warm lamp. Messy bed. Brunette hair, disheveled. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Regata esportiva navy encharcada no peito e axilas. Mão puxando o tecido, aliança visível. Relógio 2:15 AM. Luz quente. Cama desfeita. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does sportswear imply higher intensity of physical exertion vs everyday t-shirt, amplifying the subtext?", execution_pt:"Copy VERBATIM. Teste: Roupa esportiva implica maior intensidade de esforço vs camiseta comum?"},
  {id:50, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"winner", title_en:"Winner Var 10: Drinking Water", title_pt:"Winner Var 10: Bebendo Água", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso shot, no face. Gray heather t-shirt soaked through. Both hands visible: one holds a glass of water at chest height (just finished drinking — slightly tilted, condensated). Wedding ring on one hand. Clock 2:15 AM. Warm lamp. Messy bed. Hair disheveled. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Camiseta cinza encharcada. Ambas as mãos visíveis: uma segura copo d'água (levemente inclinado, condensado). Aliança em uma mão. Relógio 2:15 AM. Luz quente. Cama desfeita. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does post-exertion behavior (drinking water) outperform shirt-pull gesture as primary sweat cue? Action vs. display.", execution_pt:"Copy VERBATIM. Teste: Comportamento pós-esforço (beber água) supera o gesto de puxar a camisa? Ação vs exibição."},
  {id:51, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Native Image: What Cortisol Does to Your Brain (Format A)", title_pt:"ACQ Native Image: O Que o Cortisol Faz ao Seu Cérebro (Format A)", angle_en:"12-year-old son writes school essay about dad's memory loss — teacher circles paragraph, dad finds it (intimate, embarrassing, paternal)", angle_pt:"Filho de 12 anos escreve redação escolar sobre perda de memória do pai — professora circula parágrafo, pai encontra (íntimo, constrangedor, paternal)", hookCopy_en:"\"Dan picked Tommy up from school and noticed the notebook on the kitchen table. He flipped through. He froze when he saw the circled paragraph. Tommy walked in, saw what Dan was reading, and quietly said: 'I didn't mean it bad, Dad.'\"", hookCopy_pt:"\"Dan pegou Tommy na escola e notou o caderno na mesa da cozinha. Folheou. Congelou quando viu o parágrafo circulado. Tommy entrou, viu o que Dan estava lendo, e disse baixinho: 'Eu não quis dizer mal, Pai.'\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): 12-year-old's school notebook open to a handwritten essay titled 'My dad'. One paragraph circled in red pen by the teacher: 'My dad used to know everything. Now he forgets stuff a lot. I have to remind him about my baseball games sometimes.' Single page, intimate. Slightly out of focus background = kitchen table, family kitchen. [Category: Father-Son Disconnect / Generational Shame]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Caderno escolar de criança de 12 anos aberto numa redação à mão intitulada 'Meu pai'. Um parágrafo circulado a caneta vermelha pela professora: 'Meu pai costumava saber tudo. Agora ele esquece muita coisa. Eu tenho que lembrá-lo dos meus jogos de baseball às vezes.' Página única, íntima. Fundo levemente fora de foco = mesa de cozinha, cozinha familiar. [Category: Desconexão Pai-Filho / Vergonha Geracional]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Dan, 49, father of Tommy (12)", speaker_pt:"Primeira pessoa masculina — Dan, 49, pai de Tommy (12)", execution_en:"HEADLINE: 'My 12-year-old wrote about me for a school assignment. The teacher circled one paragraph. I haven't been the same since.' | NARRATIVE ~1800w (intimate/embarrassing per Derick): ESCALATION through Dan: forgets son's baseball game (3 times), Tommy starts reminding Dan of things — generational role inversion. Dan thinks it's just stress. Day he finds the essay = devastating. FAILED SOLUTIONS: 8h sleep → cut coffee → meditation → neurologist ('nothing structural'). MECHANISM: chronic cortisol → BDNF suppressed → hippocampus literally shrinks. Ashwagandha cuts cortisol → BDNF recovers. Lion's Mane → NGF synthesis → neuroplasticity. DISCOVERY: TMC. TRANSFORMATION: Dan remembers the baseball game without reminders. CTA (LEI #4).", execution_pt:"HEADLINE: 'Meu filho de 12 anos escreveu sobre mim numa tarefa escolar. A professora circulou um parágrafo. Não fui o mesmo desde então.' | NARRATIVA ~1800w (íntimo/constrangedor conforme Derick): ESCALATION via Dan: esquece o jogo de baseball do filho (3 vezes), Tommy começa a lembrar Dan das coisas — inversão geracional de papéis. Dan acha que é só estresse. Dia que encontra a redação = devastador. FAILED SOLUTIONS: dormir 8h → cortar café → meditação → neurologista ('nada estrutural'). MECHANISM: cortisol crônico → BDNF suprimido → hipocampo encolhe literalmente. Ashwagandha corta cortisol → BDNF se recupera. Lion's Mane → síntese NGF → neuroplasticidade. DISCOVERY: TMC. TRANSFORMATION: Dan lembra do jogo de baseball sem lembrete. CTA (LEI #4).",v:2},
  {id:52, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Native Image: The 47 Things (Format A)", title_pt:"ACQ Native Image: As 47 Coisas (Format A)", angle_en:"Wife silently writes notes for husband's appointments — he discovers 9 of them taped around the house (intimate, embarrassing, marital role inversion)", angle_pt:"Esposa escreve em silêncio bilhetes pros compromissos do marido — ele descobre 9 deles colados pela casa (íntimo, constrangedor, inversão conjugal de papéis)", hookCopy_en:"\"Chuck found a note on the bathroom mirror reminding him about the doctor's appointment he'd already missed twice. Then he started looking around. There were 9 notes. He counted them. He sat down on the toilet seat and didn't say anything for ten minutes.\"", hookCopy_pt:"\"Chuck encontrou um bilhete no espelho do banheiro lembrando da consulta médica que ele já tinha perdido duas vezes. Aí começou a olhar em volta. Tinha 9 bilhetes. Ele contou. Sentou no vaso e não disse nada por dez minutos.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Yellow post-it taped to bathroom mirror, handwritten in blue marker by Karen (wife): 'TUESDAY: Dr. Patel 10am. Don't forget. Already missed twice.' Slight reflection of Chuck's bare shoulder visible in mirror corner. Single intimate domestic moment. [Category: Marital Role Reversal / Quiet Decline]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Post-it amarelo colado no espelho do banheiro, escrito à mão com hidrocor azul por Karen (esposa): 'TERÇA: Dr. Patel 10h. Não esqueça. Já perdeu duas vezes.' Leve reflexo do ombro nu de Chuck visível no canto do espelho. Único momento íntimo doméstico. [Category: Inversão de Papéis Conjugal / Decadência Silenciosa]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Chuck, 52, owns small landscaping business, married", speaker_pt:"Primeira pessoa masculina — Chuck, 52, dono de pequena empresa de jardinagem, casado", execution_en:"HEADLINE: 'My wife has been writing me notes since I started forgetting my own appointments. Today I found 9 of them taped around the house.' | NARRATIVE ~1800w (intimate/embarrassing per Derick): ESCALATION: Chuck realizes Karen has silently been writing notes for weeks — she stopped asking, started just reminding. Chuck should be leading their life, now she's leading him. Embarrassment of being cared for like a child. FAILED SOLUTIONS: notebook → app → Adderall (off-label) → 'just stressed'. MECHANISM: cortisol → PFC impairment → executive function fails. DISCOVERY: TMC. TRANSFORMATION: the day Chuck writes the FIRST note to Karen ('Honey, dinner at Mario's at 7. I made the reservation.'). CTA (LEI #4).", execution_pt:"HEADLINE: 'Minha esposa tem escrito bilhetes pra mim desde que comecei a esquecer minhas próprias consultas. Hoje encontrei 9 deles colados pela casa.' | NARRATIVA ~1800w (íntimo/constrangedor conforme Derick): ESCALATION: Chuck percebe que Karen vem escrevendo bilhetes em silêncio há semanas — ela parou de perguntar, passou a só lembrar. Chuck deveria estar liderando a vida deles, agora ela está liderando ele. Constrangimento de ser cuidado como criança. FAILED SOLUTIONS: caderno → app → Adderall (off-label) → 'só estressado'. MECHANISM: cortisol → impairment do PFC → função executiva falha. DISCOVERY: TMC. TRANSFORMATION: o dia que Chuck escreve o PRIMEIRO bilhete pra Karen ('Amor, jantar no Mario's às 7. Já reservei.'). CTA (LEI #4).",v:2},
  {id:53, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video SHORT: Ashwagandha-Brain Fog Pipeline", title_pt:"ACQ Vídeo SHORT: Pipeline Ashwagandha-Brain Fog", angle_en:"Inside View visual hook — speaker physically demonstrates dose discrepancy across 3 ashwagandha brands (NO Google Trends, per Derick feedback)", angle_pt:"Inside View visual hook — speaker fisicamente demonstra discrepância de dose entre 3 marcas de ashwagandha (SEM Google Trends, conforme feedback do Derick)", hookCopy_en:"\"You're probably already taking ashwagandha. But you're probably taking it wrong.\"", hookCopy_pt:"\"Você provavelmente já tá tomando ashwagandha. Mas provavelmente tá tomando errado.\"", hookVisual_en:"VISUAL HOOK (Inside View — Derick favorite, voice-criteria V-2): Speaker in his kitchen grabs 3 different ashwagandha bottles (3 brands, different labels). Pours all 3 powders into a clear glass — each has different color/texture (KSM-66 vs root powder vs full-spectrum extract). Stirs to show discrepancy. Then dumps out 3/4 and shows 'this is the actual studied dose'. ZERO Google Trends imagery anywhere.", hookVisual_pt:"VISUAL HOOK (Inside View — favorito Derick, voice-criteria V-2): Speaker na cozinha dele pega 3 potes diferentes de ashwagandha (3 marcas, rótulos diferentes). Despeja os 3 pós num copo transparente — cada um tem cor/textura diferente (KSM-66 vs root powder vs extrato full-spectrum). Mexe pra mostrar discrepância. Aí joga 3/4 fora e mostra 'esta é a dose realmente estudada'. ZERO imagery de Google Trends em nenhum momento.", format_en:"UGC Talking Head (VH-001) with Inside View visual hook | Speaker: Male 48-55, supplement-savvy, kitchen", format_pt:"UGC Talking Head (VH-001) com Inside View visual hook | Speaker: Masculino 48-55, supplement-savvy, cozinha", speaker_en:"Male 48-55, supplement-savvy, in his home kitchen, casual but informed", speaker_pt:"Masculino 48-55, supplement-savvy, na cozinha de casa, casual mas informado", execution_en:"DURATION 75s. Hook B kept (Derick approved). Visual = Inside View (V-2 #5, validated). Speaker shows 3 pots: KSM-66 (real form, expensive) vs root powder (cheap, ineffective) vs full-spectrum (variable). Explains: most labels just say 'ashwagandha root' — that's not the studied form. TMC has KSM-66 at clinical dose. PubMed studies cited (NOT Google Trends per Derick feedback — it's data source for us, not argument for user). CTA with 'they'll'.", execution_pt:"DURAÇÃO 75s. Hook B mantido (Derick aprovou). Visual = Inside View (V-2 #5, validado). Speaker mostra 3 potes: KSM-66 (forma real, cara) vs root powder (barato, ineficaz) vs full-spectrum (variável). Explica: a maioria dos rótulos só diz 'ashwagandha root' — isso não é a forma estudada. TMC tem KSM-66 na dose clínica. Estudos PubMed citados (NÃO Google Trends conforme feedback Derick — é fonte de dado pra gente, não argumento pro usuário). CTA com 'they'll'.",v:2},
  {id:54, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video SHORT: Behavior Enumeration", title_pt:"ACQ Vídeo SHORT: Enumeração de Comportamentos", angle_en:"Approved Hook A executed in Pixar — cute confused brain character literally lost in scenarios from each enumeration item", angle_pt:"Hook A aprovado executado em Pixar — personagem cérebro fofo confuso literalmente perdido nos cenários de cada item da enumeração", hookCopy_en:"\"You forgot where you parked. You reread the same email 3 times. You walked into a room and forgot why. Sound familiar?\"", hookCopy_pt:"\"Você esqueceu onde estacionou. Releu o mesmo e-mail 3 vezes. Entrou num quarto e esqueceu por quê. Conhece?\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Brain personified (Pixar 3D) — tired, dark circles, holding a confused yellow post-it. Cycle through 3 scenes matching enumeration: brain lost in giant parking lot holding 'Where's my car?' sign / brain rereading same email on giant laptop / brain walking through doorway then freezing mid-step. 'Detective Confused' little hat.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Cérebro personificado (Pixar 3D) — cansado, com olheiras, segurando um post-it amarelo confuso. Ciclo por 3 cenas combinando com a enumeração: cérebro perdido num estacionamento gigante segurando placa 'Cadê meu carro?' / cérebro relendo o mesmo e-mail num laptop gigante / cérebro atravessando porta e congelando no meio do passo. Chapeuzinho 'Detetive Confuso'.", format_en:"AI Animated Pixar-Style 3D | Validated internally — Hook A approved by Derick (Auri 9/10 enumeration pattern)", format_pt:"Animação 3D AI Pixar-Style | Validado internamente — Hook A aprovado pelo Derick (padrão enumeração Auri 9/10)", speaker_en:"Brain personified (Pixar 3D character) — exhausted, sweet, confused", speaker_pt:"Cérebro personificado (personagem Pixar 3D) — exausto, fofo, confuso", execution_en:"DURATION 80s. Hook validated (Auri 9/10 enumeration) + Pixar visualizing each enumeration item = elite. Speaker congruente (brain = brain fog), imprevisível (Pixar 3D), efeito WTF. Brain explains: cortisol → BDNF suppression → executive function fails. TMC = ashwagandha (cortisol cut) + Lion's Mane (NGF). Brain visibly recovers in transformation. CTA with 'they'll'.", execution_pt:"DURAÇÃO 80s. Hook validado (enumeração Auri 9/10) + Pixar visualizando cada item da enumeração = elite. Speaker congruente (cérebro = brain fog), imprevisível (Pixar 3D), efeito WTF. Cérebro explica: cortisol → supressão BDNF → função executiva falha. TMC = ashwagandha (corte cortisol) + Lion's Mane (NGF). Cérebro visivelmente se recupera na transformação. CTA com 'they'll'.",v:2},
  {id:55, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video MID: Ashwagandha Pipeline (Expanded)", title_pt:"ACQ Vídeo MID: Pipeline Ashwagandha (Expandido)", angle_en:"Hook C expanded — speaker reacts to disgusting medical timelapse of shrinking hippocampus (NO Google Trends, voice-criteria visual hook)", angle_pt:"Hook C expandido — speaker reage a timelapse médico nojento de hipocampo encolhendo (SEM Google Trends, visual hook voice-criteria)", hookCopy_en:"\"Can ashwagandha actually fix brain fog? I spent 40 hours reading the research. What I found nobody is talking about.\"", hookCopy_pt:"\"Ashwagandha realmente conserta brain fog? Passei 40 horas lendo a pesquisa. O que encontrei ninguém tá falando.\"", hookVisual_en:"VISUAL HOOK (Disgusting POV — Derick favorite, V-2 #6): Speaker reacts to a disgusting medical timelapse video on his laptop — shrinking hippocampus (real medical imaging, NOT CGI per voice-criteria V-5). Pauses, turns to camera with 'WTF I just learned this' expression. Bookshelves visible behind him in home library setup. ZERO Google Trends imagery anywhere.", hookVisual_pt:"VISUAL HOOK (Disgusting POV — favorito Derick, V-2 #6): Speaker reage a um vídeo médico timelapse nojento no laptop dele — hipocampo encolhendo (imagem médica real, NÃO CGI conforme voice-criteria V-5). Pausa, vira pra câmera com expressão 'WTF acabei de aprender isso'. Estantes visíveis atrás dele em setup de biblioteca caseira. ZERO imagery de Google Trends.", format_en:"UGC Talking Head + Disgusting POV insert | Speaker: Male 48-55, glasses, casual, home library | MID 2:20", format_pt:"UGC Talking Head + insert Disgusting POV | Speaker: Masculino 48-55, óculos, casual, biblioteca caseira | MID 2:20", speaker_en:"Male 48-55, wearing glasses, casual, in home library (bookshelves behind)", speaker_pt:"Masculino 48-55, de óculos, casual, em biblioteca caseira (estantes atrás)", execution_en:"DURATION 2:20. Hook C kept (Derick approved + expand). Visual = Disgusting POV (V-2 #6, Derick favorite). Speaker tells personal research journey. Cites PubMed studies (NOT Google Trends per Derick — Google Trends é fonte interna, não argumento). Mechanism: cortisol → BDNF suppression → hippocampus shrinks (LEI #7: Lion's Mane apoia BDNF, never 'deficiency'). Lion's Mane → BDNF/NGF → neurogenesis. TMC has both. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:20. Hook C mantido (Derick aprovou + expandir). Visual = Disgusting POV (V-2 #6, favorito Derick). Speaker conta jornada pessoal de pesquisa. Cita estudos PubMed (NÃO Google Trends conforme Derick — Google Trends é fonte interna, não argumento). Mecanismo: cortisol → supressão BDNF → hipocampo encolhe (LEI #7: Lion's Mane apoia BDNF, nunca 'deficiência'). Lion's Mane → BDNF/NGF → neurogênese. TMC tem ambos. CTA com 'they'll'.",v:2},
  {id:56, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video MID: Behavior Enumeration (Expanded)", title_pt:"ACQ Vídeo MID: Enumeração de Comportamentos (Expandido)", angle_en:"Personified BDNF (the brain's fertilizer) is being killed by cortisol — completely new Pixar concept per Derick rewrite request", angle_pt:"BDNF personificada (o fertilizante do cérebro) está sendo morta pelo cortisol — conceito Pixar completamente novo conforme pedido de rewrite do Derick", hookCopy_en:"\"Hi, I'm BDNF. I'm the reason your brain remembers things. And cortisol has been killing me for 5 years.\"", hookCopy_pt:"\"Oi, eu sou BDNF. Sou o motivo do seu cérebro lembrar das coisas. E o cortisol tá me matando há 5 anos.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): BDNF personified — small ball-shaped 'brain fertilizer' creature, glowing bright when healthy. Now grayed out, weak, coughing. Around her, neurons (Pixar style) wither. Cortisol villain (continuity from AD#9, #10, #30, #32) laughs in background. BDNF reaches a feeble hand toward viewer.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): BDNF personificada — pequena criatura em formato de bolinha 'fertilizante cerebral', brilhando intensamente quando saudável. Agora cinza, fraca, tossindo. Ao redor dela, neurônios (estilo Pixar) definham. Cortisol vilão (continuity dos AD#9, #10, #30, #32) ri ao fundo. BDNF estende mão fraca pro espectador.", format_en:"AI Animated Pixar-Style 3D | Validated internally — entirely new concept per Derick rewrite", format_pt:"Animação 3D AI Pixar-Style | Validado internamente — conceito inteiramente novo conforme rewrite do Derick", speaker_en:"BDNF personified (Pixar 3D character) — small fertilizer-creature, shared universe with Cortisol villain", speaker_pt:"BDNF personificada (personagem Pixar 3D) — pequena criatura-fertilizante, universo compartilhado com Cortisol vilão", execution_en:"DURATION 2:30. Per Derick: ad horroroso, want completely new idea in Pixar. BDNF as character is original, congruente (LEI #7: Lion's Mane APOIA BDNF, never 'deficiência'), imprevisível. Speaker que ninguém esperava ver hoje. BDNF explains: 'I make your brain plastic. Cortisol is poisoning me.' Lion's Mane arrives as Pixar hero (mushroom-shaped) → revives BDNF. Ashwagandha cuts cortisol. TMC = the team. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:30. Conforme Derick: ad horroroso, quer ideia completamente nova em Pixar. BDNF como personagem é original, congruente (LEI #7: Lion's Mane APOIA BDNF, nunca 'deficiência'), imprevisível. Speaker que ninguém esperava ver hoje. BDNF explica: 'Eu deixo seu cérebro plástico. Cortisol tá me envenenando.' Lion's Mane chega como herói Pixar (formato cogumelo) → revive BDNF. Ashwagandha corta cortisol. TMC = a equipe. CTA com 'they'll'.",v:2},
  {id:57, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video MID: Taking Ashwagandha WRONG", title_pt:"ACQ Vídeo MID: Tomando Ashwagandha ERRADO", angle_en:"Hook A kept + execution as nurse recording in his car (VH-004 validated) — speaker imprevisível (not doctor — nurse)", angle_pt:"Hook A mantido + execução como enfermeiro gravando no carro (VH-004 validado) — speaker imprevisível (não doutor — enfermeiro)", hookCopy_en:"\"You're probably taking ashwagandha. And as a nurse, I can tell you — you're probably taking it wrong.\"", hookCopy_pt:"\"Você provavelmente tá tomando ashwagandha. E como enfermeiro, eu te digo — você provavelmente tá tomando errado.\"", hookVisual_en:"VISUAL HOOK (Doctor-in-Car format VH-004 validated, but it's a NURSE not a doctor — imprevisibility): Male nurse 38-45 in scrubs, hospital ID badge visible, drives into the frame, gets into car, closes door, throws his work bag onto passenger seat, exhales heavily, looks at camera (selfie mode mounted on dashboard). Hospital parking lot visible through windshield.", hookVisual_pt:"VISUAL HOOK (Formato Doctor-in-Car VH-004 validado, mas é um ENFERMEIRO não doutor — imprevisibilidade): Enfermeiro masculino 38-45 de scrubs, crachá hospitalar visível, entra no quadro, senta no carro, fecha a porta, joga maleta no banco do passageiro, exala pesadamente, olha pra câmera (selfie mode montado no painel). Estacionamento do hospital visível pelo parabrisa.", format_en:"VH-004 (Nurse-in-Car Recording) | Speaker: Male RN 38-45 in scrubs | NOT too long: 90s per Derick", format_pt:"VH-004 (Gravação Enfermeiro no Carro) | Speaker: Enfermeiro masculino 38-45 de scrubs | NÃO muito longo: 90s conforme Derick", speaker_en:"Male nurse (RN), 38-45, in scrubs, ID badge visible, in driver's seat at hospital parking lot", speaker_pt:"Enfermeiro masculino (RN), 38-45, de scrubs, crachá visível, no banco do motorista no estacionamento do hospital", execution_en:"DURATION 90s (per Derick: not too long). VH-004 validated. Nurse = medical authority + congruence (sees patients) + imprevisibility (not a doctor — who expects a NURSE talking about supplements?). Nurse explains: sees patients with chronic brain fog taking ashwagandha wrong constantly. Most don't use KSM-66 (studied form), dose is always off. 'You need 600mg KSM-66. Most products give you 50mg of root powder.' Recommends TMC. CTA with 'they'll' (specialist pronoun, LEI #4).", execution_pt:"DURAÇÃO 90s (conforme Derick: não muito longo). VH-004 validado. Enfermeiro = autoridade médica + congruência (vê pacientes) + imprevisibilidade (não é doutor — quem espera ENFERMEIRO falando de suplemento?). Enfermeiro explica: vê pacientes com brain fog crônico tomando ashwagandha errado o tempo todo. Maioria não usa KSM-66 (forma estudada), dose sempre fora. 'Precisa de 600mg KSM-66. Maioria dos produtos dá 50mg de root powder.' Recomenda TMC. CTA com 'they'll' (pronome especialista, LEI #4).",v:2},
  {id:58, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"ACQ Video LONG: Taking Ashwagandha WRONG (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Tomando Ashwagandha ERRADO (Mini-VSL)", angle_en:"Hook C kept + Ashwagandha personified as Pixar self-aware ingredient — duration reduced to 2:30 per Derick", angle_pt:"Hook C mantido + Ashwagandha personificada como ingrediente self-aware Pixar — duração reduzida pra 2:30 conforme Derick", hookCopy_en:"\"If you're taking ashwagandha for brain fog, there's a 90% chance you're wasting your money. Hi, I'm ashwagandha. Let me explain.\"", hookCopy_pt:"\"Se você tá tomando ashwagandha pra brain fog, 90% de chance de você tá desperdiçando dinheiro. Oi, eu sou ashwagandha. Deixa eu explicar.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Ashwagandha personified — curious, friendly Indian-style root character with light Indian accent (Pixar humor). Looks at viewer, irritated, hands on hips: \"90% of you are wasting your money on me. Let me explain.\" Surrounded by chaotic shelf of bad ashwagandha products (low-dose, root powder, wrong forms).", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Ashwagandha personificada — personagem raiz curiosa e simpática com leve sotaque indiano (humor Pixar). Olha pro espectador, irritada, mãos na cintura: \"90% de vocês tá desperdiçando dinheiro comigo. Deixa eu explicar.\" Cercada por estante caótica de produtos ruins de ashwagandha (low-dose, root powder, formas erradas).", format_en:"AI Animated Pixar-Style 3D | Speaker: Ashwagandha self-aware character | Duration 2:30 (per Derick — reduced from 5:00)", format_pt:"Animação 3D AI Pixar-Style | Speaker: Ashwagandha personagem self-aware | Duração 2:30 (conforme Derick — reduzido de 5:00)", speaker_en:"Ashwagandha personified (Pixar 3D character) — curious self-aware ingredient with light Indian accent (Pixar humor)", speaker_pt:"Ashwagandha personificada (personagem Pixar 3D) — ingrediente curioso self-aware com leve sotaque indiano (humor Pixar)", execution_en:"DURATION 2:30 (per Derick: between 2-3min, reduced from 5:00). Hook C kept (Derick approved). Speaker IMPREVISÍVEL (ingredient itself talking) + congruente. Self-aware: explains the 4 problems with most ashwagandha products (dosing / timing / form / stacking). 'Most companies use root powder, not KSM-66. That's like drinking dirty water and calling it espresso.' TMC has KSM-66 at clinical dose + Lion's Mane + 10 others. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:30 (conforme Derick: entre 2-3min, reduzido de 5:00). Hook C mantido (Derick aprovou). Speaker IMPREVISÍVEL (ingrediente em si falando) + congruente. Self-aware: explica os 4 problemas com a maioria dos produtos de ashwagandha (dose / timing / forma / stacking). 'Maioria das empresas usa root powder, não KSM-66. É tipo beber água suja e chamar de expresso.' TMC tem KSM-66 na dose clínica + Lion's Mane + 10 outros. CTA com 'they'll'.",v:2},
  {id:59, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"RTG Video: Social Proof / Brain Fog Results", title_pt:"RTG Vídeo: Prova Social / Resultados Brain Fog", angle_en:"VOICE-CRITERIA NA VEIA per Derick — 5 specific behavioral signs + Disgusting POV visual + ingredient reveal", angle_pt:"VOICE-CRITERIA NA VEIA conforme Derick — 5 sinais comportamentais específicos + visual Disgusting POV + revela ingrediente", hookCopy_en:"\"5 signs your brain is shrinking from cortisol — and the one ingredient that's already in your kitchen that stops it.\"", hookCopy_pt:"\"5 sinais de que seu cérebro está encolhendo por causa do cortisol — e o ingrediente que já está na sua cozinha que para isso.\"", hookVisual_en:"VISUAL HOOK (Disgusting POV — Derick favorite V-2 #6, voice-criteria literal): Speaker reacts to side-by-side image: hippocampus of healthy 25yo brain vs hippocampus of 50yo brain with chronic cortisol exposure (real medical imaging timelapse, NOT CGI per V-5). Speaker points at screen with disgust: \"THIS is what's happening to YOUR brain RIGHT NOW.\" Suburban dad type at home kitchen.", hookVisual_pt:"VISUAL HOOK (Disgusting POV — favorito Derick V-2 #6, voice-criteria literal): Speaker reage a imagem side-by-side: hipocampo de cérebro saudável de 25 anos vs hipocampo de cérebro de 50 anos com exposição crônica a cortisol (timelapse de imagem médica real, NÃO CGI conforme V-5). Speaker aponta pra tela com nojo: \"ISSO é o que está acontecendo com SEU cérebro AGORA.\" Tipo pai suburbano na cozinha de casa.", format_en:"UGC Talking Head + Disgusting POV insert | RTG Video | Speaker: Male 50-58, suburban dad, home kitchen | 60s", format_pt:"UGC Talking Head + insert Disgusting POV | RTG Video | Speaker: Masculino 50-58, pai suburbano, cozinha de casa | 60s", speaker_en:"Male 50-58, suburban dad type, in home kitchen — relatable everyman", speaker_pt:"Masculino 50-58, tipo pai suburbano, cozinha de casa — everyman relacionável", execution_en:"DURATION 60s. VOICE-CRITERIA APLICADO LITERAL per Derick: ✅ H-1 point-of-pain ESPECÍFICO (5 behaviors concretos) ✅ H-4 2 arcos (5 signs + ingredient) ✅ V-2 Disgusting POV (Derick favorite) ✅ V-1 Efeito WTF (imagem chocante + 5 sintomas escalando) ✅ V-4 ação primeiro frame (reagindo) ✅ LEI #7 BDNF como mecanismo (não 'deficiência de Lion's Mane'). 5 specific signs: forgetting names mid-conversation / rereading emails / walking into rooms forgot why / losing the word / can't focus past 20 min. Brief mechanism: cortisol → BDNF suppression → hippocampus shrinks. TMC has ashwagandha (cortisol cut) + Lion's Mane (BDNF support). CTA with 'we'll' (brand voice, LEI #4).", execution_pt:"DURAÇÃO 60s. VOICE-CRITERIA APLICADO LITERAL conforme Derick: ✅ H-1 point-of-pain ESPECÍFICO (5 behaviors concretos) ✅ H-4 2 arcos (5 signs + ingrediente) ✅ V-2 Disgusting POV (favorito Derick) ✅ V-1 Efeito WTF (imagem chocante + 5 sintomas escalando) ✅ V-4 ação primeiro frame (reagindo) ✅ LEI #7 BDNF como mecanismo (não 'deficiência de Lion's Mane'). 5 sinais específicos: esquecer nomes no meio da conversa / reler e-mails / entrar em quartos esqueceu por quê / perder a palavra / não foca passa 20 min. Mecanismo breve: cortisol → supressão BDNF → hipocampo encolhe. TMC tem ashwagandha (corte cortisol) + Lion's Mane (suporte BDNF). CTA com 'we'll' (brand voice, LEI #4).",v:2},
  {id:60, day:5, dayLabel_en:"Friday", dayLabel_pt:"Sexta", date:"09/05/26", cluster_en:"C3 Memory & Cognition — Brain Fog", cluster_pt:"C3 Memória & Cognição — Brain Fog", type:"fill", title_en:"RTG Image: Social Proof — 'I got my brain back'", title_pt:"RTG Image: Prova Social — 'Recuperei meu cérebro'", angle_en:"Testimonial social proof — brain fog", angle_pt:"Prova social testemunho — brain fog", hookCopy_en:"\"I got my brain back.\"", hookCopy_pt:"\"Recuperei meu cérebro.\"", hookVisual_en:"Testimonial card with quote, before/after mental clarity metaphor, star rating. Subhead: 'TMC customer, age 54. Brain fog → crystal clear in 6 weeks.'", hookVisual_pt:"Cartão de testemunho com citação, metáfora antes/depois de clareza mental, classificação por estrelas. Subhead: 'Cliente TMC, 54 anos. Brain fog → cristalino em 6 semanas.'", format_en:"Static Image — Social Proof (Retargeting)", format_pt:"Imagem Estática — Prova Social (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Clean testimonial card. Bold quote. TMC bag. Clarity visual (fog lifting). Trust signals. CTA: 'Your brain fog has a fix → Try risk-free.'", execution_pt:"Cartão de testemunho limpo. Citação em negrito. Saco TMC. Visual de clareza (névoa se dissipando). Sinais de confiança. CTA: 'Seu brain fog tem uma cura → Experimente risk-free.'"},

function loadState() { try { const r = localStorage.getItem(STORAGE_KEY); if (!r) return {}; const raw = JSON.parse(r); const migrated = {}; ADS.forEach(ad => { const adV = ad.v || 1; const savedV = (raw[ad.id] && raw[ad.id].v) || 1; if (raw[ad.id] && savedV === adV) migrated[ad.id] = raw[ad.id]; }); return migrated; } catch(e) { return {}; } }
function saveState() { ADS.forEach(ad => { if (state[ad.id]) state[ad.id].v = ad.v || 1; }); localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateStats(); renderDayTabs(); }

  { day: 3, label: "Quarta", date: "07/05", cluster: "C2 Zero Drive" },
  { day: 4, label: "Quinta", date: "08/05", cluster: "C2 No Pump" },
  { day: 5, label: "Sexta", date: "09/05", cluster: "C3 Brain Fog" },
];

function renderDayTabs() {
  const container = document.getElementById('day-tabs');
  container.innerHTML = '';
  DAYS_META.forEach(d => {
    const dayAds = ADS.filter(a => a.day === d.day);
    let approved = 0, rejected = 0, commented = 0;
    dayAds.forEach(ad => { const s = state[ad.id] || {}; if (s.status === 'approved') approved++; if (s.status === 'rejected') rejected++; if (s.comment && s.comment.trim() !== '') commented++; });
    const tab = document.createElement('div');
    tab.className = 'day-tab' + (currentDay === d.day ? ' active' : '');
    tab.innerHTML = `<div class="day-label">${d.label}</div><div class="day-date">B14.${d.day} · ${d.date}</div><div class="day-cluster">${escapeHtml(d.cluster)}</div><div class="day-progress">${approved > 0 ? `<span class="progress-chip chip-approved">&#10003; ${approved}</span>` : ''}${rejected > 0 ? `<span class="progress-chip chip-rejected">&#10007; ${rejected}</span>` : ''}${commented > 0 ? `<span class="progress-chip chip-commented">&#128172; ${commented}</span>` : ''}${approved === 0 && rejected === 0 && commented === 0 ? `<span class="progress-chip" style="opacity:0.5">12 ads</span>` : ''}</div>`;
    tab.addEventListener('click', () => { currentDay = d.day; renderDayTabs(); renderAds(); window.scrollTo({ top: document.querySelector('.container').offsetTop - 80, behavior: 'smooth' }); });
    container.appendChild(tab);
  });
}

function matchesFilter(ad) {
  const s = state[ad.id] || {};
  switch (currentFilter) {
    case 'all': return true;
    case 'pending': return !s.status;
    case 'approved': return s.status === 'approved';
    case 'rejected': return s.status === 'rejected';
    case 'commented': return s.comment && s.comment.trim() !== '';
    case 'winner': return ad.type === 'winner';
  }
  return true;
}

function renderAds() {
  const container = document.getElementById('ads-container');
  container.innerHTML = '';
  const dayAds = ADS.filter(a => a.day === currentDay);
  const meta = DAYS_META.find(d => d.day === currentDay);
  const header = document.createElement('div');
  header.className = 'day-header';
  header.innerHTML = `<h2>${meta.label} — B14.${meta.day}</h2><span class="cluster-tag">${escapeHtml(dayAds[0].cluster_pt)} | ${escapeHtml(dayAds[0].cluster_en)}</span><span class="date">${escapeHtml(dayAds[0].date)}</span>`;
  container.appendChild(header);
  const filtered = dayAds.filter(ad => matchesFilter(ad));
  if (filtered.length === 0) { container.innerHTML += `<div class="empty-state"><p style="font-size:32px;margin-bottom:12px">&#8709;</p><p>Nenhum ad com este filtro pro dia selecionado.</p></div>`; return; }
  filtered.forEach(ad => container.appendChild(renderCard(ad)));
}

function renderCard(ad) {
  const s = state[ad.id] || {};
  const card = document.createElement('div');
  card.className = 'ad-card';
  card.id = `ad-${ad.id}`;
  if (s.status === 'approved') card.classList.add('approved');
  if (s.status === 'rejected') card.classList.add('rejected');
  if (s.comment && s.comment.trim() !== '') card.classList.add('has-comment');
  const typeBadge = ad.type === 'winner' ? '<span class="badge winner">Winner Var</span>' : '<span class="badge fill">Fill</span>';
  card.innerHTML = `
    <div class="ad-header">
      <span class="ad-id">AD #${ad.id}</span>
      <div class="ad-title-pair">
        <span class="ad-title pt">${escapeHtml(ad.title_pt)}</span>
        <span class="ad-title en">${escapeHtml(ad.title_en)}</span>
      </div>
      <div class="ad-badges">${typeBadge}</div>
    </div>
    <div class="lang-headers">
      <div></div>
      <div class="lang-pt">PT-BR (revisão)</div>
      <div class="lang-en">EN (produção)</div>
    </div>
    <div class="field-row">
      <span class="field-label">Ângulo</span>
      <div class="field-cell pt">${escapeHtml(ad.angle_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.angle_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Copy Hook</span>
      <div class="field-cell pt hook">${escapeHtml(ad.hookCopy_pt)}</div>
      <div class="field-cell en hook">${escapeHtml(ad.hookCopy_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Visual Hook</span>
      <div class="field-cell pt">${escapeHtml(ad.hookVisual_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.hookVisual_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Formato</span>
      <div class="field-cell pt">${escapeHtml(ad.format_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.format_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Speaker</span>
      <div class="field-cell pt">${escapeHtml(ad.speaker_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.speaker_en)}</div>
    </div>
    <div class="field-row">
      <span class="field-label">Execução</span>
      <div class="field-cell pt">${escapeHtml(ad.execution_pt)}</div>
      <div class="field-cell en">${escapeHtml(ad.execution_en)}</div>
    </div>
    <div class="action-bar">
      <button class="action-btn approve ${s.status === 'approved' ? 'active' : ''}" data-id="${ad.id}" data-action="approve">&#10003; Aprovar</button>
      <button class="action-btn reject ${s.status === 'rejected' ? 'active' : ''}" data-id="${ad.id}" data-action="reject">&#10007; Rejeitar</button>
      <button class="action-btn comment ${s.comment && s.comment.trim() !== '' ? 'active' : ''}" data-id="${ad.id}" data-action="toggle-comment">&#128172; Comentário${s.comment && s.comment.trim() !== '' ? ' &#10003;' : ''}</button>
      ${s.status ? `<span class="status-indicator ${s.status}">${s.status === 'approved' ? '&#10003; Aprovado' : '&#10007; Rejeitado'}</span>` : ''}
      <button class="action-btn reset" data-id="${ad.id}" data-action="reset">Limpar</button>
    </div>
    <div class="comment-box ${s.comment ? 'visible' : ''}" id="comment-box-${ad.id}">
      <textarea placeholder="O que precisa ser corrigido? Seja específico (hook copy, visual, mecanismo, etc.)" data-id="${ad.id}">${escapeHtml(s.comment || '')}</textarea>
      <div class="comment-hint">Clique fora pra salvar automaticamente.</div>
    </div>`;
  card.querySelectorAll('.action-btn').forEach(btn => btn.addEventListener('click', handleAction));
  const ta = card.querySelector('textarea');
  ta.addEventListener('blur', e => { const id = parseInt(e.target.dataset.id); if (!state[id]) state[id] = {}; const v = e.target.value.trim(); if (v) state[id].comment = v; else delete state[id].comment; saveState(); updateCardVisual(id); });
  return card;
}

function handleAction(e) {
  const id = parseInt(e.currentTarget.dataset.id);
  const action = e.currentTarget.dataset.action;
  if (!state[id]) state[id] = {};
  switch (action) {
    case 'approve': state[id].status = state[id].status === 'approved' ? null : 'approved'; if (!state[id].status) delete state[id].status; break;
    case 'reject': state[id].status = state[id].status === 'rejected' ? null : 'rejected'; if (!state[id].status) delete state[id].status; break;
    case 'toggle-comment': const box = document.getElementById(`comment-box-${id}`); box.classList.toggle('visible'); if (box.classList.contains('visible')) setTimeout(() => box.querySelector('textarea').focus(), 50); return;
    case 'reset': delete state[id]; break;
  }
  saveState(); updateCardVisual(id);
}

function updateCardVisual(id) {
  const card = document.getElementById(`ad-${id}`); if (!card) return;
  const s = state[id] || {};
  card.classList.remove('approved','rejected','has-comment');
  if (s.status === 'approved') card.classList.add('approved');
  if (s.status === 'rejected') card.classList.add('rejected');
  if (s.comment && s.comment.trim() !== '') card.classList.add('has-comment');
  const ab = card.querySelector('[data-action="approve"]'); const rb = card.querySelector('[data-action="reject"]'); const cb = card.querySelector('[data-action="toggle-comment"]');
  ab.classList.toggle('active', s.status === 'approved'); rb.classList.toggle('active', s.status === 'rejected');
  const hc = !!(s.comment && s.comment.trim()); cb.classList.toggle('active', hc); cb.innerHTML = `&#128172; Comentário${hc ? ' &#10003;' : ''}`;
  let si = card.querySelector('.status-indicator');
  if (s.status && !si) { const rst = card.querySelector('[data-action="reset"]'); const sp = document.createElement('span'); sp.className = `status-indicator ${s.status}`; sp.textContent = s.status === 'approved' ? '✓ Aprovado' : '✗ Rejeitado'; rst.before(sp); }
  else if (!s.status && si) si.remove();
  else if (si) { si.className = `status-indicator ${s.status}`; si.textContent = s.status === 'approved' ? '✓ Aprovado' : '✗ Rejeitado'; }
  if (!matchesFilter(ADS.find(a => a.id === id))) setTimeout(() => renderAds(), 150);
}

function updateStats() {
  let approved=0, rejected=0, commented=0, pending=0;
  ADS.forEach(ad => { const s = state[ad.id] || {}; if (s.status === 'approved') approved++; else if (s.status === 'rejected') rejected++; else pending++; if (s.comment && s.comment.trim() !== '') commented++; });
  document.getElementById('count-approved').textContent = approved;
  document.getElementById('count-rejected').textContent = rejected;
  document.getElementById('count-commented').textContent = commented;
  document.getElementById('count-pending').textContent = pending;
  document.getElementById('bottom-summary').textContent = `${approved+rejected} de 60 revisados · ${commented} com comentário`;
  document.getElementById('progress-approved').style.width = (approved/60*100)+'%';
  document.getElementById('progress-rejected').style.width = (rejected/60*100)+'%';
}

document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.dataset.filter; renderAds(); }); });

function generateMarkdown() {
  let approved=[], rejected=[], commented=[], pending=[];
  ADS.forEach(ad => { const s = state[ad.id] || {}; const entry = {ad, state: s}; if (s.status === 'approved') approved.push(entry); else if (s.status === 'rejected') rejected.push(entry); else pending.push(entry); if (s.comment && s.comment.trim() !== '') commented.push(entry); });
  const today = new Date().toISOString().split('T')[0];
  let md = `# Review Feedback — Batch B14 / Week 2026-W19\n**Gerado em:** ${today}\n**Status:** ${approved.length} aprovados · ${rejected.length} rejeitados · ${commented.length} com comentário · ${pending.length} pendentes\n\n---\n\n`;
  if (rejected.length > 0) { md += `## REJEITADOS (${rejected.length})\n\n`; rejected.forEach(({ad, state: s}) => { md += `### AD #${ad.id} — ${ad.title_en}\n**Dia:** ${ad.dayLabel_pt} (B14.${ad.day}) · **Tipo:** ${ad.type}\n**Hook:** ${ad.hookCopy_en}\n`; if (s.comment) md += `**Comentário:** ${s.comment}\n`; md += `\n`; }); md += `---\n\n`; }
  if (commented.filter(e => e.state.status !== 'rejected').length > 0) { md += `## COM COMENTÁRIO (aprovados + pendentes com feedback)\n\n`; commented.filter(e => e.state.status !== 'rejected').forEach(({ad, state: s}) => { md += `### AD #${ad.id} — ${ad.title_en}\n**Dia:** ${ad.dayLabel_pt} · **Status:** ${s.status || 'pendente'}\n**Comentário:** ${s.comment}\n\n`; }); md += `---\n\n`; }
  if (approved.length > 0) { md += `## APROVADOS (${approved.length})\n\n`; approved.forEach(({ad}) => { md += `- AD #${ad.id} — ${ad.title_en} (${ad.dayLabel_pt})\n`; }); md += `\n---\n\n`; }
  if (pending.length > 0) { md += `## PENDENTES (${pending.length})\n\n`; pending.forEach(({ad}) => { md += `- AD #${ad.id} — ${ad.title_en} (${ad.dayLabel_pt})\n`; }); }
  return md;
}

function exportMarkdown() { const md = generateMarkdown(); const blob = new Blob([md], {type:'text/markdown'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `b14-review-feedback-${new Date().toISOString().split('T')[0]}.md`; a.click(); URL.revokeObjectURL(url); }
async function copyFeedback() { try { await navigator.clipboard.writeText(generateMarkdown()); alert('Feedback copiado!'); } catch(e) { alert('Erro ao copiar. Tente exportar .md.'); } }
function resetAll() { if (!confirm('Isso vai apagar TODAS as aprovações, rejeições e comentários. Confirma?')) return; state = {}; localStorage.removeItem(STORAGE_KEY); renderDayTabs(); renderAds(); updateStats(); }

renderDayTabs(); renderAds(); updateStats();
</script>
</body>
</html>
