a energia' → visual de banco de carro limpo → CTA: garantia de 365 dias money-back, 40% off + frete grátis."},
  {id:6, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video SHORT: 3pm Crash = T Problem", title_pt:"ACQ Vídeo SHORT: Crash das 3pm = Problema de T", angle_en:"Afternoon crash reframed as testosterone signal", angle_pt:"Crash da tarde reenquadrado como sinal de testosterona", hookCopy_en:"Hook A: \"Your 3pm crash isn't a caffeine problem. It's a testosterone problem.\" | Hook B: \"You've been blaming caffeine for your afternoon crash. But caffeine was never the problem.\" | Hook C: \"Every man over 40 knows the 3pm wall. Nobody told you it's a hormone problem.\"", hookCopy_pt:"Hook A: \"Seu crash das 3pm não é problema de cafeína. É problema de testosterona.\" | Hook B: \"Você vem culpando a cafeína pelo seu crash da tarde. Mas a cafeína nunca foi o problema.\" | Hook C: \"Todo homem acima de 40 conhece a parede das 3pm. Ninguém te disse que é problema hormonal.\"", hookVisual_en:"Man at desk, clock at 3pm, pushes away coffee cup with frustration", hookVisual_pt:"Homem na mesa, relógio nas 3pm, empurra a xícara de café com frustração", format_en:"UGC Talking Head (VH-001) | 75s (~240 words)", format_pt:"UGC Talking Head (VH-001) | 75s (~240 palavras)", speaker_en:"Male 45-55, office/professional type, direct-to-camera", speaker_pt:"Homem 45-55, tipo escritório/profissional, direto pra câmera", execution_en:"Open on speaker at desk. Quick mechanism: cortisol peaks afternoon → suppresses T production → energy drops. 'Coffee just masks it.' TMC: ashwagandha reduces cortisol, tongkat ali supports T. Problem → mechanism → solution → CTA.", execution_pt:"Abre com o speaker na mesa. Mecanismo rápido: cortisol picos à tarde → suprime produção de T → energia cai. 'Café só mascara.' TMC: ashwagandha reduz cortisol, tongkat ali suporta T. Problema → mecanismo → solução → CTA."},
  {id:7, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video MID: Borrowing vs Making (Full Story)", title_pt:"ACQ Vídeo MID: Pegando Emprestada vs Fazendo (História Completa)", angle_en:"Full 'borrowing vs making' framework — character-driven narrative", angle_pt:"Framework completo 'pegando emprestada vs fazendo' — narrativa dirigida por personagem", hookCopy_en:"Hook A: \"This is what happens when a '3 energy drinks a day' guy finally fixes the real problem.\" | Hook B: \"He was 42, ran an HVAC crew, and couldn't get through a morning without 3 Monsters.\" | Hook C: \"Energy drinks, pre-workout, caffeine pills — every one of them is borrowing.\"", hookCopy_pt:"Hook A: \"Isto é o que acontece quando um cara de '3 energéticos por dia' finalmente conserta o problema real.\" | Hook B: \"Ele tinha 42 anos, comandava uma equipe de HVAC, e não conseguia passar uma manhã sem 3 Monsters.\" | Hook C: \"Energéticos, pré-treino, comprimidos de cafeína — cada um deles é emprestar.\"", hookVisual_en:"Hand opening truck door → floor littered with energy drink cans → boots stepping over them", hookVisual_pt:"Mão abrindo a porta da caminhonete → chão coberto de latas de energético → botas passando por cima delas", format_en:"VO-over-B-roll montage (TEST) | 2:20 (~448 words)", format_pt:"Montagem VO-sobre-B-roll (TESTE) | 2:20 (~448 palavras)", speaker_en:"Male VO 35-45, storytelling narrator", speaker_pt:"VO masculino 35-45, narrador de história", execution_en:"Full narrative arc: Character intro → Problem deepens (crashes, wife notices) → Discovery (TMC) → Week-by-week transformation → Visual payoff (clean seat) → Mechanism (ashwa + tongkat + shilajit) → CTA: 365-day money-back guarantee, 40% off + free shipping.", execution_pt:"Arco narrativo completo: Intro do personagem → Problema se aprofunda (crashes, esposa nota) → Descoberta (TMC) → Transformação semana-a-semana → Payoff visual (banco limpo) → Mecanismo (ashwa + tongkat + shilajit) → CTA: 365 dias money-back guarantee, 40% off + free shipping."},
  {id:8, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video MID: 3pm Crash (Personal Story)", title_pt:"ACQ Vídeo MID: Crash das 3pm (História Pessoal)", angle_en:"Afternoon crash as diagnostic — your body is telling you something", angle_pt:"Crash da tarde como diagnóstico — seu corpo está te dizendo algo", hookCopy_en:"Hook A: \"I used to drink 4 cups of coffee before 3pm. My wife thought I was addicted. Turns out my testosterone was tanking.\" | Hook B: \"Your 3pm crash isn't a caffeine problem. And your doctor probably won't tell you what it really is.\" | Hook C: \"The truth about why men over 45 hit a wall every afternoon.\"", hookCopy_pt:"Hook A: \"Eu tomava 4 xícaras de café antes das 3pm. Minha esposa achava que eu era viciado. Acontece que minha testosterona estava despencando.\" | Hook B: \"Seu crash das 3pm não é problema de cafeína. E seu médico provavelmente não vai te dizer o que realmente é.\" | Hook C: \"A verdade sobre por que homens acima de 45 batem numa parede toda tarde.\"", hookVisual_en:"Speaker holding coffee mug, gestures frustration, kitchen counter background", hookVisual_pt:"Speaker segurando caneca de café, gesticula frustração, balcão da cozinha ao fundo", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 50-58, relatable everyman, casual home setting", speaker_pt:"Homem 50-58, everyman relatável, ambiente casual de casa", execution_en:"Personal story: used to be high-energy, 40s hit, needed more caffeine. Doctor said 'normal.' Learned T-decline → cortisol → crash cycle. TMC: ashwagandha + tongkat. Week 2: first day without afternoon coffee. Week 4: energy steady all day. CTA: 365-day money-back guarantee.", execution_pt:"História pessoal: era cheio de energia, chegou aos 40, precisou de mais cafeína. Médico disse 'normal.' Aprendeu declínio de T → cortisol → ciclo do crash. TMC: ashwagandha + tongkat. Semana 2: primeiro dia sem café da tarde. Semana 4: energia estável o dia todo. CTA: garantia de 365 dias (money-back)."},
  {id:9, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video MID: Cross-Cluster Cortisol Bridge", title_pt:"ACQ Vídeo MID: Ponte de Cortisol Cross-Cluster", angle_en:"Cortisol personified as Pixar-style villain hijacking testosterone — cross-cluster bridge via animated character", angle_pt:"Cortisol personificado como vilão Pixar sequestrando a testosterona — bridge cross-cluster via personagem animado", hookCopy_en:"\"Hi, I'm cortisol — and at 3pm, I'm the reason your energy disappears.\"", hookCopy_pt:"\"Oi, eu sou seu cortisol — e às 3 da tarde, eu sou o motivo da sua energia desaparecer.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Cortisol villain — yellow/oxidized viscous creature — appears inside the body (interior view, Inside Out style), grabbing testosterone molecules and tossing them aside one by one. Turns to camera with malicious grin.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Cortisol vilão — criatura amarela/oxidada e viscosa — aparece dentro do corpo (vista interna, estilo Inside Out), pegando moléculas de testosterona e jogando uma por uma de lado. Vira pra câmera com sorriso malicioso.", format_en:"AI Animated Pixar-Style 3D | Validated internally (TMCAD72, TMCAD01 B9 HK1)", format_pt:"Animação 3D AI Pixar-Style | Validado internamente (TMCAD72, TMCAD01 B9 HK1)", speaker_en:"Cortisol personified (Pixar 3D character) — yellow oxidized villain that lives inside the body", speaker_pt:"Cortisol personificado (personagem Pixar 3D) — vilão amarelo oxidado que vive dentro do corpo", execution_en:"DURATION 75s. Structure: \"Hi, I'm your [X]\" validated in Pixar ads. Cortisol (animated villain) introduces himself directly to viewer, explains how he steals testosterone every afternoon. Brief mechanism (cortisol suppresses T → energy crash). TMC reveal: ashwagandha shuts down cortisol. CTA with 'they'll' (animated mascot pronoun, LEI #4). Speaker IMPREVISÍVEL + congruente (cortisol = energy crash). Point-of-pain SPECIFIC (3pm energy disappears).", execution_pt:"DURAÇÃO 75s. Estrutura: \"Oi, eu sou seu [X]\" validada em ads Pixar. Cortisol (vilão animado) se apresenta diretamente ao espectador, explica como ele rouba testosterona toda tarde. Mecanismo breve (cortisol suprime T → energy crash). Revela TMC: ashwagandha desliga cortisol. CTA com 'they'll' (mascote animado, LEI #4). Speaker IMPREVISÍVEL + congruente (cortisol = energy crash). Point-of-pain ESPECÍFICO (3pm energia some).",v:2},
  {id:10, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"ACQ Video LONG: Cortisol Bridge (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Ponte de Cortisol (Mini-VSL)", angle_en:"Cortisol Pixar villain runs the body's control room — Mini-VSL exploring 3 symptoms (energy/recovery/focus) sabotaged by 1 hormone", angle_pt:"Cortisol vilão Pixar comanda a sala de controle do corpo — Mini-VSL explorando 3 sintomas (energia/recovery/foco) sabotados por 1 hormônio", hookCopy_en:"\"Meet cortisol. He's been running your body since you turned 40. And he's terrible at it.\"", hookCopy_pt:"\"Conheça o cortisol. Ele tá comandando seu corpo desde que você fez 40. E ele é péssimo nisso.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Cortisol villain enters the body's control room (central brain HQ, Inside Out style). Begins sabotaging 3 control panels simultaneously: ENERGY / RECOVERY / FOCUS. Other hormones (T, dopamine) tied up in corners.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Cortisol vilão entra na sala de controle do corpo (HQ central no cérebro, estilo Inside Out). Começa a sabotar 3 painéis simultaneamente: ENERGIA / RECOVERY / FOCO. Outros hormônios (T, dopamina) amarrados nos cantos.", format_en:"AI Animated Pixar-Style 3D — Mini-VSL narrative (3:30)", format_pt:"Animação 3D AI Pixar-Style — Mini-VSL narrativo (3:30)", speaker_en:"Cortisol villain (continuity from AD#9) — now in Mini-VSL storytelling format with full cast (T, Dopamine, BDNF visible as bound prisoners)", speaker_pt:"Cortisol vilão (continuity do AD#9) — agora em formato Mini-VSL storytelling com elenco completo (T, Dopamina, BDNF visíveis como prisioneiros)", execution_en:"DURATION 3:30 (Pixar works best <4min). Cross-cluster bridge (1 hormone, 3 symptoms) executed via epic Pixar storytelling. Cortisol narrates his takeover with sarcastic humor (Mr. Burns vibe). Shows cascading damage to energy/recovery/focus. Then heroes arrive: ashwagandha (suit-wearing fixer), tongkat ali, Lion's Mane. They liberate the control room. CTA with 'they'll' (mascot, LEI #4). Entertainment-first DR. Cumpre 'ad inteiro nativamente curioso'.", execution_pt:"DURAÇÃO 3:30 (Pixar funciona melhor <4min). Bridge cross-cluster (1 hormônio, 3 sintomas) executado via storytelling Pixar épico. Cortisol narra sua tomada de poder com humor sarcástico (vibe Mr. Burns). Mostra dano em cascata em energia/recovery/foco. Heróis chegam: ashwagandha (consertador de terno), tongkat ali, Lion's Mane. Eles libertam a sala de controle. CTA com 'they'll' (mascote, LEI #4).",v:2},
  {id:11, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"RTG Video: 'TMC is just fancy coffee' Objection", title_pt:"RTG Vídeo: Objeção 'TMC é só café chique'", angle_en:"Address #1 skeptic objection: 'it's just coffee with vitamins'", angle_pt:"Aborda objeção cética #1: 'é só café com vitaminas'", hookCopy_en:"HOOK A: \"I thought TMC was just overpriced coffee. I was wrong. Here's what's actually happening in your body.\"  ||  HOOK B (UPDATED per Derick): \"Think TMC is just coffee? Then explain why my testosterone went up 218 points in 38 days.\"  ||  HOOK C: \"My buddy called TMC 'expensive dirt water.' 3 months later, he ordered his own.\"", hookCopy_pt:"HOOK A: \"Achei que TMC era só café caro. Estava errado. Aqui está o que realmente acontece no seu corpo.\"  ||  HOOK B (ATUALIZADO por Derick): \"Acha que TMC é só café? Então explica por que minha testosterona subiu 218 pontos em 38 dias.\"  ||  HOOK C: \"Meu amigo chamou TMC de 'água com terra cara.' 3 meses depois, ele pediu o dele.\"", hookVisual_en:"Speaker holding TMC bag in one hand, regular coffee in other, shrugging", hookVisual_pt:"Speaker segurando saco de TMC numa mão, café comum na outra, dando de ombros", format_en:"UGC Talking Head | RTG | 90s (~288 words)", format_pt:"UGC Talking Head | RTG | 90s (~288 palavras)", speaker_en:"Male 45-55, skeptic-turned-believer archetype", speaker_pt:"Homem 45-55, arquétipo cético-virou-crente", execution_en:"DURATION 90s. Hook B updated per Derick feedback: 200→218 (broken numbers more credible) + 90 days→38 days (faster result more shocking). Speaker admits skepticism, explains: 'Regular coffee = caffeine. TMC = ashwagandha (cortisol reduction), tongkat ali (T-support), Lion's Mane (brain function) — clinical doses.' Brief mechanism per ingredient. Personal result (218 pts in 38 days). CTA with 'they'll'.", execution_pt:"DURAÇÃO 90s. Hook B atualizado conforme feedback do Derick: 200→218 (números quebrados mais críveis) + 90 dias→38 dias (resultado mais rápido = mais chocante). Speaker admite ceticismo, explica: 'Café comum = cafeína. TMC = ashwagandha (redução cortisol), tongkat ali (suporte T), Lion's Mane (função cerebral) — doses clínicas.' Mecanismo breve por ingrediente. Resultado pessoal (218 pts em 38 dias). CTA com 'they'll'.",v:2},
  {id:12, day:1, dayLabel_en:"Monday", dayLabel_pt:"Segunda", date:"05/05/26", cluster_en:"C2 Muscles & Gym — Energy Crash", cluster_pt:"C2 Músculos & Academia — Crash de Energia", type:"fill", title_en:"RTG Image: Bold Static — 'More Than Just Coffee'", title_pt:"RTG Image: Static em Negrito — 'Mais que Só Café'", angle_en:"Retargeting static — product as hero", angle_pt:"Static de retargeting — produto como herói", hookCopy_en:"\"Your morning coffee should do more than wake you up.\"", hookCopy_pt:"\"Seu café da manhã deveria fazer mais do que te acordar.\"", hookVisual_en:"TMC bag/cup hero shot, clean minimal background, bold sans-serif type. Subhead: '12 clinically-studied ingredients. One cup. Every morning.'", hookVisual_pt:"Hero shot do saco/xícara TMC, fundo limpo minimalista, tipografia sans-serif em negrito. Subhead: '12 ingredientes clinicamente estudados. Uma xícara. Toda manhã.'", format_en:"Static Image — Bold Static (Retargeting)", format_pt:"Imagem Estática — Static em Negrito (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Bold typography-driven. No faces. Product as hero. Warm tones. Single key benefit: 'More than just caffeine.' CTA: 'Try risk-free for 90 days →'", execution_pt:"Dirigido por tipografia em negrito. Sem rostos. Produto como herói. Tons quentes. Único benefício-chave: 'Mais do que só cafeína.' CTA: 'Experimente risk-free por 365 dias money-back →'"},
  {id:13, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"winner", title_en:"Winner Var 3: Soaked Hair Close-Up", title_pt:"Winner Var 3: Close-Up do Cabelo Encharcado", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Camera angle raised — frame from shoulders to just below jaw, no full face. Dark brunette hair soaked and matted, strands clinging to neck and collarbone. Hair is primary sweat evidence. Same gray t-shirt at bottom. One hand near neck, wedding ring visible. Clock 2:15 AM. Warm lamp. Raw iPhone aesthetic.", hookVisual_pt:"Ângulo levantado — enquadramento dos ombros até abaixo do queixo, sem rosto completo. Cabelo castanho encharcado e grudado no pescoço e clavícula. Cabelo é a evidência principal de suor. Camiseta cinza visível na parte inferior. Aliança visível. Relógio 2:15 AM.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does hair-as-sweat-evidence (implies total-body exertion) feel more intense than shirt-as-sweat-evidence?", execution_pt:"Copy VERBATIM. Teste: Cabelo como evidência de suor (implica esforço corporal total) parece mais intenso que a camisa?"},
  {id:14, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"winner", title_en:"Winner Var 4: Blonde Hair", title_pt:"Winner Var 4: Cabelo Loiro", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition exactly — torso shot, no face. Gray heather t-shirt soaked through, hand pulling shirt outward, wedding ring visible. Same bedroom, clock 2:15 AM, messy bed. Only change: blonde hair — disheveled, slightly damp at roots and ends, falling past shoulder. 4:5 vertical.", hookVisual_pt:"Mesma composição exata — torso sem rosto. Camiseta cinza encharcada, mão puxando, aliança visível. Mesmo quarto, relógio 2:15 AM, cama desfeita. Única mudança: cabelo loiro — despenteado, levemente úmido. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does blonde hair expand demographic resonance vs brunette baseline?", execution_pt:"Copy VERBATIM. Teste: Cabelo loiro expande o alcance demográfico vs castanho?"},
  {id:15, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Native Image: The Missing Half (Format A)", title_pt:"ACQ Native Image: A Metade Que Falta (Format A)", angle_en:"Men spend thousands on protein but ignore the hormonal environment protein synthesis actually requires", angle_pt:"Homens gastam milhares em proteína mas ignoram o ambiente hormonal que a síntese proteica requer", hookCopy_en:"\"Tom had been lifting since he was 24. At 44, everything was the same — except nothing worked anymore.\"\"If you're only using whey protein after workouts, you're missing half the recovery equation.\" | Hook B: \"Your protein shake is doing half the job. Here's what covers the other half.\" | Hook C: \"The fastest way to recover after 40? It's not more protein. It's not more rest.\"", hookCopy_pt:"\"Tom levantava peso desde os 24 anos. Aos 44, tudo era igual — exceto que nada funcionava mais.\"\"Se você só usa whey protein depois dos treinos, você está perdendo metade da equação de recuperação.\" | Hook B: \"Seu shake de proteína está fazendo metade do trabalho. Aqui está o que cobre a outra metade.\" | Hook C: \"A forma mais rápida de se recuperar depois dos 40? Não é mais proteína. Não é mais descanso.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Flexed forearm — completely flat. No vascularity, no definition, skin smooth. The absence of what should be there IS the shock. Gym bathroom / fluorescent light. [Category: Body Shame]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Antebraço flexionado — completamente plano. Sem veias, sem definição, pele lisa. A ausência do que deveria estar lá É o choque. [Category: Body Shame]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Tom, 44, serious lifter 20 years", speaker_pt:"Primeira pessoa masculina — Tom, 44, levantador sério por 20 anos", execution_en:"HEADLINE: 'I spent $3,000 on supplements last year. My body still looked the same. Then I read why.' | NARRATIVE ~1800w: Tom on scale, same number third week. ESCALATION: DOMS lasting 4 days, gains reversing. FAILED SOLUTIONS: more protein → massage gun → ice baths → sports doctor. MECHANISM: recovery requires cortisol clearance; T decline slows clearance → inflammation stays → muscles can't repair. Whey gives building blocks; without hormonal environment, construction crew never shows up. Ashwagandha clears cortisol. DISCOVERY: TMC. TRANSFORMATION. CTA.", execution_pt:"HEADLINE: 'Gastei $3.000 em suplementos no ano passado. Meu corpo ainda estava igual. Aí eu descobri o porquê.' | NARRATIVA ~1800w. MECHANISM: recuperação exige clearance de cortisol; declínio de T desacelera clearance → inflamação persiste. Ashwagandha limpa cortisol. DISCOVERY: TMC. CTA."},
  {id:16, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Native Image: The Sunday Morning Test (Format A)", title_pt:"ACQ Native Image: O Teste da Manhã de Domingo (Format A)", angle_en:"How a man moves the morning after a workout tells you more about his hormones than any bloodwork", angle_pt:"Como um homem se move na manhã depois do treino diz mais sobre seus hormônios do que qualquer exame", hookCopy_en:"\"He groaned getting off the couch on a Sunday and my 14-year-old looked at me and said, 'Is Dad okay?'\"\"Working out in your 40s hits different. Not because you're weaker — because your hormones changed.\" | Hook B: \"Testosterone is lower. Recovery is slower. But nobody's connecting the dots for men over 40.\" | Hook C: \"Your 25-year-old body recovered overnight. After 45, you need THIS to recover at all.\"", hookCopy_pt:"\"Ele gemeu saindo do sofá num domingo e meu filho de 14 anos me olhou e disse: 'Pai tá bem?'\"\"Treinar nos 40 bate diferente. Não porque você está mais fraco — porque seus hormônios mudaram.\" | Hook B: \"Testosterona está mais baixa. Recuperação está mais lenta. Mas ninguém está conectando os pontos pra homens acima de 40.\" | Hook C: \"Seu corpo de 25 anos se recuperava da noite pro dia. Depois dos 45, você precisa DISSO pra se recuperar de qualquer jeito.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Pillow with small handwritten note on it: 'Heat pad is on the nightstand.' Wife left this before he woke up. Single element, intimate domestic detail, warm bedroom lighting. [Category: Emotional Devastation]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Travesseiro com bilhete escrito à mão: 'Bolsa de calor na mesinha.' Esposa deixou antes dele acordar. Elemento único, detalhe doméstico íntimo. [Category: Emotional Devastation]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Wife/partner POV — Sarah, 44 — story 100% about HIM (LEI #10)", speaker_pt:"POV esposa — Sarah, 44 — história 100% sobre ELE (LEI #10)", execution_en:"HEADLINE: 'He used to beat me to the gym on Saturday mornings. Now he lies in bed until 11 on Sundays.' | NARRATIVE ~1800w (wife POV, story 100% about Steve): Steve, 47, weekend warrior. ESCALATION through Sarah's observation: groans louder, workouts shorter, couch becomes recovery room. MECHANISM via Sarah's research: T drops 1%/yr → cortisol clearance slows → DOMS chronic. DISCOVERY: TMC. TRANSFORMATION told through Steve's behavior changes. BRIDGE to wives watching this happen. CTA.", execution_pt:"HEADLINE: 'Ele costumava chegar antes de mim na academia no sábado. Agora fica na cama até as 11 do domingo.' | NARRATIVA ~1800w (POV esposa, história 100% sobre Steve): MECHANISM: T cai 1%/ano → clearance de cortisol desacelera → DOMS crônica. DISCOVERY: TMC. CTA."},
  {id:17, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video SHORT: Missing Half Recovery", title_pt:"ACQ Vídeo SHORT: Faltando Metade da Recuperação", angle_en:"Protein alone isn't enough — recovery needs hormonal support", angle_pt:"Proteína sozinha não é suficiente — recuperação precisa de suporte hormonal", hookCopy_en:"Hook A: \"If you're only using whey after workouts, you're missing half the recovery equation.\" | Hook B: \"I spent $200/month on protein and still couldn't recover. Turns out protein was only half the answer.\" | Hook C: \"What NEVER to take after a workout if you're over 40 — and what to take instead.\"", hookCopy_pt:"Hook A: \"Se você só usa whey depois dos treinos, está perdendo metade da equação de recuperação.\" | Hook B: \"Gastei $200/mês em proteína e ainda não conseguia me recuperar. Acontece que proteína era só metade da resposta.\" | Hook C: \"O que NUNCA tomar depois do treino se você tem mais de 40 — e o que tomar no lugar.\"", hookVisual_en:"Speaker holding protein shaker in one hand, shaking head", hookVisual_pt:"Speaker segurando coqueteleira de proteína numa mão, balançando a cabeça", format_en:"UGC Talking Head (VH-001) | 75s (~240 words)", format_pt:"UGC Talking Head (VH-001) | 75s (~240 palavras)", speaker_en:"Male 44-52, gym regular, post-workout setting", speaker_pt:"Homem 44-52, frequentador de academia, ambiente pós-treino", execution_en:"Speaker in gym clothes. 'Protein only handles muscle protein synthesis.' Recovery also needs cortisol reduction + T support. 'That's the half you're missing.' TMC: ashwa + tongkat. 'Recovery cut in half.' CTA: 365-day money-back guarantee.", execution_pt:"Speaker em roupa de academia. 'Proteína só cuida da síntese proteica muscular.' Recuperação também precisa de redução de cortisol + suporte de T. 'Essa é a metade que você está perdendo.' TMC: ashwa + tongkat. 'Recuperação cortada pela metade.' CTA: 365 dias money-back."},
  {id:18, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video SHORT: Recovery = Hormones", title_pt:"ACQ Vídeo SHORT: Recuperação = Hormônios", angle_en:"Personified bicep (Pixar-style 3D) confronts viewer about hormonal neglect — recovery cluster mapped to character", angle_pt:"Bíceps personificado (Pixar 3D) confronta espectador sobre negligência hormonal — cluster recovery mapeado para personagem", hookCopy_en:"\"Hi, I'm your muscle — and I'm exhausted because you've been ignoring my hormones for 10 years.\"", hookCopy_pt:"\"Oi, eu sou seu músculo — e eu tô exausto porque você tem ignorado meus hormônios há 10 anos.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Animated bicep — sweaty, slumped, defeated — tries to lift a tiny dumbbell, fails, throws it on the ground and yells: \"I QUIT!\" Camera dolly out reveals other muscle groups equally fatigued.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Bíceps animado — suado, encurvado, derrotado — tenta levantar uma haltera minúscula, falha, joga no chão e grita: \"EU DESISTO!\" Câmera dolly out revela outros grupos musculares igualmente fatigados.", format_en:"AI Animated Pixar-Style 3D | Validated internally", format_pt:"Animação 3D AI Pixar-Style | Validado internamente", speaker_en:"Bicep personified (Pixar 3D character) — exhausted, sweaty, defeated muscle", speaker_pt:"Bíceps personificado (personagem Pixar 3D) — músculo exausto, suado, derrotado", execution_en:"DURATION 75s. Structure: \"Hi, I'm your [X]\" validated. Bicep explains via metaphor: he needs hormones (T, less cortisol) to do his job. Without them, recovery fails, soreness lingers. TMC fixes the hormonal foundation. Speaker IMPREVISÍVEL + congruente (muscle = recovery cluster). Point-of-pain SPECIFIC (can't recover after workouts). CTA with 'they'll'.", execution_pt:"DURAÇÃO 75s. Estrutura: \"Oi, eu sou seu [X]\" validada. Bíceps explica via metáfora: ele precisa de hormônios (T, menos cortisol) pra fazer o trabalho. Sem eles, recovery falha, soreness persiste. TMC consegue a foundation hormonal. Speaker IMPREVISÍVEL + congruente (músculo = cluster recovery). Point-of-pain ESPECÍFICO (não consegue recuperar). CTA com 'they'll'.",v:2},
  {id:19, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video MID: Missing Half Recovery (Expanded)", title_pt:"ACQ Vídeo MID: Faltando Metade da Recuperação (Expandido)", angle_en:"Deep dive on the protein-only trap", angle_pt:"Mergulho profundo na armadilha do só-proteína", hookCopy_en:"Hook A: \"I was spending $200 a month on supplements and STILL couldn't recover from my workouts.\" | Hook B: \"If you're only using whey protein after a workout, you might be missing half the recovery equation.\" | Hook C: \"The secret to recovering like you're 25 again isn't more protein. It's not more rest either.\"", hookCopy_pt:"Hook A: \"Eu estava gastando $200 por mês em suplementos e AINDA não conseguia me recuperar dos meus treinos.\" | Hook B: \"Se você só usa whey protein depois do treino, talvez esteja perdendo metade da equação de recuperação.\" | Hook C: \"O segredo pra se recuperar como se tivesse 25 de novo não é mais proteína. Também não é mais descanso.\"", hookVisual_en:"Speaker at kitchen counter with protein powder, TMC, and empty supplement bottles", hookVisual_pt:"Speaker no balcão da cozinha com pó de proteína, TMC e potes de suplemento vazios", format_en:"UGC Talking Head + gym B-roll | 2:15 (~432 words)", format_pt:"UGC Talking Head + B-roll de academia | 2:15 (~432 palavras)", speaker_en:"Male 44-52, experienced lifter", speaker_pt:"Homem 44-52, lifter experiente", execution_en:"Story: serious lifter, always took protein. After 40, recovery 3-4 days instead of 1. Added BCAAs, glutamine, creatine — still sore. Discovery: hormonal environment. TMC: ashwa + tongkat + shilajit. Week-by-week. CTA: 365-day money-back guarantee.", execution_pt:"História: lifter sério, sempre tomou proteína. Depois dos 40, recuperação 3-4 dias em vez de 1. Adicionou BCAAs, glutamina, creatina — ainda dolorido. Descoberta: ambiente hormonal. TMC: ashwa + tongkat + shilajit. Semana-a-semana. CTA: 365 dias money-back."},
  {id:20, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video MID: Recovery = Hormones (Expanded)", title_pt:"ACQ Vídeo MID: Recuperação = Hormônios (Expandido)", angle_en:"Extended personal story — from always sore to recovered", angle_pt:"História pessoal estendida — de sempre dolorido a recuperado", hookCopy_en:"Hook A: \"My body used to bounce back. Now a Monday workout ruins my whole week.\" | Hook B: \"Stop training like you're 25. Not because you can't handle it — because your hormones can't.\" | Hook C: \"Are you making these 3 recovery mistakes after 40?\"", hookCopy_pt:"Hook A: \"Meu corpo costumava se recuperar. Agora um treino de segunda destrói minha semana inteira.\" | Hook B: \"Pare de treinar como se tivesse 25. Não porque você não dá conta — porque seus hormônios não dão.\" | Hook C: \"Você está cometendo esses 3 erros de recuperação depois dos 40?\"", hookVisual_en:"Speaker stretching stiffly, visible discomfort, speaks to camera", hookVisual_pt:"Speaker se alongando duro, desconforto visível, fala pra câmera", format_en:"UGC Talking Head (VH-001) | 2:30 (~480 words)", format_pt:"UGC Talking Head (VH-001) | 2:30 (~480 palavras)", speaker_en:"Male 52-60, weekend warrior, backyard/garage gym", speaker_pt:"Homem 52-60, weekend warrior, academia de quintal/garagem", execution_en:"Story: 'I'm 54. Been lifting since 20s.' Progressive decline. Doctor said 'slow down.' Research: T drops, cortisol rises. TMC. Week 3: trained Monday, not sore Wednesday. Week 6: back to 4 days. CTA: 365-day money-back guarantee.", execution_pt:"História: 'Tenho 54. Levanto desde os 20.' Declínio progressivo. Médico disse 'desacelera.' Pesquisa: T cai, cortisol sobe. TMC. Semana 3: treinou segunda, não dolorido quarta. Semana 6: voltou pra 4 dias. CTA: 365 dias money-back."},
  {id:21, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video MID: Your Body Changed After 40", title_pt:"ACQ Vídeo MID: Seu Corpo Mudou Depois dos 40", angle_en:"Personified testosterone shrinks LIVE during hook — visualizing T-decline as character transformation", angle_pt:"Testosterona personificada encolhe AO VIVO durante o hook — visualizando T-decline como transformação de personagem", hookCopy_en:"\"Hi, I'm your testosterone — and here's why I've been getting weaker since you turned 40.\"", hookCopy_pt:"\"Oi, eu sou sua testosterona — e aqui está o motivo de eu estar ficando mais fraca desde que você fez 40.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Testosterone personified — starts \"young and powerful\" (25yo version, muscular, glowing). During first 3s of hook, T VISIBLY SHRINKS in front of viewer, losing brightness, muscle, height. Ends as smaller weaker version (45yo). Transformation = imprevisibility extreme + WTF effect.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Testosterona personificada — começa \"jovem e poderosa\" (versão 25 anos, musculosa, brilhante). Durante primeiros 3s do hook, T ENCOLHE VISIVELMENTE na frente do espectador, perdendo brilho, músculo, altura. Termina como versão menor e mais fraca (45 anos). Transformação = imprevisibilidade extrema + efeito WTF.", format_en:"AI Animated Pixar-Style 3D | Validated internally", format_pt:"Animação 3D AI Pixar-Style | Validado internamente", speaker_en:"Testosterone personified (Pixar 3D character) — undergoes live shrinking transformation in hook", speaker_pt:"Testosterona personificada (personagem Pixar 3D) — sofre transformação encolhendo ao vivo no hook", execution_en:"DURATION 2:40. Structure: \"Hi, I'm your [X]\" + visual transformation. T explains the cascade: SHBG traps her, cortisol suppresses production, dopamine signaling weakens. \"You're not weaker. I am.\" TMC ingredients (boron frees SHBG, tongkat ali boosts production, ashwagandha cuts cortisol) appear as Pixar heroes restoring T to glory at end. Speaker IMPREVISÍVEL (T encolhendo ao vivo), congruente (cluster muscle/recovery). CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:40. Estrutura: \"Oi, eu sou sua [X]\" + transformação visual. T explica a cascata: SHBG aprisiona ela, cortisol suprime produção, sinalização dopamina enfraquece. \"Você não está mais fraco. Eu estou.\" Ingredientes TMC (boron libera SHBG, tongkat ali aumenta produção, ashwagandha corta cortisol) aparecem como heróis Pixar restaurando T à glória no final. Speaker IMPREVISÍVEL (T encolhendo ao vivo), congruente. CTA com 'they'll'.",v:2},
  {id:22, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"ACQ Video LONG: Your Body Changed (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Seu Corpo Mudou (Mini-VSL)", angle_en:"Mini-VSL Pixar — fallen kingdom inside the body, T as overthrown ruler, ingredients as resistance heroes", angle_pt:"Mini-VSL Pixar — reino caído dentro do corpo, T como governante destronado, ingredientes como heróis da resistência", hookCopy_en:"\"There used to be a kingdom inside you that ran your gym. It's been overthrown. Let me tell you the story.\"", hookCopy_pt:"\"Existia um reino dentro de você que comandava sua academia. Ele foi derrubado. Deixa eu te contar a história.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Epic city inside the body. T as deposed mayor, exiled. Cortisol invades wearing villain crown. SHBG locks T in a castle. Dopamine cries in a corner. Aerial shot of decaying kingdom = stylized Pixar opening worthy of feature film.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Cidade épica dentro do corpo. T como prefeito deposto, exilado. Cortisol invade usando coroa de vilão. SHBG tranca T num castelo. Dopamina chora num canto. Plano aéreo do reino em decadência = abertura Pixar estilizada digna de longa-metragem.", format_en:"AI Animated Pixar-Style 3D — Mini-VSL épico (3:30)", format_pt:"Animação 3D AI Pixar-Style — Mini-VSL épico (3:30)", speaker_en:"Cast of personified hormones (Pixar 3D) — T (fallen hero), Cortisol (villain), SHBG (jailer), Boron (liberator), Tongkat Ali (general), Ashwagandha (advisor)", speaker_pt:"Elenco de hormônios personificados (Pixar 3D) — T (herói caído), Cortisol (vilão), SHBG (carcereiro), Boron (libertador), Tongkat Ali (general), Ashwagandha (conselheira)", execution_en:"DURATION 3:30. Mini-VSL épico Pixar. Mechanism (T-decline cascade) becomes visual narrative. Resistance forms — TMC ingredients arrive as heroes one by one, retake the kingdom. Pure entertainment + education. Cumpre voice-criteria 'ad inteiramente curioso'. CTA with 'they'll'.", execution_pt:"DURAÇÃO 3:30. Mini-VSL Pixar épico. Mecanismo (cascata T-decline) vira narrativa visual. Resistência se forma — ingredientes TMC chegam como heróis um por um, retomam o reino. Entretenimento puro + educação. Cumpre voice-criteria 'ad inteiramente curioso'. CTA com 'they'll'.",v:2},
  {id:23, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"RTG Video: Ashwagandha + Recovery Deep Dive", title_pt:"RTG Vídeo: Mergulho Profundo Ashwagandha + Recuperação", angle_en:"Why ashwagandha is the #1 recovery ingredient most men are missing", angle_pt:"Por que ashwagandha é o ingrediente de recuperação #1 que a maioria dos homens está perdendo", hookCopy_en:"Hook A: \"You've heard of ashwagandha. But you probably don't know what it does for muscle recovery.\" | Hook B: \"Ashwagandha searches are up 300% this month. Here's why men over 40 should care.\" | Hook C: \"The ingredient behind TMC's recovery formula just went viral.\"", hookCopy_pt:"Hook A: \"Você já ouviu falar de ashwagandha. Mas provavelmente não sabe o que ela faz pra recuperação muscular.\" | Hook B: \"Buscas por ashwagandha estão 300% pra cima esse mês. Aqui está por que homens acima de 40 deveriam se importar.\" | Hook C: \"O ingrediente por trás da fórmula de recuperação do TMC acabou de viralizar.\"", hookVisual_en:"Speaker holding ashwagandha root/powder, or showing supplement label", hookVisual_pt:"Speaker segurando raiz/pó de ashwagandha, ou mostrando rótulo de suplemento", format_en:"Educational UGC | RTG | 90s (~288 words)", format_pt:"UGC Educacional | RTG | 90s (~288 palavras)", speaker_en:"Male 45-55, knowledgeable fitness enthusiast", speaker_pt:"Homem 45-55, entusiasta de fitness com conhecimento", execution_en:"Educational tone for warm audience. Ashwagandha mechanism: cortisol ↓ 30%, inflammation ↓, T support. TMC's specific dose. CTA: '365-day money-back guarantee removes the risk.'", execution_pt:"Tom educacional pra audiência morna. Mecanismo da ashwagandha: cortisol ↓ 30%, inflamação ↓, suporte a T. Dose específica do TMC. CTA: 'Garantia de 365 dias money-back remove o risco.'"},
  {id:24, day:2, dayLabel_en:"Tuesday", dayLabel_pt:"Terça", date:"06/05/26", cluster_en:"C2 Muscles & Gym — Always Sore", cluster_pt:"C2 Músculos & Academia — Sempre Dolorido", type:"fill", title_en:"RTG Image: Social Proof — 'I recover like I'm 30 again'", title_pt:"RTG Image: Prova Social — 'Eu me recupero como se tivesse 30 de novo'", angle_en:"Reframe protein-only post-workout behavior — without T to drive synthesis, expensive whey is wasted", angle_pt:"Reframe do comportamento de só usar whey pós-treino — sem T pra dirigir síntese, whey caro é desperdiçado", hookCopy_en:"HEADLINE: \"Stop wasting your post-workout protein.\" SUBHEAD: \"Without testosterone to drive synthesis, your $200/month whey is useless. TMC fixes the foundation.\"", hookCopy_pt:"HEADLINE: \"Pare de desperdiçar sua proteína pós-treino.\" SUBHEAD: \"Sem testosterona pra dirigir a síntese, seu whey de $200/mês é inútil. TMC consegue a foundation.\"", hookVisual_en:"VISUAL: Split-screen 4:5 vertical Meta — LEFT: giant whey tub with \"$ thrown away\" overlay, semi-faded. RIGHT: TMC cup centered, vivid colors, \"$2/day\" callout. Clean modern design. Trust badges (guarantee, ingredient count) at bottom.", hookVisual_pt:"VISUAL: Split-screen 4:5 vertical Meta — ESQUERDA: balde de whey gigante com overlay \"$ jogado fora\", semi-desbotado. DIREITA: cup TMC centralizada, cores vivas, callout \"$2/dia\". Design clean moderno. Selos de confiança no rodapé.", format_en:"RTG Static Image (4:5 vertical, Format B — Bold/Comparison) | Skill: long-form-native-ad-writer or design", format_pt:"RTG Static Image (4:5 vertical, Format B — Bold/Comparação) | Skill: long-form-native-ad-writer ou design", speaker_en:"N/A (static image, brand-direct copy)", speaker_pt:"N/A (imagem estática, copy direto da marca)", execution_en:"DURATION N/A. Per Derick feedback: hit on 'using protein after workout instead of TMC'. Cost-pain hook (Life Cykel pattern, validated). Reframe: protein alone incomplete without hormonal foundation. CTA: 'TMC fixes what whey alone can't → 365-day risk-free, 40% off + free shipping' (LEI #4).", execution_pt:"DURAÇÃO N/A. Conforme feedback do Derick: bate na ideia de 'usar proteína depois do treino, ao invés de TMC'. Cost-pain hook (Life Cykel pattern, validado). Reframe: proteína sozinha incompleta sem foundation hormonal. CTA: 'TMC conserta o que whey sozinho não pode → 365-day risk-free, 40% off + frete grátis' (LEI #4).",v:2},
  {id:25, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"winner", title_en:"Winner Var 5: Black T-Shirt", title_pt:"Winner Var 5: Camiseta Preta", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso shot, no face. Black cotton t-shirt, soaked. Sweat visible as slightly darker wet patches (subtle on black — less high-contrast). Hand pulling shirt outward, wedding ring visible. Clock 2:15 AM. Warm lamp. Messy bed. Brunette hair. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Camiseta preta encharcada. Suor visível como manchas mais escuras (sutil no preto). Mão puxando, aliança visível. Relógio 2:15 AM. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does lower sweat visibility on black create more curiosity vs obvious sweat on gray? Mystery vs. shock.", execution_pt:"Copy VERBATIM. Teste: Menor visibilidade do suor no preto cria mais curiosidade vs suor óbvio no cinza? Mistério vs choque."},
  {id:26, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"winner", title_en:"Winner Var 6: Oversized Men's T-Shirt", title_pt:"Winner Var 6: Camiseta Masculina Oversized", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition — torso, no face. Woman wearing an oversized men's t-shirt — clearly not hers (neckline droops off one shoulder, sleeves hang past elbow). Soaked through. Hand gathers oversized fabric and pulls outward, wedding ring visible. Clock 2:15 AM. Warm lamp. Messy bed. 4:5 vertical.", hookVisual_pt:"Mesma composição — torso sem rosto. Mulher com camiseta masculina oversized — claramente não é dela (gola tombando, mangas longas). Encharcada. Mão junta o tecido e puxa, aliança visível. Relógio 2:15 AM. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does 'wearing his shirt' (post-intimacy ownership cue) create stronger emotional signal than wearing her own shirt?", execution_pt:"Copy VERBATIM. Teste: 'Vestindo a camisa dele' (sinal de posse pós-intimidade) gera sinal emocional mais forte?"},
  {id:27, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Native Image: The One Variable (Format A)", title_pt:"ACQ Native Image: A Variável Única (Format A)", angle_en:"Married man's college jersey doesn't fit anymore — anniversary failure as personal/intimate/embarrassing identity collapse", angle_pt:"Camiseta da faculdade do homem casado não cabe mais — falha de aniversário como colapso de identidade pessoal/íntimo/constrangedor", hookCopy_en:"\"Mark put on his college jersey, looked in the mirror, and saw a man he didn't recognize. His 19-year-old self stared back from the framed team photo on the wall. Then he took the jersey off and put it back in the box.\"", hookCopy_pt:"\"Mark vestiu sua camiseta da faculdade, se olhou no espelho, e viu um homem que não reconhecia. Seu eu de 19 anos retribuía o olhar da foto emoldurada do time na parede. Então ele tirou a camiseta e colocou de volta na caixa.\"", hookVisual_en:"SHOCK CREATIVE (Phone selfie): Mark in front of bedroom mirror, wearing his old college lacrosse jersey (XL, name on back, 1996) — clearly tight across chest and stomach, marking man boobs and gut. Embarrassed posture, head slightly down. Framed team photo from 1996 visible on wall behind him. Single intimate element. [Category: Shame / Identity Loss]", hookVisual_pt:"SHOCK CREATIVE (Selfie de celular): Mark em frente ao espelho do quarto, vestindo sua antiga camiseta de lacrosse da faculdade (XL, nome nas costas, 1996) — claramente apertada no peito e barriga, marcando man boobs e gut. Postura envergonhada, cabeça levemente baixa. Foto emoldurada do time de 1996 visível na parede atrás. Elemento único íntimo. [Category: Shame / Identity Loss]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Mark, 47, ex-college lacrosse player, 25 years married", speaker_pt:"Primeira pessoa masculina — Mark, 47, ex-jogador de lacrosse da faculdade, 25 anos casado", execution_en:"HEADLINE: 'I tried on my old college lacrosse jersey to surprise my wife on our anniversary. I haven't worn it since.' | NARRATIVE ~1800w (intimate/embarrassing tone per Derick feedback): Open in bedroom, anniversary morning. ESCALATION: Mark hides old photos from iPhone; stops going to pool with kids; buys looser shirts; one day, finds the jersey in box from college. Anniversary plan: surprise her in it. Mirror moment is devastating. FAILED SOLUTIONS: military diet → 5x/week gym → expensive personal trainer → doctor said 'scale back at your age'. MECHANISM REVEAL: T dropped from 700+ to 340; without T, body doesn't respond no matter the effort. DISCOVERY: TMC. TRANSFORMATION: the day the jersey fits again. BRIDGE TO READER. CTA (LEI #4).", execution_pt:"HEADLINE: 'Vesti a camiseta da minha faculdade pra surpreender minha esposa no aniversário. Não vesti de novo desde então.' | NARRATIVA ~1800w (tom íntimo/constrangedor conforme feedback do Derick): Abre no quarto, manhã do aniversário. ESCALATION: Mark esconde fotos antigas do iPhone; para de ir na piscina com filhos; compra camisas mais largas; um dia, encontra a camiseta na caixa da faculdade. Plano: surpreendê-la com ela. Momento do espelho é devastador. FAILED SOLUTIONS: dieta militar → academia 5x → personal caro → médico falou 'maneirar nessa idade'. MECHANISM: T caiu de 700+ pra 340; sem T, corpo não responde por mais que tente. DISCOVERY: TMC. TRANSFORMATION: o dia que a jersey volta a servir. CTA (LEI #4).",v:2},
  {id:28, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Native Image: The Program That Stopped Working (Format A)", title_pt:"ACQ Native Image: O Programa Que Parou de Funcionar (Format A)", angle_en:"Wife stopped inviting husband to work out — silent intimate failure of marriage as drive collapses", angle_pt:"Esposa parou de convidar o marido pra treinar — falha silenciosa íntima do casamento conforme drive colapsa", hookCopy_en:"\"Tom's wife had been leaving notes on the fridge for 6 months. He'd find one, mean to go, and at 7 PM he'd be on the couch. The notes stopped showing up. That's when he panicked.\"", hookCopy_pt:"\"A esposa de Tom tinha deixado bilhetes na geladeira por 6 meses. Ele achava um, prometia ir, e às 7 da noite estava no sofá. Os bilhetes pararam de aparecer. Foi aí que ele entrou em pânico.\"", hookVisual_en:"SHOCK CREATIVE (Phone photo): Refrigerator door — single yellow post-it handwritten by Jen: 'Tom — I made a cardio class reservation for us at 7. I'd love it if you came. Love, J.' Post-it dated 3 weeks ago (subtle date corner). Below it, 4 other older similar notes in a faded layered stack — all ignored. Single intimate element. [Category: Marital Disconnect]", hookVisual_pt:"SHOCK CREATIVE (Foto celular): Porta da geladeira — único post-it amarelo escrito à mão por Jen: 'Tom — Reservei aula de cardio pra gente às 7. Adoraria se você fosse. Amor, J.' Post-it datado de 3 semanas atrás (canto sutil). Abaixo, 4 outros bilhetes similares antigos numa pilha desbotada — todos ignorados. Elemento único íntimo. [Category: Desconexão Conjugal]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Tom, 46, married 18 years to Jen", speaker_pt:"Primeira pessoa masculina — Tom, 46, casado há 18 anos com Jen", execution_en:"HEADLINE: 'My wife stopped inviting me to work out together. That's when I realized something was actually broken.' | NARRATIVE ~1800w (intimate/embarrassing per Derick): ESCALATION: Tom doesn't notice Jen has been silently quitting on him for months. He believed it was 'laziness' / 'busy season'. The day notes stop = panic moment. FAILED SOLUTIONS: motivation videos → cold showers → 'discipline' apps → therapy. MECHANISM: T-decline → dopamine reduction → behavioral anhedonia. Not character flaw, biochemistry. DISCOVERY: TMC. TRANSFORMATION: the day Tom writes the FIRST note to Jen. CTA (LEI #4).", execution_pt:"HEADLINE: 'Minha esposa parou de me convidar pra treinar. Foi aí que entendi que algo estava realmente quebrado.' | NARRATIVA ~1800w (íntimo/constrangedor conforme Derick): ESCALATION: Tom não percebe que Jen tem desistido em silêncio dele há meses. Ele acreditava que era 'preguiça' / 'temporada cheia'. Dia que os bilhetes param = momento de pânico. FAILED SOLUTIONS: vídeos de motivação → banho gelado → apps de 'disciplina' → terapia. MECHANISM: T-decline → dopamina reduzida → anhedonia comportamental. Não é caráter, é bioquímica. DISCOVERY: TMC. TRANSFORMATION: o dia que Tom escreve o PRIMEIRO bilhete pra Jen. CTA (LEI #4).",v:2},
  {id:29, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video SHORT: Guessing vs Measuring", title_pt:"ACQ Vídeo SHORT: Chutando vs Medindo", angle_en:"Personified dopamine narrates lost gym drive — brain chemistry visualized as Pixar character", angle_pt:"Dopamina personificada narra perda de drive na academia — química cerebral visualizada como personagem Pixar", hookCopy_en:"\"Hi, I'm your dopamine. And I haven't been able to get you to the gym in months.\"", hookCopy_pt:"\"Oi, eu sou sua dopamina. E eu não consegui te levar pra academia há meses.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Dopamine character — small bright cute creature in a brain-control office — frantically tries to flip the 'GYM MOTIVATION' switch on the wall. Switch is broken. Cortisol villain holds the power cable, smirking from corner.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Personagem dopamina — pequena criatura brilhante e fofa num escritório de controle do cérebro — tenta freneticamente acionar o switch 'MOTIVAÇÃO ACADEMIA' na parede. Switch está quebrado. Cortisol vilão segura o cabo de força, sorrindo de canto.", format_en:"AI Animated Pixar-Style 3D | Validated internally", format_pt:"Animação 3D AI Pixar-Style | Validado internamente", speaker_en:"Dopamine personified (Pixar 3D character) — exhausted, sweet little creature trying to do her job against Cortisol's sabotage", speaker_pt:"Dopamina personificada (personagem Pixar 3D) — pequena criatura doce e exausta tentando fazer seu trabalho contra a sabotagem do Cortisol", execution_en:"DURATION 75s. Structure: \"Hi, I'm your [X]\". Dopamine explains what she does (drives motivation/reward) and why she can't anymore (cortisol blocking, T support gone). TMC reveal: ashwagandha cuts cortisol → dopamine signaling restored. Speaker IMPREVISÍVEL + congruente (drive = dopamine). Point-of-pain SPECIFIC (can't get to the gym in months). CTA with 'they'll'.", execution_pt:"DURAÇÃO 75s. Estrutura: \"Oi, eu sou sua [X]\". Dopamina explica o que ela faz (gera motivação/reward) e por que não consegue mais (cortisol bloqueando, suporte T sumido). TMC revela: ashwagandha corta cortisol → sinalização dopamina restaurada. Speaker IMPREVISÍVEL + congruente. Point-of-pain ESPECÍFICO (não consegue ir na academia há meses). CTA com 'they'll'.",v:2},
  {id:30, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video SHORT: Mistakes Enumeration", title_pt:"ACQ Vídeo SHORT: Enumeração de Erros", angle_en:"War in your brain — Dopamine (victim) vs Cortisol (villain) battle for gym motivation", angle_pt:"Guerra no seu cérebro — Dopamina (vítima) vs Cortisol (vilão) lutando pela motivação na academia", hookCopy_en:"\"There's a war happening in your brain every time you try to go to the gym. And right now, the wrong side is winning.\"", hookCopy_pt:"\"Tem uma guerra rolando no seu cérebro toda vez que você tenta ir na academia. E agora, o lado errado tá ganhando.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Direct dialogue battle inside the brain. Cortisol (fat arrogant villain) shouts: \"STAY ON THE COUCH!\" Dopamine (small, hopeful) whispers: \"Please go...\" Visual = lopsided fight. Cortisol wins easily.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Batalha de diálogo direto dentro do cérebro. Cortisol (vilão gordo arrogante) grita: \"FIQUE NO SOFÁ!\" Dopamina (pequena, esperançosa) sussurra: \"Por favor vai...\" Visual = luta desigual. Cortisol vence fácil.", format_en:"AI Animated Pixar-Style 3D | Validated internally", format_pt:"Animação 3D AI Pixar-Style | Validado internamente", speaker_en:"Dopamine + Cortisol (Pixar 3D characters) in shared universe with AD#9, #10, #29", speaker_pt:"Dopamina + Cortisol (personagens Pixar 3D) em universo compartilhado com AD#9, #10, #29", execution_en:"DURATION 75s. \"War in your brain\" hook opens multiple loops + Pixar visualizes brilliantly. Mechanism: cortisol blocks dopamine reward circuits → motivation circuits literally rewired. TMC ingredients enter as reinforcements for dopamine's side. Cumulative storytelling continuity (shared universe). CTA with 'they'll'.", execution_pt:"DURAÇÃO 75s. Hook \"guerra no seu cérebro\" abre múltiplos loops + Pixar visualiza brilhantemente. Mecanismo: cortisol bloqueia circuitos de reward de dopamina → circuitos de motivação literalmente recableados. Ingredientes TMC entram como reforços do lado da dopamina. Continuidade de storytelling cumulativa (universo compartilhado). CTA com 'they'll'.",v:2},
  {id:31, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video MID: Guessing vs Measuring (Expanded)", title_pt:"ACQ Vídeo MID: Chutando vs Medindo (Expandido)", angle_en:"Dopamine narrates nostalgic flashbacks of glory days — emotional Pixar storytelling about lost gym love", angle_pt:"Dopamina narra flashbacks nostálgicos dos tempos de glória — storytelling Pixar emocional sobre amor perdido pela academia", hookCopy_en:"\"Hi, I'm your dopamine. Let me show you why you used to LOVE the gym — and what changed.\"", hookCopy_pt:"\"Oi, eu sou sua dopamina. Deixa eu te mostrar por que você AMAVA a academia — e o que mudou.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Dopamine character opens an animated photo album. Pages flip — Pixar-style flashbacks of viewer at 28, energized at the gym, post-workout euphoria, social high-fives. Then album smokes/darkens at recent pages. Live transformation visualizes T-decline + cortisol takeover.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Personagem Dopamina abre álbum de fotos animado. Páginas viram — flashbacks Pixar do espectador aos 28, energizado na academia, euforia pós-treino, high-fives sociais. Aí álbum fumega/escurece nas páginas recentes. Transformação ao vivo visualiza T-decline + tomada de poder do cortisol.", format_en:"AI Animated Pixar-Style 3D — MID format with flashback storytelling (2:20)", format_pt:"Animação 3D AI Pixar-Style — formato MID com storytelling de flashback (2:20)", speaker_en:"Dopamine personified (Pixar 3D, continuity from AD#29-30)", speaker_pt:"Dopamina personificada (Pixar 3D, continuity dos AD#29-30)", execution_en:"DURATION 2:20. Maintains personification, expands to Pixar storytelling with flashbacks. Mechanism via emotion: dopamine wasn't always weak — she had support (T, low cortisol). TMC restores her support team. Speaker continuity creates serialized entertainment. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:20. Mantém personificação, expande pra storytelling Pixar com flashbacks. Mecanismo via emoção: dopamina nem sempre foi fraca — ela tinha suporte (T, cortisol baixo). TMC restaura sua equipe de suporte. Continuidade de speaker cria entretenimento serializado. CTA com 'they'll'.",v:2},
  {id:32, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video MID: Mistakes Enumeration (Expanded)", title_pt:"ACQ Vídeo MID: Enumeração de Erros (Expandido)", angle_en:"Cortisol villain confesses his crimes with sarcastic humor — entertainment-first DR via Pixar villain monologue", angle_pt:"Cortisol vilão confessa suas crimes com humor sarcástico — DR entretenimento-first via monólogo vilão Pixar", hookCopy_en:"\"Hi, I'm cortisol. And I've been wrecking your gym game for 5 years now. Let me show you how.\"", hookCopy_pt:"\"Oi, eu sou seu cortisol. E venho destruindo sua academia há 5 anos agora. Deixa eu te mostrar como.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Cortisol villain seated in malicious armchair (Mr. Burns vibe), fingers steepled, smiling. Behind him, a giant evidence wall covered in Polaroids of viewer's failed gym attempts, missed sessions, lost workouts. \"I've been busy.\"", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Cortisol vilão sentado em poltrona maliciosa (vibe Mr. Burns), dedos cruzados, sorrindo. Atrás dele, uma parede gigante de evidências coberta de Polaroids das tentativas falhas de academia, sessões perdidas, treinos perdidos. \"Tô ocupado.\"", format_en:"AI Animated Pixar-Style 3D — Pixar villain monologue (2:30)", format_pt:"Animação 3D AI Pixar-Style — monólogo vilão Pixar (2:30)", speaker_en:"Cortisol villain (Pixar 3D, continuity from AD#9, #10, #30)", speaker_pt:"Cortisol vilão (Pixar 3D, continuity dos AD#9, #10, #30)", execution_en:"DURATION 2:30. Pixar villain narrating his own crimes = pure entertainment with embedded education. Cortisol explains step-by-step how he sabotages: blocks T production, hijacks dopamine, fragments sleep, drains adrenals. TMC heroes (ashwagandha primary) arrive at end and put him in handcuffs. Imprevisível, congruente, multi-loop. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:30. Vilão Pixar narrando suas próprias crimes = entretenimento puro com educação embutida. Cortisol explica passo a passo como ele sabota: bloqueia produção T, sequestra dopamina, fragmenta sono, drena adrenais. Heróis TMC (ashwagandha principal) chegam no final e o algemam. Imprevisível, congruente, multi-loop. CTA com 'they'll'.",v:2},
  {id:33, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video MID: Not Laziness — Hormones", title_pt:"ACQ Vídeo MID: Não é Preguiça — Hormônios", angle_en:"Personified testosterone admits responsibility for lost gym drive — 'Not your fault — it's mine' character reframe", angle_pt:"Testosterona personificada assume responsabilidade pelo drive perdido — reframe de personagem 'Não é sua culpa — é minha'", hookCopy_en:"\"Hi, I'm your testosterone. And I haven't gotten you to the gym since 2023. It's not your fault — it's mine.\"", hookCopy_pt:"\"Oi, eu sou sua testosterona. E eu não te levei pra academia desde 2023. Não é sua culpa — é minha.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): T character — defeated, smaller version — sitting on a Pixar-style couch inside the body, holding a tiny beer. Dusty gym clothes piled in corner. Empty gym bag with cobwebs. T addresses viewer with apologetic expression.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Personagem T — derrotada, versão menor — sentada num sofá estilo Pixar dentro do corpo, segurando uma cervejinha. Roupa de academia empoeirada num canto. Mochila vazia com teias de aranha. T se dirige ao espectador com expressão de desculpas.", format_en:"AI Animated Pixar-Style 3D — testosterone character monologue (2:40)", format_pt:"Animação 3D AI Pixar-Style — monólogo personagem testosterona (2:40)", speaker_en:"Testosterone personified (Pixar 3D, continuity from AD#21, #22)", speaker_pt:"Testosterona personificada (Pixar 3D, continuity dos AD#21, #22)", execution_en:"DURATION 2:40. \"Not your fault\" reframe = exact 'Not Laziness' angle, but executed by personified T. Removes shame, opens emotional door. T explains the cascade in first-person: cortisol pressure, SHBG trap, dopamine breakdown. TMC = T's support team coming back. CTA with 'they'll'.", execution_pt:"DURAÇÃO 2:40. Reframe \"Não é sua culpa\" = exato ângulo 'Não é Preguiça', mas executado pela T personificada. Remove vergonha, abre porta emocional. T explica a cascata em primeira pessoa: pressão do cortisol, armadilha SHBG, breakdown da dopamina. TMC = equipe de suporte da T voltando. CTA com 'they'll'.",v:2},
  {id:34, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"ACQ Video LONG: Not Laziness (Mini-VSL)", title_pt:"ACQ Vídeo LONG: Não é Preguiça (Mini-VSL)", angle_en:"Mini-VSL Pixar epic — kingdom inside the body under siege, T as deposed mayor, ingredients as resistance heroes", angle_pt:"Mini-VSL Pixar épico — reino dentro do corpo sob cerco, T como prefeito deposto, ingredientes como heróis da resistência", hookCopy_en:"\"There's a city inside you that runs your gym game. It's been under siege since you turned 40. Let me tell you who's fighting for you.\"", hookCopy_pt:"\"Tem uma cidade dentro de você que comanda sua academia. Ela está sob cerco desde que você fez 40. Deixa eu te contar quem tá lutando por você.\"", hookVisual_en:"VISUAL HOOK (AI Animated 3D Pixar-Style): Aerial shot of an epic stylized city inside the body. T as deposed mayor, exiled. Cortisol governs from a black tower. SHBG locks T in a castle. Dopamine cries on a balcony. Resistance forms in shadows. Boron + L-Citrulline arrive as caped heroes through city gates.", hookVisual_pt:"VISUAL HOOK (Animação 3D AI Pixar-Style): Plano aéreo de uma cidade épica estilizada dentro do corpo. T como prefeito deposto, exilado. Cortisol governa de uma torre negra. SHBG tranca T num castelo. Dopamina chora numa varanda. Resistência se forma nas sombras. Boron + L-Citrulina chegam como heróis com capas pelas portas da cidade.", format_en:"AI Animated Pixar-Style 3D — Mini-VSL épico (3:30)", format_pt:"Animação 3D AI Pixar-Style — Mini-VSL épico (3:30)", speaker_en:"Cast Pixar 3D — T (fallen hero), Cortisol (villain), SHBG (jailer), Boron (liberator), L-Citrulline (messenger), Vein (executor) — narrator: omniscient", speaker_pt:"Cast Pixar 3D — T (herói caído), Cortisol (vilão), SHBG (carcereiro), Boron (libertador), L-Citrulina (mensageiro), Veia (executora) — narrador: onisciente", execution_en:"DURATION 3:30 (not 4:30 — Pixar works better <4min). Storytelling épico Pixar — entretenimento puro. Mechanism virou narrativa de guerra. Resistance forms, ingredients arrive as heroes one by one, retake the city. End: T crowned again. TMC presented as the alliance that brings them all together. CTA with 'they'll'. Cumpre voice-criteria 'ad inteiro nativamente curioso'.", execution_pt:"DURAÇÃO 3:30 (não 4:30 — Pixar funciona melhor <4min). Storytelling épico Pixar — entretenimento puro. Mecanismo virou narrativa de guerra. Resistência se forma, ingredientes chegam como heróis um por um, retomam a cidade. Fim: T coroada de novo. TMC apresentado como a aliança que os une. CTA com 'they'll'. Cumpre voice-criteria 'ad inteiro nativamente curioso'.",v:2},
  {id:35, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"RTG Video: Guarantee / Risk Reversal", title_pt:"RTG Vídeo: Garantia / Reversão de Risco", angle_en:"Cost-pain reframe — viewer realizes monthly supplement spend is wasted without cortisol/T foundation", angle_pt:"Reframe cost-pain — espectador percebe que gasto mensal em suplementos é desperdiçado sem foundation cortisol/T", hookCopy_en:"\"Last month I threw away $140 of supplements. Then I bought one cup of coffee instead.\"", hookCopy_pt:"\"Mês passado eu joguei $140 de suplementos no lixo. Aí comprei uma cup de café no lugar.\"", hookVisual_en:"VISUAL HOOK (VO-over-B-roll, validated Mars Men 'Borrowing' format): Hand grabbing supplement bottles from kitchen shelf and dropping each one into a trash can. Dollar overlays appear: Lion's Mane $30, Tongkat Ali $40, Ashwagandha $50, Boron $20. Total: $140/month. Cut to TMC bag landing on counter triumphantly.", hookVisual_pt:"VISUAL HOOK (VO-sobre-B-roll, formato validado Mars Men 'Borrowing'): Mão pegando potes de suplementos da prateleira da cozinha e jogando um por um no lixo. Overlays de dólar aparecem: Lion's Mane $30, Tongkat Ali $40, Ashwagandha $50, Boron $20. Total: $140/mês. Corte pra bag de TMC pousando triunfante na bancada.", format_en:"VO-over-B-roll montage | RTG Video | Format validated Mars Men 'Borrowing'", format_pt:"VO-sobre-B-roll montagem | RTG Video | Formato validado Mars Men 'Borrowing'", speaker_en:"Male VO 40-50, energetic narrator (no on-camera speaker — cost-pain montage)", speaker_pt:"VO masculino 40-50, narrador energético (sem speaker on-camera — montagem cost-pain)", execution_en:"DURATION 60s (RTG). Per Derick feedback: new idea required. Cost-pain hook (Life Cykel pattern, hook-grade). Math reveal: TMC includes everything in those bottles at clinical doses + the foundation (ashwagandha) the others lack. Visual ação primeiro frame (V-4). CTA with 'we'll' (brand voice-over): 365-day money-back, 40% off + free shipping (LEI #4).", execution_pt:"DURAÇÃO 60s (RTG). Conforme feedback do Derick: nova ideia requerida. Cost-pain hook (Life Cykel pattern, hook-grade). Revelação matemática: TMC inclui tudo daqueles potes em doses clínicas + a foundation (ashwagandha) que os outros não têm. Ação visual primeiro frame (V-4). CTA com 'we'll' (brand voice-over): 365-day money-back, 40% off + frete grátis (LEI #4).",v:2},
  {id:36, day:3, dayLabel_en:"Wednesday", dayLabel_pt:"Quarta", date:"07/05/26", cluster_en:"C2 Muscles & Gym — Zero Drive", cluster_pt:"C2 Músculos & Academia — Sem Vontade", type:"fill", title_en:"RTG Image: Timeline Static", title_pt:"RTG Image: Static de Linha do Tempo", angle_en:"Progressive results visualization", angle_pt:"Visualização de resultados progressivos", hookCopy_en:"\"Week 1 → Subtle. Week 3 → Noticeable. Week 6 → Undeniable.\"", hookCopy_pt:"\"Semana 1 → Sutil. Semana 3 → Notável. Semana 6 → Inegável.\"", hookVisual_en:"Timeline progression graphic with milestone markers, TMC cup at start. Subhead: 'What happens when you replace your morning coffee with TMC.'", hookVisual_pt:"Gráfico de progressão de linha do tempo com marcadores de marco, xícara TMC no início. Subhead: 'O que acontece quando você substitui seu café da manhã por TMC.'", format_en:"Static Image — Timeline (Retargeting)", format_pt:"Imagem Estática — Linha do Tempo (Retargeting)", speaker_en:"N/A (image only)", speaker_pt:"N/A (apenas imagem)", execution_en:"Clean timeline infographic. 3 milestones. TMC product anchoring start. Warm gradient. CTA: 'Start your timeline → 90 days risk-free.'", execution_pt:"Infográfico de linha do tempo limpo. 3 marcos. Produto TMC ancorando o início. Gradiente quente. CTA: 'Comece sua linha do tempo → 365 dias money-back guarantee.'"},
  {id:37, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"winner", title_en:"Winner Var 7: Red/Auburn Hair", title_pt:"Winner Var 7: Cabelo Ruivo/Acobreado", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Same reference composition exactly — torso shot, no face. Gray heather t-shirt soaked through, hand pulling shirt outward, wedding ring visible. Same bedroom, clock 2:15 AM, messy bed. Only change: red/auburn hair — disheveled, slightly damp, waves or slight curl, falling past shoulder. 4:5 vertical.", hookVisual_pt:"Mesma composição exata — torso sem rosto. Camiseta cinza encharcada, aliança visível. Única mudança: cabelo ruivo/acobreado — despenteado, levemente úmido, ondulado. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does hair color (red vs brunette vs blonde) affect performance? Three-way color test with V1/V4/V7.", execution_pt:"Copy VERBATIM. Teste: Cor do cabelo (ruivo vs castanho vs loiro) afeta performance? Teste triplo com V1/V4/V7."},
  {id:38, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"winner", title_en:"Winner Var 8: Messy Bun — Sweaty Flyaways", title_pt:"Winner Var 8: Coque Bagunçado — Fios Suados", angle_en:"Wife Testimonial — Night Sweats (image variation only, copy verbatim)", angle_pt:"Testemunho da Esposa — Suor Noturno (variação só de imagem, copy verbatim)", hookCopy_en:"Copy VERBATIM from B13 winner", hookCopy_pt:"Copy VERBATIM do winner B13", hookVisual_en:"Camera angle raised — frame from mid-chest to just below chin/jaw. Hair thrown up in hasty messy bun — improvised, asymmetric, loose strands falling. Sweaty flyaways sticking to temples and back of neck. Same gray t-shirt, soaked. Wedding ring visible. Clock 2:15 AM in background. Raw iPhone aesthetic. 4:5 vertical.", hookVisual_pt:"Ângulo levantado — enquadramento do meio do peito até o queixo. Cabelo jogado em coque bagunçado — improvisado, assimétrico. Fios suados grudados nas têmporas e pescoço. Camiseta cinza encharcada. Aliança visível. Relógio 2:15 AM. 4:5 vertical.", format_en:"Native long-form image (raw phone photo) | Winner Variation", format_pt:"Imagem native long-form (foto crua de celular) | Winner Variation", speaker_en:"Married woman (narrator)", speaker_pt:"Mulher casada (narradora)", execution_en:"Copy VERBATIM. Test: Does 'threw hair up to cool down' gesture signal higher intensity of exertion than hair-down?", execution_pt:"Copy VERBATIM. Teste: 'Prendeu o cabelo pra refrescar' sinaliza maior intensidade do que cabelo solto?"},
  {id:39, day:4, dayLabel_en:"Thursday", dayLabel_pt:"Quinta", date:"08/05/26", cluster_en:"C2 Muscles & Gym — No Pump", cluster_pt:"C2 Músculos & Academia — Sem Pump", type:"fill", title_en:"ACQ Native Image: The Flat Arm (Format A)", title_pt:"ACQ Native Image: O Braço Murcho (Format A)", angle_en:"Married man finds 2018 Instagram photo of his peak body — visual proof of decline as intimate shame trigger", angle_pt:"Homem casado acha foto de Instagram de 2018 do seu corpo no auge — prova visual de decadência como gatilho íntimo de vergonha", hookCopy_en:"\"Steve hadn't taken a shirtless photo in three years. He found one from 2018 on his old Instagram. The man in the photo looked like a stranger he used to be.\"", hookCopy_pt:"\"Steve não tirava uma foto sem camisa há três anos. Encontrou uma de 2018 no Instagram antigo dele. O homem da foto parecia um estranho que ele costumava ser.\"", hookVisual_en:"SHOCK CREATIVE (Phone screenshot side-by-side): LEFT: Old Instagram post from 2018 — Steve flexing on a beach, veins visible, completely 'swoll', caption '53 and crushing it!' 247 likes. RIGHT: Recent bathroom mirror selfie — same arm, completely flat, no veins, no definition, no pump. Single screenshot, two states. [Category: Identity Loss / Body Shame]", hookVisual_pt:"SHOCK CREATIVE (Screenshot celular side-by-side): ESQUERDA: Post antigo do Instagram de 2018 — Steve flexionando na praia, veias visíveis, completamente 'swoll', caption '53 and crushing it!' 247 likes. DIREITA: Selfie recente no espelho do banheiro — mesmo braço, completamente plano, sem veias, sem definição, sem pump. Único screenshot, dois estados. [Category: Identity Loss / Body Shame]", format_en:"Long-form native image (Format A — cold traffic narrative) | Skill: long-form-native-ad-writer", format_pt:"Native long-form image (Format A — narrativa cold traffic) | Skill: long-form-native-ad-writer", speaker_en:"Male first-person — Steve, 53, married 22 years", speaker_pt:"Primeira pessoa masculina — Steve, 53, casado há 22 anos", execution_en:"HEADLINE: 'I found a photo of myself from 2018 that I don't remember being able to take anymore.' | NARRATIVE ~1800w (intimate/embarrassing per Derick): ESCALATION: Steve hides old photos on iPhone, stops going to pool with kids, buys looser shirts. Day he randomly opens Instagram — SHOCK MOMENT. He takes off shirt, flexes, snaps photo. Contrast devastating. FAILED SOLUTIONS: expensive pre-workout → L-citrulline → arginine → doctor said 'you're 53'. MECHANISM: NO pathway depends on T + endothelial function. T dropped, NO production crashed. DISCOVERY: TMC. TRANSFORMATION: the photo he takes again, 4 months later. CTA (LEI #4).", execution_pt:"HEADLINE: 'Encontrei uma foto minha de 2018 que não me lembro mais de conseguir tirar.' | NARRATIVA ~1800w (íntimo/constrangedor conforme Derick): ESCALATION: Steve esconde fotos antigas no iPhone, para de ir na piscina com filhos, compra camisas mais largas. Dia que abre Instagram aleatório — MOMENTO DE CHOQUE. Tira camisa, flexiona, tira foto. Contraste devastador. FAILED SOLUTIONS: pre-workout caro → L-citrulina → arginina → médico falou 'você tem 53'. MECHANISM: via NO depende de T + função endotelial. T caiu, produção de NO desabou. DISCOVERY: TMC. TRANSFORMATION: a foto que ele tira de novo, 4 meses depois. CTA (LEI #4).",v:2},
